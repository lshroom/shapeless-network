<!DOCTYPE html>
<!-- destinys-child — animation video → 5D audio-reactive world. Companion to pieces-of-peace.html.
     Phase-1 (browser-only): luminance-as-depth proxy, FFT bindings, cymatic shader, particles, 5 scenes.
     Phase-2 (offline bake): replace luminance proxy with float32 EXR depth from Video Depth Anything,
     swap reactive plane for full-precision PLY 3DGS from Lyra/DrawingSpinUp. See docs/PLAN_VIDEO_TO_5D_AUDIO_REACTIVE.md. -->
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<script>
  // Feed is home. If arriving directly (not via the in-app Worlds tab), redirect there.
  if (!new URLSearchParams(location.search).has('world') &&
      !document.referrer.includes(location.hostname)) {
    location.replace('/feed.html');
  }
</script>
<title>destiny's child — Lightning Saturday × Amhazing — quantum field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --ink:#f5f5f7; --ink-mute:rgba(245,245,247,.58); --ink-faint:rgba(245,245,247,.38);
    --hair:rgba(255,255,255,.08); --hair-strong:rgba(255,255,255,.14);
    --panel:rgba(18,18,22,.55); --panel-solid:rgba(22,22,26,.82);
    --chip:rgba(255,255,255,.06); --chip-hover:rgba(255,255,255,.11);
    --accent:#8b9bff; --accent-tint:rgba(139,155,255,.18);
    --radius:14px; --shadow:0 12px 40px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.04) inset;
    --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0;z-index:1}
  #video{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;}
  #brand{position:fixed;top:90px;left:16px;z-index:14;display:flex;align-items:center;gap:10px;pointer-events:none}
  #brand .wm{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.02em;opacity:.92}
  .panel{position:fixed;z-index:10;background:var(--panel-solid);border:1px solid var(--hair);border-radius:999px;backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:var(--shadow);font-size:13px;line-height:1.5}
  button, label.btn{background:var(--chip);color:var(--ink);border:1px solid var(--hair);padding:7px 12px;border-radius:9px;cursor:pointer;font:inherit;font-size:12px;font-weight:500;min-height:30px;transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);letter-spacing:.01em}
  button:hover, label.btn:hover{background:var(--chip-hover);border-color:var(--hair-strong)}
  button:active{transform:scale(.97)}
  /* ── Toolbar ── */
  #faces{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:13;width:min(800px,calc(100vw - 16px));background:var(--panel-solid);border:1px solid var(--hair);border-radius:14px;backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:var(--shadow);font-size:12px;color:var(--ink);overflow:hidden}
  /* Transport row — always visible (tabs live inside on the right) */

  #faces:not(.open) #facesTransport{border-bottom:none}

  #facesTransport input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent}
  #facesTransport input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair-strong);border-radius:2px}
  #facesTransport input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);margin-top:-4.5px;cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
  #seek{flex:1;min-width:60px}
  #volFader{width:68px;flex-shrink:0}
  #time{color:var(--ink-mute);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 3px}
  #btnPlay,#btnVol{background:transparent;border:0;color:var(--ink-mute);padding:5px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;min-height:0;transition:background .15s,color .15s}

  #facesTransport label.tbtn,#facesTransport button.tbtn{background:var(--chip);border:1px solid var(--hair);color:var(--ink);padding:4px 10px;border-radius:8px;font:inherit;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:0;transition:background .15s}
  #facesTransport label.tbtn:hover,#facesTransport button.tbtn:hover{background:var(--chip-hover)}

  .tab:hover{background:var(--chip);color:var(--ink)}

  /* Body panel */
  #facesBody{display:none;padding:10px 12px 14px;max-height:min(400px,65vh);overflow-y:auto}
  #faces.open #facesBody{display:block}
  .tab-section{display:none}
  .tab-section.active{display:block}
  /* Rabbit hole */
  .rh-row{display:flex;gap:6px;padding:4px 0 6px}
  .rh-big{flex:1;padding:11px 8px;font-size:12px;font-weight:500;border-radius:10px;background:var(--chip);border:1px solid var(--hair);cursor:pointer;transition:background .15s}

  details.cube>summary:hover{background:rgba(255,255,255,.05)}
  details.cube>summary::-webkit-details-marker{display:none}
  details.cube>summary::before{content:'▸';margin-right:8px;display:inline-block;transition:transform .25s var(--ease);opacity:.55}
  details.cube[open]>summary::before{transform:rotate(90deg)}
  details.face{margin:2px 4px;border-radius:8px;overflow:hidden}
  details.face>summary{list-style:none;padding:7px 10px 7px 26px;cursor:pointer;color:var(--ink-mute);font-size:11.5px;border-radius:8px;transition:background .15s var(--ease),color .15s var(--ease)}
  details.face>summary:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  details.face>summary::-webkit-details-marker{display:none}
  details.face>summary::before{content:'▸';margin-right:6px;opacity:.45;transition:transform .25s var(--ease)}
  details.face[open]>summary{color:var(--ink)}
  details.face[open]>summary::before{transform:rotate(90deg);opacity:.8}
  .face-ctrls{display:flex;flex-direction:column;gap:6px;padding:6px 10px 10px 26px}
  .face-ctrls .row{display:flex;align-items:center;gap:6px}
  .face-ctrls label.pick{flex:1;text-align:center;background:var(--chip);padding:6px 8px;border-radius:7px;cursor:pointer;font-size:11px;border:1px solid var(--hair);transition:background .15s var(--ease)}
  .face-ctrls label.pick:hover{background:var(--chip-hover)}
  .face-ctrls button.tog{background:var(--chip);border:1px solid var(--hair);color:var(--ink);padding:5px 9px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit}
  .face-ctrls button.tog.on{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}
  .face-ctrls input[type=range]{flex:1;-webkit-appearance:none;height:14px;background:transparent}
  .face-ctrls input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair-strong);border-radius:2px}
  .face-ctrls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-top:-4px;cursor:pointer}

  @media(max-width:600px){#faces{width:calc(100vw - 16px)}#volFader{display:none}}

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { stampfliVertices } from '/src/lib/cube_witness.js';
// Shared shape lists live in /public/shapes-catalog.js. Edit there, not here.
import { STUFF_GLB_ITEMS } from '/shapes-catalog.js';

// ── SOURCES ──────────────────────────────────────────────────────────────
// Packed video: left half = color, right half = grayscale depth (Depth Anything V2 bake).
// Falls back to plain destiny.mp4 if packed file 404s.
const VIDEO_SRC = '/destiny-packed.mp4';
const VIDEO_PACKED = true; // shader splits uv when true
const FFT_SIZE = 2048;

// ── Error overlay (real errors only) + info log (console.log, no overlay) ──
const errbox = document.getElementById('errbox');
const errLog = (...args) => {
  const msg = args.map(a => a?.stack || (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
  errbox.style.display = 'block';
  errbox.textContent = (errbox.textContent + '\n' + new Date().toTimeString().slice(0,8) + ' ' + msg).slice(-2000);
  console.error(...args);
};
// Temporary on-screen status toast (disappears after 4 s)
let _toastEl = null;
function toast(msg, color='#4f4') {
  if (!_toastEl) {
    _toastEl = document.createElement('div');
    _toastEl.style.cssText='position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:#111;border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:12px;font-family:monospace;pointer-events:none;transition:opacity .4s';
    document.body.appendChild(_toastEl);
  }
  _toastEl.style.color = color;
  _toastEl.style.opacity = '1';
  _toastEl.textContent = msg;
  clearTimeout(_toastEl._t);
  _toastEl._t = setTimeout(() => { _toastEl.style.opacity = '0'; }, 4000);
}
const dbg = (...args) => console.log('[destiny]', ...args);
addEventListener('error', e => {
  // Suppress Chrome extension errors (MetaMask, etc.) — they inject into every page
  if (e.filename && e.filename.startsWith('chrome-extension://')) return;
  errLog('window.error:', e.message, e.filename+':'+e.lineno);
});
addEventListener('unhandledrejection', e => {
  const msg = String(e.reason?.message || e.reason || '');
  // Filter all Chrome extension noise — MetaMask, message-channel errors, inpage scripts
  if (
    msg.includes('chrome-extension') ||
    msg.includes('MetaMask') ||
    msg.includes('message channel closed') ||
    msg.includes('asynchronous response') ||
    msg.includes('extension')
  ) return;
  errLog('unhandled:', e.reason);
});

// ── DOM ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const video = $('video');
const stage = $('stage');
// Default video so the cube faces always show something instead of a black
// screen — user can still swap it via "+ video" (standalone tool use).
video.muted = true;
video.src = '/effects-lab/cube-default.mp4';
video.play().catch(()=>{});

// ── THREE setup ──────────────────────────────────────────────────────────
// Feed embed (inline preview / fullscreen player) is a small, secondary view —
// lighter rendering settings there keep phones smooth without touching the
// full standalone Worlds experience's fidelity.
const IS_FEED_EMBED = new URLSearchParams(location.search).has('world');
const renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: !IS_FEED_EMBED, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_FEED_EMBED ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.NoToneMapping; // natural colors, no exposure boost
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
// wider FOV (75°) for inside-the-cube immersion
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.01, 1000);
// Start in an immersive corner-of-room view (matches the "ceiling-tilt" angle that read best).
// Inside cube (extends ±8). Looks at origin → sees front wall, floor edge, and a side wall.
camera.position.set(40, 30, 60); // outside inner cube (±24), inside outer (±96)

// ── OrbitControls (orbit/pan/zoom inside cube room, with damping) ──────
// target=origin → orbit around the room's center. Small minDistance lets viewer
// hover near center; maxDistance > cube half lets them pull out to see the whole cube.
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.55;          // slower → easier inside the cube
controls.panSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.minDistance = 0.05;          // can sit nearly at the cube's center
controls.maxDistance = 720;           // outer cube faces at ±192 (2× upgrade); allow room beyond
controls.maxPolarAngle = Math.PI;
controls.enablePan = true;            // pan = move target → fly through interior
controls.target.set(0, 0, 0);
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// ── Video texture (source frames; also used as luminance-depth proxy) ──
const videoTex = new THREE.VideoTexture(video);
videoTex.colorSpace = THREE.SRGBColorSpace;
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;
videoTex.wrapS = videoTex.wrapT = THREE.ClampToEdgeWrapping;

// ── Reactive plane (vertex-displaced by luminance × audio bands) ────────
// 6-face cube room: same displaced shader on every face, viewer at center.
// Bigger room (16 vs 8) so you can swim in. Subdiv 256² × 6 faces ≈ 400k verts.
const FACE_SIZE = 48;
const FACE_SUB = IS_FEED_EMBED ? 96 : 384;
const planeGeo = new THREE.PlaneGeometry(FACE_SIZE, FACE_SIZE, FACE_SUB, FACE_SUB);
const reactiveMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:       { value: 0 },
    uVideo:      { value: videoTex },
    uBass:       { value: 0 },
    uMid:        { value: 0 },
    uHigh:       { value: 0 },
    uCentroid:   { value: 0.5 },
    uFlux:       { value: 0 },
    uBeat:       { value: 0 },
    uScene:      { value: 0 },
    uHueShift:   { value: 0 },
    uCymaticM:   { value: 3 },
    uCymaticN:   { value: 5 },
    uAlphaA:     { value: 1.0 },
    uAlphaB:     { value: 0.0 },
    uPhase:      { value: 0.0 },
    uSuper:      { value: 0.0 },
    uDepthScale: { value: 14.0 },
    uPointBase:  { value: 0.18 },
    uViewport:   { value: new THREE.Vector2(innerWidth, innerHeight) },
    uVideoIsPacked: { value: 1.0 },
    uFlipX:      { value: 0.0 },
    uSplatHardness: { value: 14.0 },  // Gaussian falloff (lower = softer)
    uBrightness: { value: 1.0 },      // color multiplier
    uAlphaScale: { value: 1.0 },      // overall alpha multiplier
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vDepth;
    varying float vSize;
    uniform sampler2D uVideo;
    uniform float uTime, uBass, uMid, uHigh, uCentroid, uFlux, uBeat, uScene;
    uniform float uCymaticM, uCymaticN;
    uniform float uAlphaA, uAlphaB, uPhase, uSuper;
    uniform float uDepthScale;
    uniform float uPointBase;
    uniform vec2  uViewport;
    uniform float uVideoIsPacked;
    uniform float uFlipX;

    // Packed-video UV split: left half color, right half depth.
    // uFlipX mirrors horizontally (used by inner cube viewed from outside).
    vec2 colorUv(vec2 uv) {
      float x = mix(uv.x, 1.0 - uv.x, uFlipX);
      return mix(vec2(x, uv.y), vec2(x*0.5, uv.y), uVideoIsPacked);
    }
    vec2 depthUv(vec2 uv) {
      float x = mix(uv.x, 1.0 - uv.x, uFlipX);
      return mix(vec2(x, uv.y), vec2(x*0.5 + 0.5, uv.y), uVideoIsPacked);
    }
    float depthSample(vec2 uv) {
      return texture2D(uVideo, depthUv(uv)).r;
    }

    void main() {
      vUv = uv;
      // Sample baked depth (right half) and color (left half) of packed video.
      float d = depthSample(uv);
      vDepth = d;
      vColor = texture2D(uVideo, colorUv(uv)).rgb;
      // Local depth gradient → splat size grows on cliffs/edges (silhouette pop).
      vec2 px = vec2(1.0/256.0);
      float dx = depthSample(uv + vec2(px.x, 0.0)) - depthSample(uv - vec2(px.x, 0.0));
      float dy = depthSample(uv + vec2(0.0, px.y)) - depthSample(uv - vec2(0.0, px.y));
      float grad = length(vec2(dx, dy));
      // Displace along face normal (PlaneGeometry default = +Z in local space).
      vec3 pos = position;
      pos.z += (d - 0.5) * uDepthScale * (1.0 + 0.6*uBass);
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;
      // Perspective-correct billboard size; fattens on edges to fill cliffs.
      float dist = -mv.z;
      float size = uPointBase * (1.0 + grad * 8.0);
      gl_PointSize = clamp(size * (uViewport.y * 0.5) / max(dist, 0.001), 2.0, 256.0);
      vSize = size;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vColor;
    varying float vDepth;
    varying float vSize;
    uniform float uBass;

    uniform float uSplatHardness;
    uniform float uBrightness;
    uniform float uAlphaScale;

    void main() {
      // Soft circular billboard with Gaussian alpha falloff (the "splat" shape).
      vec2 q = gl_PointCoord - 0.5;
      float r2 = dot(q, q);
      if (r2 > 0.25) discard;
      float alpha = exp(-r2 * uSplatHardness) * uAlphaScale;
      // Subtle spherical-harmonic-style shading: brighten on the close layer,
      // dim on the far layer → adds depth cue independent of color.
      vec3 col = vColor * mix(0.78, 1.12, vDepth) * uBrightness;
      gl_FragColor = vec4(col, alpha);
    }
  `,
  side: THREE.DoubleSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
});
// ── Build 6-face cube room (viewer inside, every wall is the displaced video) ──
// PlaneGeometry default normal is +Z. Each face is positioned then rotated so its
// +Z faces the cube center → displacement (pos.z += depth) bulges toward viewer.
const HALF = FACE_SIZE / 2;
// Inner cube viewed from OUTSIDE → faces point outward (normals away from origin).
// Text reads correctly, and displacement bulges toward the outer viewer.
const FACES = [
  { name:'front',  pos:[0, 0, -HALF], rot:[0, Math.PI, 0] },           // outward = −Z
  { name:'back',   pos:[0, 0,  HALF], rot:[0, 0, 0] },                 // outward = +Z
  { name:'left',   pos:[-HALF, 0, 0], rot:[0, -Math.PI/2, 0] },        // outward = −X
  { name:'right',  pos:[ HALF, 0, 0], rot:[0,  Math.PI/2, 0] },        // outward = +X
  { name:'floor',  pos:[0, -HALF, 0], rot:[ Math.PI/2, 0, 0] },        // outward = −Y

// Wall spacing: scales the outer cube's distance from center (inner cube
// stays put) — widens or tightens the gap between the inner showpiece cube
// and the outer room walls, same idea as Synesthesia's inner/outer spacing.
function applyWallSpacing(mult){
  for (const f of ALL_FACES) {
    if (f.cube !== 'outer') continue;
    const [bx, by, bz] = f._basePos;
    f.mesh.position.set(bx * mult, by * mult, bz * mult);

}

let _activePack = null;
function loadWorldPack(worldId) {
  if (_activePack) { try { _activePack.dispose(); } catch(_){} centerGroup.remove(_activePack.group); _activePack = null; }

async function addStem(file, panelBody, presetUrl=null, presetName=null, presetAssetId=null) {

function refreshStemSelects() {
  for (const o of CENTER_OBJS) {
    if (!o.selectEl) continue;

  }
}

function readStemLevel(stem) {
  if (!stem || !stem.analyser) return 0;
  stem.analyser.getByteFrequencyData(stem.freq);
  let s = 0;
  for (let i = 0; i < stem.freq.length; i++) s += stem.freq[i];
  const avg = s / (stem.freq.length * 255);
  stem.level += (avg - stem.level) * 0.25; // smooth
  return stem.level;
}

function updateStemObjects(t, dt) {
  for (const o of CENTER_OBJS) {
    let level = 0;
    if (o.boundStemId) {
      const stem = STEMS.find(s => s.id === o.boundStemId);
      level = readStemLevel(stem);
    }
    const target = 1 + level * 1.6;
    o.baseScale += (target - o.baseScale) * Math.min(1, dt * 6);
    o.mesh.scale.setScalar(o.baseScale * (o._userScale || 1));
    o.mesh.rotation.x += o.spin[0] * dt * (1 + level);
    o.mesh.rotation.y += o.spin[1] * dt * (1 + level);
    o.mesh.rotation.z += o.spin[2] * dt * (1 + level);
  }
}

// ── Per-frame audio features ─────────────────────────────────────────────
function readAudio() {
  if (!analyser) return { bass:0, mid:0, high:0, centroid:0.5, flux:0, beat:0 };
  analyser.getByteFrequencyData(freqData);
  const N = freqData.length;
  const sub = avg(freqData, 0, 6) / 255;
  const bass = avg(freqData, 6, 24) / 255;
  const lowMid = avg(freqData, 24, 80) / 255;
  const mid = avg(freqData, 80, 200) / 255;
  const high = avg(freqData, 200, N) / 255;
  // centroid (normalized)
  let weighted = 0, total = 0;
  for (let i = 0; i < N; i++) { weighted += i * freqData[i]; total += freqData[i]; }
  const centroid = total > 0 ? (weighted / total) / N : 0.5;
  // spectral flux
  let flux = 0;
  for (let i = 0; i < N; i++) {
    const v = freqData[i] / 255;
    const d = v - lastSpec[i];
    if (d > 0) flux += d;
    lastSpec[i] = v;
  }
  flux /= N;
  // beat onset (flux jump)
  const beat = Math.max(0, flux - lastFlux * 0.96);
  lastFlux = flux;
  return { sub, bass, mid, high, lowMid, centroid, flux, beat: Math.min(1, beat * 6) };
}
function avg(arr, lo, hi){ let s=0; const n=Math.max(1, hi-lo); for (let i=lo;i<hi;i++) s += arr[i]; return s/n; }

// ── Time ─────────────────────────────────────────────────────────────────
function fmt(s){ s=Math.max(0,s|0); const m=(s/60)|0, ss=(s%60).toString().padStart(2,'0'); return `${m}:${ss}`; }

// ── Superposition state (α-pair + phase) ────────────────────────────────
// |αA|² + |αB|² = 1 always. Drift toward 50/50 in superposition scenes,
// snap toward A or B on dwell-collapse. Phase φ rotates with chord centroid.
const sup = { aA: 1.0, aB: 0.0, target: 0.0, phase: 0.0, super: 0.0 };
function updateSuperposition(t, dt, audio, sceneIdx) {
  // engaged in scene 2 (superposition) and scene 4 (collapse)
  const wantSuper = (sceneIdx === 2) ? 1.0 : (sceneIdx === 4 ? 0.7 : 0.0);
  sup.super += (wantSuper - sup.super) * Math.min(1, dt * 1.5);
  // phase from circle-of-fifths analogue (centroid drives rotation)
  sup.phase += dt * (0.4 + audio.centroid * 1.6);
  // smoothly approach target amplitude split
  // sup.target ∈ [-1,1]: -1 → all A, +1 → all B, 0 → 50/50
  const desiredA = Math.cos((sup.target * 0.5 + 0.5) * Math.PI * 0.5);
  const desiredB = Math.sin((sup.target * 0.5 + 0.5) * Math.PI * 0.5);
  const k = Math.min(1, dt * 2.5);
  sup.aA += (desiredA - sup.aA) * k;
  sup.aB += (desiredB - sup.aB) * k;
  // renormalize (numerical safety)
  const norm = Math.hypot(sup.aA, sup.aB) || 1;
  sup.aA /= norm; sup.aB /= norm;
}

// ── Dwell / gaze fallback (mouse-rest = fixation) ───────────────────────
const dwell = { x: 0.5, y: 0.5, lastMove: performance.now(), fixated: 0 };
addEventListener('pointermove', e => {
  dwell.x = e.clientX / innerWidth;
  dwell.y = e.clientY / innerHeight;
  dwell.lastMove = performance.now();
  dwell.fixated = 0;
});
function updateDwell(now) {
  const stillMs = now - dwell.lastMove;
  // fixated grows from 0→1 over 1.2s of stillness
  dwell.fixated = Math.max(0, Math.min(1, (stillMs - 200) / 1000));
  // collapse trigger when fixated && in superposition mode
  if (dwell.fixated > 0.95 && sup.super > 0.5) {
    // collapse to A if cursor on left half, B if right half
    sup.target = dwell.x < 0.5 ? -1 : 1;
  } else if (sup.super > 0.5 && dwell.fixated < 0.1) {
    // drift back toward 50/50 when user moves again
    sup.target *= 0.94;

// ── Narrative FSM (8 states, RMS envelope driven) ───────────────────────
// silence → intro → verse → pre-chorus → chorus → break → outro → collapse
const FSM = ['silence','intro','verse','pre-chorus','chorus','break','outro','collapse'];
const fsm = { state: 0, energy: 0, dEnergy: 0, lastE: 0, hold: 0 };
function updateFSM(t, dt, audio, sceneIdx) {
  // smoothed energy proxy
  const e = (audio.bass*0.5 + audio.mid*0.3 + audio.high*0.2);
  fsm.energy += (e - fsm.energy) * Math.min(1, dt * 1.5);
  fsm.dEnergy = (fsm.energy - fsm.lastE) / Math.max(dt, 1e-3);
  fsm.lastE = fsm.energy;
  fsm.hold += dt;
  // require minimum hold per state (avoid jitter)
  if (fsm.hold < 1.4 && fsm.state !== 7) return;
  let next = fsm.state;
  if (sceneIdx === 4) next = 7; // scene=collapse forces FSM=collapse
  else if (fsm.energy < 0.06) next = 0; // silence
  else if (fsm.energy < 0.18 && fsm.dEnergy > 0.04) next = 1; // intro (rising low)
  else if (fsm.energy < 0.30 && Math.abs(fsm.dEnergy) < 0.05) next = 2; // verse (steady low/mid)
  else if (fsm.dEnergy > 0.06 && fsm.energy < 0.50) next = 3; // pre-chorus (rising mid)
  else if (fsm.energy >= 0.45) next = 4; // chorus (high energy)
  else if (fsm.dEnergy < -0.06 && fsm.energy > 0.20) next = 5; // break (falling)
  else if (fsm.dEnergy < -0.04 && fsm.energy < 0.20) next = 6; // outro
  if (next !== fsm.state) { fsm.state = next; fsm.hold = 0; }
}

// ── Main loop ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frames=0, lastFps=performance.now();
function tick() {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  const a = readAudio();
  const _sb = window.__shapelessBands;
  if (_sb) {
    a.bass=_sb.bass; a.mid=_sb.mids; a.high=_sb.highs; a.sub=_sb.sub;
    a.flux=_sb.flux||_sb.energy; a.beat=_sb.kick||0;
    a.centroid=(_sb.centroidHue||0)/360; a.snare=_sb.snare||0; a.hats=_sb.hats||0;
    a.hatType=_sb.hatType||0; a.domNote=_sb.domNote||0;
  }
  // bind
  reactiveMat.uniforms.uTime.value = t;
  reactiveMat.uniforms.uBass.value = a.bass;
  reactiveMat.uniforms.uMid.value = a.mid;
  reactiveMat.uniforms.uHigh.value = a.high;
  reactiveMat.uniforms.uCentroid.value = a.centroid;
  reactiveMat.uniforms.uFlux.value = a.flux;
  reactiveMat.uniforms.uBeat.value = a.beat;
  // outer cube + any per-face clones (innerMat == reactiveMat, already synced above)
  for (const M of MATS_TO_SYNC) {
    const u = M.uniforms;
    u.uTime.value = t;
    u.uBass.value = a.bass;
    u.uMid.value = a.mid;
    u.uHigh.value = a.high;
    u.uCentroid.value = a.centroid;
    u.uFlux.value = a.flux;
    u.uBeat.value = a.beat;
  }
  // Three.js r160 auto-updates VideoTextures via requestVideoFrameCallback.
  // Only manually update cube-face override textures (non-VideoTexture images).
  for (const mat of [innerMat, outerMat]) {
    const ct = mat.userData.cubeTex;
    if (ct && ct.image && ct.image.readyState >= 2) ct.needsUpdate = true;
  }
  // drive center stem-objects (defined later)
  if (typeof updateStemObjects === 'function') updateStemObjects(t, dt);
  if (_activePack) { try { _activePack.update(window.__shapelessBands, dt, t); } catch(e) { console.warn('[dc] pack update err:', e); _activePack = null; } }

  // ── ALL_FACES spatial mapping ──
  // inner faces: bass→depth (displacement), mids→Y position drift
  // outer faces: snare→scale pulse, kick→position push, hats→rotation
  for (const F of ALL_FACES) {
    if (!F.mesh) continue;
    if (!F._baseDepth) continue;
    if (!F.mesh.userData._kickS) F.mesh.userData._kickS=1;
    F.mesh.userData._kickS = F.mesh.userData._kickS*0.86 + 0.14*(1+(a.beat||0)*0.18);
    const ks = F.mesh.userData._kickS;
    if (F.isOuter) {
      // outer: snare scale + kick jolt (additive on base pos) + hats spin
      const snareBoost = 1 + (a.snare||0)*0.12;
      F.mesh.scale.setScalar(ks * snareBoost);
      const ud = F.mesh.userData;
      if (!ud._jx) { ud._jx = 0; ud._jy = 0; }
      const beat = a.beat||0;
      if (beat > 0.3) { ud._jx += (Math.random()-0.5)*beat*0.8; ud._jy += (Math.random()-0.5)*beat*0.5; }
      ud._jx *= 0.94; ud._jy *= 0.94;
      F.mesh.position.x = F._basePos[0] + ud._jx;
      F.mesh.position.y = F._basePos[1] + ud._jy;
      F.mesh.rotation.y += (a.hats||0)*0.015;
    } else {
      // inner: bass→scale, mids→Y oscillation additive on base Y
      const depthScale = 1 + a.bass*0.15;
      F.mesh.scale.setScalar(depthScale * ks);
      F.mesh.position.y = F._basePos[1] + Math.sin(t*1.2 + F._baseDepth*0.1)*a.mid*0.8;
    }
  }

  // ── CENTER OBJECTS: centroid hue + kick scale ──
  if (typeof CENTER_OBJS !== 'undefined') {
    for (const o of CENTER_OBJS) {
      if (o.mesh && o.mesh.material && o.mesh.material.color) {
        o.mesh.material.color.setHSL((a.centroid||0)+t*0.01, 0.8, 0.5+a.bass*0.2);
      }
    }
  }

  // ── CAMERA SHAKE on kick + snare ──
  if ((a.beat||0) > 0.3 || (a.snare||0) > 0.25) {
    const sh = (a.beat||0)*0.6 + (a.snare||0)*0.35;
    camera.position.x += (Math.random()-0.5)*sh;
    camera.position.y += (Math.random()-0.5)*sh*0.5;
  }

  // Hairball sway animation
  if (_hairballGroup?.visible) _hairballGroup.children.forEach(m => { m.material.uniforms.uTime.value = t; m.material.uniforms.uSway.value = _hairballParams.sway; });
  applySwim(dt);
  controls.update();
  // playhead sync (skip while user drags slider) — when a separate song is
  // loaded (feed embed), the playhead follows the SONG, not the short
  // looping background video, which has its own much shorter duration.
  const playheadSrc = _sepAudio || video;
  if (playheadSrc.duration && !seekActive) {
    const seek = $('seek');
    if (seek) seek.value = (playheadSrc.currentTime / playheadSrc.duration) * 1000;
    const timeEl = $('time');
    if (timeEl) timeEl.textContent = `${fmtT(playheadSrc.currentTime)} / ${fmtT(playheadSrc.duration)}`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ── Jellyfish swim mode (WASD / arrows / on-screen D-pad) ───────────────
// Translates BOTH camera and target along look-direction → real flythrough,
// not orbit. Inertial: keyboard sets a velocity vector that decays each frame.
const swim = { fwd:0, side:0, up:0, vel: new THREE.Vector3() };
const KEYS = {
  'w':'fwd+','arrowup':'fwd+','s':'fwd-','arrowdown':'fwd-',
  'a':'side-','arrowleft':'side-','d':'side+','arrowright':'side+',
  'q':'up+','pageup':'up+','e':'up-','pagedown':'up-',
};
function setKey(k, v) {
  const tag = KEYS[k];
  if (!tag) return false;
  const sign = tag.endsWith('+') ? v : -v;
  if (tag.startsWith('fwd'))  swim.fwd  = sign;
  if (tag.startsWith('side')) swim.side = sign;
  if (tag.startsWith('up'))   swim.up   = sign;
  return true;
}
addEventListener('keydown', e => { if (setKey(e.key.toLowerCase(), 1)) e.preventDefault(); });
addEventListener('keyup',   e => { if (setKey(e.key.toLowerCase(), 0)) e.preventDefault(); });

// On-screen D-pad: large tap targets, hold-to-move via pointer events
function holdBtn(id, axis, sign) {
  const b = $(id);
  if (!b) return;
  const start = e => { swim[axis] = sign; e.preventDefault(); };
  const stop  = () => { swim[axis] = 0; };
  b.addEventListener('pointerdown', start);
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointercancel', stop);
  b.addEventListener('pointerleave', stop);
}
holdBtn('dF','fwd', 1); holdBtn('dB','fwd',-1);
holdBtn('dL','side',-1); holdBtn('dR','side', 1);
holdBtn('dU','up',  1); holdBtn('dD','up', -1);

// Each frame: integrate swim velocity, translate camera+target together
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);
const _swimTgt = new THREE.Vector3(), _swimStep = new THREE.Vector3();
function applySwim(dt) {
  camera.getWorldDirection(_fwd);
  _right.crossVectors(_fwd, _up).normalize();
  _swimTgt.set(0,0,0)
    .addScaledVector(_fwd,   swim.fwd)
    .addScaledVector(_right, swim.side)
    .addScaledVector(_up,    swim.up);
  const isSmall = _swimTgt.lengthSq() < 0.001;
  swim.vel.lerp(_swimTgt.multiplyScalar(24.0), Math.min(1, dt*5));
  _swimStep.copy(swim.vel).multiplyScalar(dt);
  camera.position.add(_swimStep);
  controls.target.add(_swimStep);
  if (isSmall) swim.vel.multiplyScalar(Math.max(0, 1 - dt*2.5));
}

// ── Persistent assets server (D:/STEMS via FastAPI on :5181) ───────────
// Files uploaded to the page get POST'd here, stored on disk, returned as
// stable URLs that survive page reloads. State persistence references the
// asset IDs; the next reload re-fetches the same URL.
const ASSET_BASE = 'http://127.0.0.1:5181';
async function uploadAsset(file) {
  try {
    const fd = new FormData();
    fd.append('file', file, file.name);
    dbg('uploading', file.name, file.size, 'bytes →', ASSET_BASE);
    const r = await fetch(ASSET_BASE + '/asset/upload', { method:'POST', body:fd });
    if (!r.ok) {
      const txt = await r.text().catch(()=>'');
      throw new Error('upload HTTP ' + r.status + ' ' + txt.slice(0,200));
    }
    const j = await r.json();
    dbg('uploaded', j.id, j.url);
    return j;
  } catch (e) {
    errLog('uploadAsset failed for', file?.name, '-', e.message);
    throw e;
  }
}
async function listAssets() {
  try { const r = await fetch(ASSET_BASE + '/asset/list'); return r.ok ? r.json() : []; }
  catch (e) { return []; }
}
async function deleteAsset(id) {
  try { await fetch(ASSET_BASE + '/asset/' + encodeURIComponent(id), { method:'DELETE' }); }
  catch (e) {}
}

  // VIDEO MESH — flat textured plane, no displacement, no splat
  { name:'Video · plain', mode:'video' },
];
function applyStylePresetToFace(F, preset) {
  // Switch render mode if needed
  ensureFaceRenderModes(F);
  if (preset.mode === 'splat') {
    F.mesh.visible = true;
    if (F.videoMesh) F.videoMesh.visible = false;
    const u = F.mat.uniforms;
    const rawDepth = F._baseDepth * (preset.uDepthScale / 14);
    u.uDepthScale.value     = F.cube === 'inner' ? Math.min(rawDepth, 12) : rawDepth;
    u.uPointBase.value      = F._basePoint * (preset.uPointBase / 0.18);
    u.uSplatHardness.value  = preset.uSplatHardness;
    u.uBrightness.value     = preset.uBrightness;
    u.uAlphaScale.value     = preset.uAlphaScale;
    F.mat.blending = preset.blending;
    F.mat.needsUpdate = true;
  } else { // video plain
    F.mesh.visible = false;
    F.videoMesh.visible = true;
    F.videoMesh.material.wireframe = false;
    // make sure the videoMesh's texture is whatever the face's mat currently uses
    F.videoMesh.material.map = F.mat.uniforms.uVideo.value;
    // packed videos: only show color half (left side of texture)
    const isPacked = F.mat.uniforms.uVideoIsPacked.value > 0.5;
    if (F.videoMesh.material.map) {
      F.videoMesh.material.map.repeat.set(isPacked ? 0.5 : 1, 1);
      F.videoMesh.material.map.offset.set(0, 0);
    }
    F.videoMesh.material.needsUpdate = true;
  }
}
function ensureFaceRenderModes(F) {
  if (F.videoMesh) return;
  // Lazily build a textured-plane Mesh for "video" / "wire" modes.
  // Reuses the same geometry & local transform as the splat Points.
  const geom = F.mesh.geometry;
  const tex = F.mat.uniforms.uVideo.value;
  const mat = new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide, transparent:false });
  // Mirror inner cube's UV so text reads right (matches uFlipX=1 on shader)
  if (!F.isOuter) {
    // Flip the geometry's uv attribute on a clone — only once per face
    const cloned = geom.clone();
    const uv = cloned.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setX(i, 1 - uv.getX(i));
    uv.needsUpdate = true;
    F.videoMesh = new THREE.Mesh(cloned, mat);
  } else {
    F.videoMesh = new THREE.Mesh(geom, mat);
  }
  F.videoMesh.position.copy(F.mesh.position);
  F.videoMesh.rotation.copy(F.mesh.rotation);
  F.videoMesh.visible = false;
  F.mesh.parent.add(F.videoMesh);
}

// ── Auto stem-split (4 frequency bands from one song) ──────────────────
// Browser-side biquad-filter band split. Not real source separation, but
// each band acts as an independently-bindable stem (sub/bass/mid/high).
async function loadSongAutoSplit(file, panelBody, presetUrl=null, presetName=null, presetAssetId=null) {
  const audioEl = new Audio();
  let url = presetUrl, name = presetName || (file && file.name) || 'song';
  let assetId = presetAssetId;
  if (file && !presetUrl) {
    const a = await uploadAsset(file);
    url = a.url; name = a.name; assetId = a.id;
  }
  audioEl.src = url;
  audioEl.dataset.assetId = assetId || '';
  audioEl.dataset.assetName = name;
  audioEl.loop = true;
  audioEl.crossOrigin = 'anonymous';

  function wireBands() {
    if (!audioCtx) return;
    const src = audioCtx.createMediaElementSource(audioEl);
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    src.connect(masterGain);
    masterGain.connect(audioCtx.destination);
    // Sink for analyser branches: zero-gain → destination, so the audio graph
    // keeps pulling samples through the band analysers without doubling output.
    const sink = audioCtx.createGain();
    sink.gain.value = 0.0;
    sink.connect(audioCtx.destination);
    const bands = [
      { label:name+' · sub',  type:'lowpass',  freq:120,  Q:0.7 },
      { label:name+' · bass', type:'bandpass', freq:250,  Q:1.0 },
      { label:name+' · mid',  type:'bandpass', freq:1500, Q:0.8 },
      { label:name+' · high', type:'highpass', freq:4000, Q:0.7 },
    ];
    for (const b of bands) {
      const filt = audioCtx.createBiquadFilter();
      filt.type = b.type; filt.frequency.value = b.freq; filt.Q.value = b.Q;
      const ana = audioCtx.createAnalyser();
      ana.fftSize = 512; ana.smoothingTimeConstant = 0.7;
      src.connect(filt); filt.connect(ana); ana.connect(sink); // pull-active
      const id = 'stem' + (++_stemId);
      const stem = { id, name:b.label, audioEl, analyser:ana, freq:new Uint8Array(ana.frequencyBinCount), level:0, gain:masterGain, _isBand:true };
      STEMS.push(stem);
      // Compact UI row — band stems share the song's transport
      const row = document.createElement('div');
      row.className = 'face-ctrls';
      row.style.paddingLeft = '14px';
      row.innerHTML = `<div class="row"><span class="src" style="flex:1">${stem.name}</span></div>`;
      panelBody.appendChild(row);
    }
    refreshStemSelects();
  }
  // Single transport row for the whole song
  const transport = document.createElement('div');
  transport.className = 'face-ctrls';
  transport.style.paddingLeft = '14px';
  transport.innerHTML = `
    <div class="row">
      <span class="src" style="flex:1">${name} · auto-split</span>
      <button class="tog play">▶</button>
    </div>
    <div class="row">
      <span style="font-size:10px;color:var(--ink-faint);min-width:36px">vol</span>
      <input type="range" min="0" max="100" value="100" class="vol">
    </div>
  `;
  panelBody.appendChild(transport);
  const playBtn = transport.querySelector('.play');
  const volSl   = transport.querySelector('.vol');
  playBtn.addEventListener('click', async () => {
    if (!audioCtx) startAudio();
    audioCtx?.resume();
    if (!audioEl._wired) { wireBands(); audioEl._wired = true; }
    if (audioEl.paused) { audioEl.muted = false; await audioEl.play().catch(e=>{ if(e.name!=='AbortError') throw e; }); playBtn.textContent='⏸'; }
    else { audioEl.pause(); playBtn.textContent='▶'; }
  });
  volSl.addEventListener('input', () => { audioEl.volume = parseInt(volSl.value,10)/100; });
}

function _stdMesh(geom, color=0x88aaff, opts={}) {
  return new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color, metalness: opts.metalness ?? 0.5, roughness: opts.roughness ?? 0.3,
    emissive: opts.emissive ?? 0x000000, transparent: true, opacity: 1,
  }));
}
function _wireMesh(geom, color=0x66ddee) {
  const e = new THREE.EdgesGeometry(geom);

}

function _pointCloudGeom(verts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  return g;
}
function _paramSurfGeom(uvFn, segU=64, segV=32) {
  const v=[], idx=[];
  for (let j=0;j<=segV;j++) for (let i=0;i<=segU;i++) { const p=uvFn(i/segU, j/segV); v.push(p.x, p.y, p.z); }
  for (let j=0;j<segV;j++) for (let i=0;i<segU;i++) { const a=j*(segU+1)+i, b=a+1, c=a+segU+1, d=c+1; idx.push(a,c,b, b,c,d); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function _attractorGeom(step, n=8000, scale=0.05, x0=0.1, y0=0, z0=0) {
  const v = new Float32Array(n*3);
  let x=x0, y=y0, z=z0;
  for (let i=0;i<n;i++) { const d=step(x,y,z); x+=d[0]; y+=d[1]; z+=d[2]; v[i*3]=x*scale; v[i*3+1]=y*scale; v[i*3+2]=z*scale; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(v, 3)); return g;
}

async function getGLTFLoader() {
  if (_gltfLoader) return _gltfLoader;
  const mod = await import('three/addons/loaders/GLTFLoader.js');
  _gltfLoader = new mod.GLTFLoader();
  return _gltfLoader;

async function replaceCenterObject(obj, libEntry) {
  // Remove old mesh; build new one; preserve position & rotation handlers.
  const oldMesh = obj.mesh;
  const parent = oldMesh.parent;
  let newMesh;
  if (libEntry.kind === 'prim') {
    newMesh = libEntry.build();
  } else {
    try {
      const loader = await getGLTFLoader();
      const gltf = await new Promise((res, rej) => loader.load(libEntry.url, res, undefined, rej));
      newMesh = gltf.scene;
      // Some stuff GLBs reference external textures that 404 — Three.js then crashes in
      // refreshUniformsCommon. Null only the broken slots; keep every working texture.
      const TEX_SLOTS = ['map','normalMap','roughnessMap','metalnessMap','emissiveMap',
        'aoMap','alphaMap','bumpMap','displacementMap','specularMap','lightMap',
        'clearcoatMap','clearcoatNormalMap','clearcoatRoughnessMap','sheenColorMap',
        'sheenRoughnessMap','transmissionMap','thicknessMap','iridescenceMap',
        'iridescenceThicknessMap','specularIntensityMap','specularColorMap',
        'envMap','gradientMap','matcap','anisotropyMap'];
      const isBroken = (tex) => {
        if (!tex) return false;
        const img = tex.image; if (!img) return false;
        if (img instanceof HTMLImageElement) return img.complete && img.naturalWidth === 0;
        return (img.width === 0 || img.height === 0);
      };
      newMesh.traverse(o => {
        if (!o.material) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          let changed = false;
          TEX_SLOTS.forEach(slot => {
            const tex = m[slot]; if (!tex) return;
            if (isBroken(tex)) { m[slot] = null; changed = true; return; }
            const img = tex.image;
            if (img instanceof HTMLImageElement && !img.complete) {
              img.addEventListener('error', () => { m[slot] = null; m.needsUpdate = true; }, { once: true });
            }
          });
          if (changed) m.needsUpdate = true;
        });
      });
      // Auto-scale to roughly the same footprint as primitives (~3 units bbox)
      const box = new THREE.Box3().setFromObject(newMesh);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const targetSize = 3.2;
      newMesh.scale.setScalar(targetSize / maxDim);
      // Center it
      const center = box.getCenter(new THREE.Vector3()).multiplyScalar(targetSize / maxDim);
      newMesh.position.sub(center);
    } catch (e) { errLog('GLB load:', libEntry.label, e.message); return; }
  }
  newMesh.position.add(new THREE.Vector3(...obj.pos));
  parent.remove(oldMesh);
  parent.add(newMesh);
  obj.mesh = newMesh;
  obj.baseScale = newMesh.scale.x || 1;
  obj.label = libEntry.label;
  if (obj._reapplyColors) obj._reapplyColors();
}

// ── Per-face video / audio panel (rabbit-hole dropdown) ────────────────
// Cube → face → controls. Each face has its own material clone, so swapping
// a face's video only affects that face. Audio routes through a per-face
// GainNode when audio engine is up; before then, video.volume/muted is used.
// facesHead tabs wired in buildFacesPanel


function ensureFaceAudio(F) {
  // Lazy-create MediaElementSource → GainNode → destination for this face.
  // Only runs once startAudio() has primed audioCtx (any user gesture).
  if (!audioCtx || F._audioWired) return;
  // The MAIN video is already wired into analyser by startAudio(); skip it.
  if (F.videoEl === video) { F._audioWired = true; return; }
  try {
    const src = audioCtx.createMediaElementSource(F.videoEl);
    F.gain = audioCtx.createGain();
    F.gain.gain.value = F.videoEl.muted ? 0 : (F.videoEl.volume || 1);
    src.connect(F.gain);
    F.gain.connect(audioCtx.destination);
    F._audioWired = true;
  } catch (e) { errLog('face audio wire failed:', F.key, e.message); }
}

function makeVideoEl() {
  const v = document.createElement('video');
  v.playsInline = true; v.crossOrigin = 'anonymous'; v.preload = 'auto';
  v.loop = true; v.muted = true;
  // Off-screen but NOT display:none — display:none prevents requestVideoFrameCallback
  // from firing in Chrome (no frames sent to compositor → texture stays black).
  v.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(v);
  return v;
}
function makeVideoTex(v) {
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  // Force polling-based updates: display:none elements may not fire
  // requestVideoFrameCallback in Chrome, causing the texture to stay black.
  tex.update = function() {
    if (this.image.readyState >= this.image.HAVE_CURRENT_DATA) this.needsUpdate = true;
  };
  return tex;
}

// Whole-cube swap: show immediately via blob URL, upload in background for persistence.
async function swapCubeVideo(cubeKey, file) {
  const blobUrl = URL.createObjectURL(file);
  const sharedMat = (cubeKey === 'inner') ? innerMat : outerMat;
  // Tear down old cube video element to avoid reuse-state issues
  const oldV = sharedMat.userData.cubeVideo;
  if (oldV) { try { oldV.pause(); oldV.src = ''; } catch(e){} }
  // Fresh element every swap — guarantees clean load state
  const v = makeVideoEl();
  sharedMat.userData.cubeVideo = v;
  sharedMat.userData.audioWired = false; // re-wire audio on fresh element
  v.src = blobUrl;
  v.load();
  v.addEventListener('canplay', () => {
    dbg('cube canplay fired', cubeKey, blobUrl);
    const sel = document.getElementById('styleSel');
    if (sel) {
      const p = STYLE_PRESETS[parseInt(sel.value, 10)];
      if (p && p.mode !== 'splat') for (const F of ALL_FACES) applyStylePresetToFace(F, p);
    }
  }, { once: true });
  v.addEventListener('error', () => errLog('cube video error', cubeKey, v.error?.code, v.error?.message), { once: true });
  if (sharedMat.userData.cubeTex) sharedMat.userData.cubeTex.dispose?.();
  const tex = makeVideoTex(v);
  sharedMat.userData.cubeTex = tex;
  sharedMat.uniforms.uVideo.value = tex;
  sharedMat.uniforms.uVideoIsPacked.value = 0.0;
  if (cubeKey === 'inner' && _innerSpherePoints?.material) { _innerSpherePoints.material.map = tex; _innerSpherePoints.material.needsUpdate = true; }
  dbg('cube swap done', cubeKey, 'uVideo updated');
  // Reset ALL faces on this cube — including any individually-cloned ones — back to the shared mat
  for (const F of ALL_FACES) {
    if (F.cube !== cubeKey) continue;
    if (F.mat !== sharedMat) {
      const oldMat = F.mat;
      const idx = MATS_TO_SYNC.indexOf(oldMat);
      if (idx >= 0) MATS_TO_SYNC.splice(idx, 1);
      oldMat.dispose?.();
      F.mat = sharedMat;
      F.mesh.material = sharedMat;
    }
    F.videoEl = v; F.videoTex = tex; F._audioWired = false;
  }
  // Only autoplay cube video if main video is already playing
  if (!video.paused) {
    v.play().catch(err => { if (err.name !== 'AbortError') errLog('cube play:', cubeKey, err.message); });
  }
  ensureCubeAudio(sharedMat);
  if (window.__dc) window.__dc.lastCubeSwap = {
    cubeKey, url: blobUrl,
    readyState: v.readyState, paused: v.paused,
    uniformIsCubeTex: sharedMat.uniforms.uVideo.value === tex,
    uVideoIsPacked:   sharedMat.uniforms.uVideoIsPacked.value,
    done: Date.now(),
  };
  // Upload in background for persistence across reloads
  try {
    toast('uploading ' + file.name + '...', '#fc6');
    const a = await uploadAsset(file);
    sharedMat.userData.cubeAssetId = a.id;
    sharedMat.userData.cubeAssetName = a.name;
    if (window.__destSave) window.__destSave();
  } catch(err) { errLog('cube upload failed:', cubeKey, err.message); }
}


function ensureCubeAudio(sharedMat) {
  if (!audioCtx || sharedMat.userData.audioWired) return;
  const v = sharedMat.userData.cubeVideo;
  if (!v) return;
  try {
    const src = audioCtx.createMediaElementSource(v);
    const g = audioCtx.createGain();
    g.gain.value = v.muted ? 0 : (v.volume || 1);
    src.connect(g); g.connect(audioCtx.destination);
    sharedMat.userData.gain = g;
    sharedMat.userData.audioWired = true;
  } catch (e) { errLog('cube audio:', e.message); }
}

// Per-face swap: lazy-clone the shared material so only that face is affected.
async function swapFaceVideo(F, file) {
  const a = await uploadAsset(file);
  const url = a.url;
  F.assetId = a.id;
  // Clone the cube's shared material the first time this face goes solo
  if (F.mat === innerMat || F.mat === outerMat) {
    const base = F.mat;
    const clone = base.clone();
    clone.uniforms = THREE.UniformsUtils.clone(base.uniforms);
    F.mat = clone;
    F.mesh.material = clone;
    MATS_TO_SYNC.push(clone);
  }
  if (F.videoEl === video || F.videoEl === innerMat.userData.cubeVideo || F.videoEl === outerMat.userData.cubeVideo) {
    F.videoEl = makeVideoEl();
  }
  F.videoEl.src = url;
  F.videoEl.load();
  // Dispose old face-specific texture, but never dispose the shared main or cube textures
  const _cubeTex = (F.cube === 'inner' ? innerMat : outerMat).userData.cubeTex;
  if (F.videoTex && F.videoTex !== videoTex && F.videoTex !== _cubeTex) F.videoTex.dispose?.();
  F.videoTex = makeVideoTex(F.videoEl);
  F.mat.uniforms.uVideo.value = F.videoTex;
  F.mat.uniforms.uVideoIsPacked.value = 0.0;
  F.videoEl.play().catch(err => errLog('face play:', F.key, err.message));
  ensureFaceAudio(F);
}

// ── Inner shape system ──────────────────────────────────────────────────────
let _innerShape = 'cube';
let _innerSpherePoints = null;
let _hairballGroup = null;
let _hairballParams = { shells:64, length:0.085, density:180, thick:0.004, curl:0.18, droop:0.0, sway:0.2, root:new THREE.Color('#2a1308'), tip:new THREE.Color('#c98655'), light:new THREE.Color('#ffe9c8'), ldir:new THREE.Vector3(-0.2,0.7,0.7).normalize(), amb:0.18, rim:0.7 };

const HB_VERT = `
varying vec2 vUv; varying vec3 vN; varying vec3 vWP; varying float vT;
uniform float uShell,uShellCount,uLength,uCurl,uDroop,uSway,uTime;
float hh(vec3 p){p=fract(p*0.3183099+vec3(.71,.113,.419));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(mix(hh(i),hh(i+vec3(1,0,0)),f.x),mix(hh(i+vec3(0,1,0)),hh(i+vec3(1,1,0)),f.x),f.y),mix(mix(hh(i+vec3(0,0,1)),hh(i+vec3(1,0,1)),f.x),mix(hh(i+vec3(0,1,1)),hh(i+vec3(1,1,1)),f.x),f.y),f.z);}
void main(){
  vUv=uv; vT=uShell/uShellCount;
  vec3 n=normalize(normal);
  vec3 wp=position+n*vT*uLength;
  vec3 tan=normalize(cross(n,vec3(0,1,0.0001))),bit=cross(n,tan);
  float w1=vn(position*6.0+vec3(uTime*uSway)),w2=vn(position*6.0+vec3(13.7));
  wp+=(tan*(w1-0.5)+bit*(w2-0.5))*uCurl*vT;
  wp.y-=uDroop*vT*vT;
  vN=normalize(normalMatrix*n); vWP=wp;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(wp,1.0);
}`;
const HB_FRAG = `
precision highp float;
varying vec2 vUv; varying vec3 vN; varying vec3 vWP; varying float vT;
uniform float uDensity,uThick,uAmb,uRim;
uniform vec3 uRoot,uTip,uLight,uLdir;
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  float alpha;
  if(vT<0.001){alpha=1.0;}else{
    vec2 cu=vUv*uDensity,ci=floor(cu);
    vec2 jit=vec2(h2(ci),h2(ci+7.3))-0.5;
    vec2 lo=fract(cu)-0.5-jit*0.6;
    float d=length(lo);
    float r=clamp(uThick*uDensity*(1.0-vT*0.8),0.05,0.55);
    float strand=smoothstep(r,r*0.55,d);
    float keep=step(h2(ci+1.7),0.85);
    alpha=strand*keep*(1.0-smoothstep(0.9,1.0,vT));
    if(alpha<0.03)discard;
  }
  vec3 N=normalize(vN),L=normalize(uLdir);
  float lam=max(dot(N,L),0.0),ao=mix(0.35,1.0,vT);
  vec2 _id=floor(vUv*uDensity);
  float jit2=h2(_id+5.1)*0.45+0.65,warm=h2(_id+2.3)*0.25-0.10;
  vec3 base=mix(uRoot,uTip,pow(vT,0.85))*jit2;
  base.r*=1.0+warm;base.g*=1.0-warm*0.5;
  vec3 col=base*(uAmb+lam*uLight*ao);
  vec3 V=normalize(cameraPosition-vWP);
  float rim=pow(1.0-max(dot(N,V),0.0),2.0);
  col+=rim*uRim*uTip*vT;
  col=col/(1.0+col*0.6);
  gl_FragColor=vec4(col,alpha);
}`;

function _mkHBMat(i) {
  const p = _hairballParams;
  return new THREE.ShaderMaterial({
    uniforms:{ uShell:{value:i}, uShellCount:{value:p.shells}, uLength:{value:p.length}, uCurl:{value:p.curl}, uDroop:{value:p.droop}, uSway:{value:p.sway}, uTime:{value:0}, uDensity:{value:p.density}, uThick:{value:p.thick}, uRoot:{value:p.root.clone()}, uTip:{value:p.tip.clone()}, uLight:{value:p.light.clone()}, uLdir:{value:p.ldir.clone()}, uAmb:{value:p.amb}, uRim:{value:p.rim} },
    vertexShader:HB_VERT, fragmentShader:HB_FRAG, transparent:true, depthWrite:i===0, side:THREE.FrontSide,
  });
}
function buildHairball(shapeType) {
  if (_hairballGroup) { centerGroup.remove(_hairballGroup); _hairballGroup.traverse(o=>{o.geometry?.dispose();o.material?.dispose();}); _hairballGroup=null; }
  const p = _hairballParams;
  const geo = shapeType==='hairball-cube'
    ? new THREE.BoxGeometry(2,2,2,6,6,6)
    : new THREE.SphereGeometry(1, 120, 60);
  const g = new THREE.Group();
  g.scale.setScalar(HALF);
  for (let i=0;i<p.shells;i++){ const m=new THREE.Mesh(geo,_mkHBMat(i)); m.renderOrder=i; g.add(m); }
  _hairballGroup=g;
  centerGroup.add(g);
}
function buildInnerSphereVideo() {
  if (_innerSpherePoints) { centerGroup.remove(_innerSpherePoints); _innerSpherePoints.geometry?.dispose(); _innerSpherePoints.material?.dispose(); _innerSpherePoints=null; }
  const geo = new THREE.SphereGeometry(HALF, 64, 32);
  const mat = new THREE.MeshBasicMaterial({ map: innerMat.uniforms.uVideo.value, side: THREE.FrontSide });
  _innerSpherePoints = new THREE.Mesh(geo, mat);
  centerGroup.add(_innerSpherePoints);
}
function setInnerShape(shape) {
  _innerShape = shape;
  const isCube = shape === 'cube';
  for (const F of ALL_FACES) { if (!F.isOuter) F.mesh.visible = isCube; }
  if (_innerSpherePoints) _innerSpherePoints.visible = shape === 'sphere-video';
  if (_hairballGroup) _hairballGroup.visible = (shape==='hairball-sphere'||shape==='hairball-cube');
  if (shape==='sphere-video' && !_innerSpherePoints) buildInnerSphereVideo();
  if (shape==='hairball-sphere'||shape==='hairball-cube') buildHairball(shape);
  else if (_hairballGroup) _hairballGroup.visible = false;
}
