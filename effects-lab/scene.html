<!doctype html>
<!-- effect #4 for the Feed player: "scene" — the 4-stem visualizer. Four
     separately-decoded tracks (vocals/drums/bass/other-as-harmony) each
     drive their own part of ONE shared 3D scene instead of four separate
     screens: drums morph the central solid (reusing the same raymarched SDF
     shapes sphere.html has), bass ripples a plate underneath it, vocals
     float and orbit above as their own small pulsing blob, and harmony
     washes the background/bloom color. No dots, no manual switching — this
     page only ever plays what the uploader's stem mix already is. -->
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>scene — 4-stem visualizer</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;}
  canvas{display:block;touch-action:none;}
  #stage{position:fixed;inset:0;z-index:1;}
  #noSrc{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);font-size:11px;z-index:5;pointer-events:none;}
  #stemLabels{position:fixed;top:12px;left:12px;z-index:10;display:flex;flex-direction:column;gap:4px;
       background:rgba(10,10,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
       border-radius:8px;padding:8px 12px;font-size:10.5px;color:rgba(255,255,255,.7);}
  #stemLabels b{color:#f5f5f7;}
  #fsBtn{position:fixed;bottom:10px;right:10px;z-index:10;background:rgba(255,255,255,.08);color:#f5f5f7;
       border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 9px;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="noSrc">waiting for stems…</div>
<div id="stemLabels">
  <span><b>●</b> drums → center</span>
  <span><b>●</b> bass → plate</span>
  <span><b>●</b> vocals → orbit</span>
  <span><b>●</b> harmony → glow</span>
</div>
<button id="fsBtn" title="Fullscreen">⛶</button>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLSL, raymarchQuad } from '/h5555/core.js';

// ---- renderer / scene / camera ----
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setClearColor(0x05060a, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 200);
camera.position.set(0, 0.6, 6.5);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.7, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  bloom.resolution.set(w, h);
}
addEventListener('resize', resize); resize();

// ---- per-stem audio: 4 independent decode/analyse chains, one per role ----
// Each stem gets its own <audio> + AnalyserNode, all started/sought/muted in
// lockstep so the 4 tracks stay in sync — they're really one song, just
// decoded 4 times because that's how a stem split hands them to us.
const ROLES = ['drums','bass','vocals','harmony'];
let actx;
function ensureCtx(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
const stems = {}; // role -> { el, analyser, freqData, timeData, bass, mid, high, rms, bassFast, bassSlow, kickRefractory, kick }
ROLES.forEach(role=>{ stems[role] = { el:null, analyser:null, bass:0, mid:0, high:0, rms:0, bassFast:0, bassSlow:0, kickRefractory:0, kick:0 }; });

function loadStemUrl(role, url, muted, startTime, active){
  if(!url) return;
  ensureCtx();
  const s = stems[role];
  if(s.el){ try{ s.el.pause(); }catch(_){} }
  const el = new Audio(url);
  el.crossOrigin = 'anonymous'; el.loop = true; el.muted = !!muted;
  if(startTime > 0) el.addEventListener('loadedmetadata', ()=>{ el.currentTime = startTime; }, { once:true });
  const analyser = actx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.8;
  const src = actx.createMediaElementSource(el);
  src.connect(analyser); analyser.connect(actx.destination);
  actx.resume();
  if(active !== false) el.play().catch(()=>{});
  s.el = el; s.analyser = analyser;
  s.freqData = new Uint8Array(analyser.frequencyBinCount);
  s.timeData = new Uint8Array(analyser.fftSize);
  document.getElementById('noSrc').style.display = 'none';
  // only the drums track's clock reports back to the parent — all 4 stay
  // locked to the same song position, no need for 4 separate timeupdate spams
  if(role === 'drums'){
    el.addEventListener('timeupdate', ()=>{
      try { parent.postMessage({ type:'timeupdate', currentTime: el.currentTime, duration: el.duration || 0 }, '*'); } catch(_){}
    });
  }
}
window._sceneSetStemUrl = loadStemUrl;

function sampleStem(role){
  const s = stems[role];
  if(!s.analyser) return;
  s.analyser.getByteFrequencyData(s.freqData);
  s.analyser.getByteTimeDomainData(s.timeData);
  const n = s.freqData.length;
  let b=0,m=0,h=0; const bEnd=(n*0.08)|0, mEnd=(n*0.4)|0;
  for(let i=0;i<n;i++){ const v=s.freqData[i]/255; if(i<bEnd)b+=v; else if(i<mEnd)m+=v; else h+=v; }
  b/=bEnd; m/=(mEnd-bEnd); h/=(n-mEnd);
  let rms=0; for(let i=0;i<s.timeData.length;i++){ const v=(s.timeData[i]-128)/128; rms+=v*v; } rms=Math.sqrt(rms/s.timeData.length);
  s.bass += (b - s.bass)*0.3; s.mid += (m - s.mid)*0.3; s.high += (h - s.high)*0.3; s.rms += (rms - s.rms)*0.3;
  // onset detector, same fast-envelope-vs-slow-baseline trick as sphere.html —
  // used here for the drums stem to trigger the central shape's morph
  s.bassFast += (b - s.bassFast)*0.55; s.bassSlow += (b - s.bassSlow)*0.045;
  const now = performance.now()/1000;
  let hit = false;
  if(s.bassFast > s.bassSlow*1.35 + 0.06 && (now - s.kickRefractory) > 0.14){ hit = true; s.kickRefractory = now; }
  s.kick = Math.max(s.kick*0.7, hit ? 1 : 0);
}
// ---- kick/snare/cymbals: derived from the drums stem's own FFT, no extra
// decode. Spectral-flux + HFC-weighted onset detector (the upgraded technique
// from the drum-room classifier, not the cruder peak-vs-baseline version) —
// sums positive bin-to-bin magnitude rises per band, weights high bins more
// for transient-heavy layers (snare crack, cymbals) so bleed between them
// doesn't swamp either one, and fires on an adaptive threshold (moving mean
// + k*deviation) instead of one fixed delta. "cymbals" is deliberately one
// combined band (hihat+crash+ride all live in the same 2.5-15kHz range and
// aren't separable without their own stem split) rather than hihat alone.
// Each becomes a selectable "stem" like any other, so a layer slot can be
// aimed at just the kick, just the snare, or all the cymbals together.
const DRUM_PARTS = ['kick','snare','cymbals'];
// [loHz, hiHz, refractorySec, hfcWeight(0=off,1=full bin/hi weighting), k(threshold sensitivity)]
const DRUM_BANDS = {
  kick:    [40,   120,   0.11,  0,   1.4],
  snare:   [180,  500,   0.095, 0.5, 1.3],
  cymbals: [2500, 15000, 0.045, 1,   1.1],
};
DRUM_PARTS.forEach(part=>{ stems[part] = { bass:0, mid:0, high:0, rms:0, kick:0, _prevBand:null, _fluxMean:0, _fluxDev:0, _refractory:0 }; });
function sampleDrumParts(){
  const d = stems.drums;
  if(!d.analyser || !actx) return;
  const n = d.freqData.length;
  const binHz = (actx.sampleRate/2)/n;
  const now = performance.now()/1000;
  DRUM_PARTS.forEach(part=>{
    const s = stems[part];
    const [loHz, hiHz, refractoryS, hfcWeight, k] = DRUM_BANDS[part];
    const lo = Math.max(0, Math.floor(loHz/binHz)), hi = Math.min(n-1, Math.ceil(hiHz/binHz));
    const span = Math.max(1, hi - lo);
    if(!s._prevBand || s._prevBand.length !== span+1) s._prevBand = new Float32Array(span+1);
    let flux = 0, peak = 0;
    for(let i=lo;i<=hi;i++){
      const v = d.freqData[i]/255;
      if(v > peak) peak = v;
      const rise = v - s._prevBand[i-lo];
      if(rise > 0){ const w = hfcWeight ? (1 - hfcWeight) + hfcWeight*((i-lo)/span) : 1; flux += rise*w; }
      s._prevBand[i-lo] = v;
    }
    s._fluxMean = s._fluxMean*0.85 + flux*0.15;
    s._fluxDev = s._fluxDev*0.85 + Math.abs(flux - s._fluxMean)*0.15;
    const thr = s._fluxMean + k*s._fluxDev + 0.004;
    let hit = false;
    if(flux > thr && peak > 0.10 && (now - s._refractory) > refractoryS){ hit = true; s._refractory = now; }
    const target = hit ? 1 : 0;
    s.kick = Math.max(s.kick*0.82, target); // decaying hit envelope, reused as every slot field below
    s.bass = s.mid = s.high = s.rms = s.kick;
  });
}
function sampleAll(){ ROLES.forEach(sampleStem); sampleDrumParts(); }

// ---- the shared scene: one raymarched shader, 4 visual SLOTS ----
// (center / plate / orbit / glow) — each slot is driven by whichever STEM
// the uploader assigned it to (see `cfg` below, parsed from the URL). The
// shader itself only knows about slots, never about "drums" or "vocals" by
// name, so reassigning which stem feeds which slot is just a different set
// of numbers going into the same uniforms — same de()/liquid-morph
// machinery sphere.html uses for its own shape library, just composed into
// one frame instead of switching between them.
// Center's shape library is verbatim from sphere.html/field.html (the real,
// already-approved 8-shape set) — nothing invented here. Only 5 of the 8 are
// ever offered (see index.html), each locked to the one stem it was picked
// for: Fluff=kick, SDF Morph Field=bass, Wave Interference=(unused for now),
// Chladni Plate=harmony, Resonant Spiderweb=vocals. Superformula and Gyroid
// Lattice stay in the library (Gyroid is kick's snare-triggered morph
// target, see the loop below) even though no stem has claimed them as its
// primary choice yet. "Crystal Burst" (index 8) is a 9th, cymbals-only
// addition — ported from h5555's Crystal Geode engine (batch19.js) since
// none of the 8 raymarched shapes read as a metallic cymbal shimmer; it's
// rendered as real instanced geometry, not an SDF (see below de()/render).
const CENTER_SHAPES = ['Fluff','Gyroid Lattice','Superformula','Mandelbulb Fractal','SDF Morph Field','Wave Interference Field','Chladni Plate','Resonant Spiderweb','Crystal Burst'];
const SCENE_FRAG = `
${GLSL.snoise3}
${GLSL.palette}
uniform int uShapeType[5], uGlowBg;
uniform vec3 uShapePos[5];
uniform float uShapeBass[5], uShapeMid[5], uShapeHigh[5], uShapeRms[5], uShapeSize[5];
uniform bool uPlateOn, uOrbitOn;
uniform float uPlateBass, uPlateMid, uPlateSize;
uniform float uOrbitRms, uOrbitHigh, uOrbitSize;
uniform float uGlowMid, uGlowRms;

float sdfSmin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float deFluffC(vec3 p, float bass, float mid, float high, float rms, float size){
  float n = snoise(p*2.2+uTime*0.15) + 0.5*snoise(p*4.4-uTime*0.1);
  return length(p) - size*(1.1 + n*0.2*(0.4+bass));
}
float deGyroidC(vec3 p, float bass, float mid, float high, float rms, float size){
  float s=(3.2+bass*1.8)/max(0.35,size); vec3 q=p*s;
  float g=dot(sin(q),cos(q.yzx));
  float lattice=(abs(g)-0.14*(1.0+mid))/s;
  float ball=length(p)-1.5*size;
  return max(lattice,ball);
}
float sfRC(float angle, float m, float n1){
  float t1=pow(abs(cos(m*angle/4.0)),1.7);
  float t2=pow(abs(sin(m*angle/4.0)),1.7);
  return pow(t1+t2,-1.0/n1);
}
float deSuperformulaC(vec3 p, float bass, float mid, float high, float rms, float size){
  float m=6.0+mid*3.0, n1=0.5+bass;
  float len=max(length(p),0.0001);
  float theta=atan(p.z,p.x), phi=asin(clamp(p.y/len,-1.0,1.0));
  float rad=size*1.6*sfRC(theta,m,n1)*sfRC(phi,m,n1);
  return len-rad;
}
float deMandelbulbC(vec3 p, float bass, float mid, float high, float rms, float size){
  vec3 z=p*(1.1/max(0.35,size)); float dr=1.0; float r=0.0;
  float pw=8.0+sin(uTime*0.3)*1.0+bass*2.0;
  for(int i=0;i<6;i++){
    r=length(z); if(r>2.0)break;
    float th=acos(z.z/r); float ph=atan(z.y,z.x);
    dr=pow(r,pw-1.0)*pw*dr+1.0;
    float zr=pow(r,pw); th*=pw; ph*=pw;
    z=zr*vec3(sin(th)*cos(ph),sin(ph)*sin(th),cos(th))+p*(1.1/max(0.35,size));
  }
  return (0.5*log(r)*r/dr) / (1.1/max(0.35,size)) * size;
}
// "The bubble thing" — 6 metaball blobs blended with sdfSmin. Radius now
// driven mainly by bass (was mid in the original) so it visibly bubbles
// bigger on bass hits, per "it should bubble with the bass".
float deSdfMorphC(vec3 p, float bass, float mid, float high, float rms, float size){
  float d=10.0;
  for(int i=0;i<6;i++){
    float fi=float(i);
    vec3 c=vec3(sin(uTime*0.5+fi*2.1),cos(uTime*0.4+fi*1.7),sin(uTime*0.3+fi*1.3))*(1.1+bass*0.8)*size;
    float r=(0.35+0.28*sin(uTime+fi)+bass*0.4+mid*0.15)*size;
    d=sdfSmin(d,length(p-c)-r,0.7*size);
  }
  return d;
}
float deWaveFieldC(vec3 p, float bass, float mid, float high, float rms, float size){
  float v=0.0;
  for(int s=0;s<3;s++){
    float ang=uTime*0.5+float(s)*2.0943951;
    float sx=cos(ang)*1.6*size, sz=sin(ang)*1.6*size;
    float d=length(vec2(p.x-sx,p.z-sz));
    v += sin(d*6.5*(1.0+mid*0.5)-uTime*4.0)/(1.0+d*0.5);
  }
  float h = v*1.0*(0.5+bass)*0.4*size;
  return max(p.y - h, length(p)-2.1*size);
}
float deChladniFieldC(vec3 p, float bass, float mid, float high, float rms, float size){
  float ext=2.6*size;
  float m=4.0+mid*3.0, n=3.0+high*2.0;
  float u=p.x/ext+0.5, v=p.z/ext+0.5;
  float h=(sin(m*3.14159265*u)*sin(n*3.14159265*v)-sin(n*3.14159265*u)*sin(m*3.14159265*v))*0.7*(0.5+bass)*size;
  return max(p.y - h, length(p)-2.1*size);
}
float deWebFieldC(vec3 p, float bass, float mid, float high, float rms, float size){
  float rad=length(p.xz), ang=atan(p.z,p.x);
  float spoke=pow(abs(cos(ang*7.0)),10.0);
  float ring=pow(abs(cos(rad*3.6/max(0.35,size)-uTime*0.6)),10.0);
  float h=(max(spoke,ring)*0.6-0.12)*(0.4+rms*2.0)*size;
  return max(p.y - h, length(p)-2.1*size);
}
float deShape(int type, vec3 p, float bass, float mid, float high, float rms, float size){
  if(type==0) return deFluffC(p,bass,mid,high,rms,size);
  if(type==1) return deGyroidC(p,bass,mid,high,rms,size);
  if(type==2) return deSuperformulaC(p,bass,mid,high,rms,size);
  if(type==3) return deMandelbulbC(p,bass,mid,high,rms,size);
  if(type==4) return deSdfMorphC(p,bass,mid,high,rms,size);
  if(type==5) return deWaveFieldC(p,bass,mid,high,rms,size);
  if(type==6) return deChladniFieldC(p,bass,mid,high,rms,size);
  if(type==7) return deWebFieldC(p,bass,mid,high,rms,size);
  return 1000.0; // 8 = Crystal Burst — real instanced geometry, not an SDF; see below
}
// Up to 5 shape-bearing stems (kick/cymbals/bass/vocals/harmony) render
// simultaneously now, each at its own ring position — previously only one
// could occupy "Center" at a time, which is why turning several on left
// most of them invisible ("only 2 out of 7 showing").
float deShapes(vec3 p){
  float d = 1000.0;
  for(int i=0;i<5;i++){
    if(uShapeType[i] >= 0){
      vec3 q = p - uShapePos[i] - vec3(0.0, 0.15, 0.0);
      float sd = deShape(uShapeType[i], q, uShapeBass[i], uShapeMid[i], uShapeHigh[i], uShapeRms[i], uShapeSize[i]);
      d = min(d, sd);
    }
  }
  return d;
}
// Plate and Orbit are plain fixed looks (no per-shape picker) — whichever
// stem is assigned there just drives this one look's motion/size.
float dePlate(vec3 p){
  if(!uPlateOn) return 1000.0;
  vec3 q = p - vec3(0.0, -1.55, 0.0);
  float d = length(q.xz)/max(0.35,uPlateSize);
  float h = sin(d*5.0 - uTime*3.0*(0.5+uPlateBass)) / (1.0+d*0.6);
  h *= 0.22*(0.4+uPlateBass) * (1.0 + uPlateMid*0.4) * uPlateSize;
  return max(q.y - h, d - 2.0);
}
float deOrbit(vec3 p){
  if(!uOrbitOn) return 1000.0;
  float orbitR = 1.6 + uOrbitRms*0.6;
  float ang = uTime*0.6;
  vec3 c = vec3(cos(ang)*orbitR, 1.3+sin(uTime*1.7)*0.15+uOrbitRms*0.5, sin(ang)*orbitR);
  float rad = uOrbitSize*(0.32 + uOrbitRms*0.28 + uOrbitHigh*0.12);
  vec3 q = p - c;
  float n = snoise(q*3.0+uTime*0.6)*0.08*(0.3+uOrbitHigh);
  return length(q) - rad - n;
}
float de(vec3 p){
  float d = deShapes(p);
  d = min(d, dePlate(p));
  d = sdfSmin(d, deOrbit(p), 0.35);
  return d;
}
vec3 colorAt(vec3 p, vec3 n){
  // each active shape gets its own hue (spread across the palette by slot
  // index) blended by proximity, plus plate=cool, orbit=bright — plus the
  // glow-slot's stem tinting everything, so the whole scene visibly
  // breathes with that track even where it isn't the dominant shape.
  vec3 shapesCol = vec3(0.0); float wShapes = 0.0; float dC = 1000.0;
  for(int i=0;i<5;i++){
    if(uShapeType[i] >= 0){
      vec3 q = p - uShapePos[i] - vec3(0.0, 0.15, 0.0);
      float sd = deShape(uShapeType[i], q, uShapeBass[i], uShapeMid[i], uShapeHigh[i], uShapeRms[i], uShapeSize[i]);
      float w = 1.0/(0.08+abs(sd));
      shapesCol += spectral(0.06 + float(i)*0.16 + uShapeHigh[i]*0.1 + uTime*0.015) * w;
      wShapes += w;
      dC = min(dC, sd);
    }
  }
  vec3 centerCol = wShapes>0.0 ? shapesCol/wShapes : spectral(0.06);
  vec3 plateCol = spectral(0.55 + uPlateMid*0.1);
  vec3 orbitCol = spectral(0.9 - uOrbitHigh*0.15);
  float dP = dePlate(p), dO = deOrbit(p);
  float wC = 1.0/(0.08+abs(dC)), wP = 1.0/(0.08+abs(dP)), wO = 1.0/(0.08+abs(dO));
  float wSum = wC+wP+wO;
  vec3 base = (centerCol*wC + plateCol*wP + orbitCol*wO) / wSum;
  vec3 glowTint = spectral(0.4 + uGlowMid*0.25);
  return mix(base, glowTint, 0.18 + uGlowRms*0.22);
}
// Background style — an enclosing volumetric backdrop that fills the whole
// view behind Center/Plate/Orbit, driven by whichever stem holds "glow"
// (uGlowMid/uGlowRms), instead of the earlier flat tint-only version. All 3
// are verbatim ports of real, already-built h5555 engines (Stellar Nebula:
// public/h5555/engines/batch10.js; Aurora Borealis: batch03.js; Cloudscape:
// batch13.js) — reduced iteration counts since this now runs alongside the
// foreground raymarch every frame instead of alone.
float fbmBg(vec3 p){ float f=0.0,a=0.5; for(int i=0;i<5;i++){ f+=a*snoise(p); p*=2.02; a*=0.5; } return f; }
vec3 bgNebula(vec3 ro, vec3 rd){
  vec3 col=vec3(0.0); float t=0.5;
  for(int i=0;i<30;i++){
    vec3 p=ro+rd*t; float d=fbmBg(p*0.5+vec3(0.0,0.0,uTime*0.03));
    float dens=clamp(d*1.1-0.1,0.0,1.0)*smoothstep(9.0,2.0,length(p));
    if(dens>0.01){ vec3 gc=spectral(0.62+d*0.2); col+=gc*dens*0.09*(0.7+uGlowMid*0.6); }
    float star=pow(max(0.0,snoise(p*3.0)),20.0); col+=vec3(star)*0.5;
    t+=0.3; if(t>14.0)break;
  }
  return col*(0.8+uGlowRms*0.4);
}
vec3 bgAurora(vec3 ro, vec3 rd){
  vec3 col=vec3(0.01,0.02,0.04); float trans=1.0; float t=0.5;
  for(int i=0;i<28;i++){
    vec3 p=ro+rd*t;
    float curtain=snoise(vec3(p.x*0.4+uTime*0.2, uTime*0.1, p.z*0.4))*0.5+0.5;
    curtain=pow(curtain,2.0);
    float hfade=smoothstep(4.5,-1.0,p.y)*smoothstep(-2.0,0.5,p.y);
    float dens=curtain*hfade*(0.6+uGlowMid);
    vec3 c=spectral(0.35+p.y*0.08+uGlowRms*0.2);
    col+=c*dens*trans*0.15; trans*=1.0-dens*0.1;
    t+=0.35; if(trans<0.02||t>14.0)break;
  }
  return col;
}
vec3 bgCloudscape(vec3 ro, vec3 rd){
  vec3 sky=mix(vec3(0.05,0.06,0.09),vec3(0.02,0.03,0.06),clamp(rd.y*1.5+0.3,0.0,1.0));
  vec3 col=sky; float t=1.0; float trans=1.0;
  float thresh=1.0-0.7*0.45;
  for(int i=0;i<26;i++){
    vec3 p=ro+rd*t; p.x+=uTime*0.4; float d=fbmBg(p*0.45)*0.5+0.5;
    float slab=smoothstep(3.0,0.5,abs(p.y-0.5));
    float dens=clamp((d-thresh)*3.0,0.0,1.0)*slab*(0.5+uGlowMid*0.7);
    if(dens>0.01){
      float light=clamp(fbmBg((p+vec3(0.0,0.7,0.0))*0.45)*0.5+0.5,0.35,1.0);
      vec3 cc=mix(vec3(0.06,0.07,0.1),spectral(0.55+light*0.2),light);
      col=mix(col,cc,dens*0.16*trans); trans*=(1.0-dens*0.16);
    }
    t+=0.4; if(t>12.0||trans<0.03)break;
  }
  return col*(0.85+uGlowRms*0.3);
}
vec3 bgColor(vec3 ro, vec3 rd){
  if(uGlowBg==1) return bgAurora(ro,rd);
  if(uGlowBg==2) return bgCloudscape(ro,rd);
  return bgNebula(ro,rd);
}
vec3 render(vec3 ro, vec3 rd){
  float t=0.0; bool didHit=false; vec3 col=vec3(0.0);
  for(int i=0;i<72;i++){
    vec3 p=ro+rd*t; float d=de(p);
    if(d<0.0015){
      vec2 e=vec2(0.002,0.0);
      vec3 n=normalize(vec3(de(p+e.xyy)-de(p-e.xyy),de(p+e.yxy)-de(p-e.yxy),de(p+e.yyx)-de(p-e.yyx)));
      float diff=max(dot(n,normalize(vec3(0.6,0.8,0.5))),0.0);
      float fres=pow(1.0-max(dot(n,-rd),0.0),2.5);
      vec3 baseCol = colorAt(p,n);
      float ao=1.0-float(i)/72.0;
      col=baseCol*(0.3+0.7*diff)*ao+fres*0.4*baseCol;
      didHit=true;
      break;
    }
    t+=d; if(t>18.0)break;
  }
  if(!didHit){ col = uGlowBg>0 ? bgColor(ro,rd) : vec3(0.02,0.02,0.035)*(0.5+uGlowRms*0.6); }
  return col;
}`;

const { mesh, uniforms } = raymarchQuad(SCENE_FRAG, {
  uShapeType:{value:[-1,-1,-1,-1,-1]},
  uShapePos:{value:[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()]},
  uShapeBass:{value:[0,0,0,0,0]}, uShapeMid:{value:[0,0,0,0,0]}, uShapeHigh:{value:[0,0,0,0,0]}, uShapeRms:{value:[0,0,0,0,0]}, uShapeSize:{value:[1,1,1,1,1]},
  uPlateOn:{value:false}, uPlateBass:{value:0}, uPlateMid:{value:0}, uPlateSize:{value:1},
  uOrbitOn:{value:false}, uOrbitRms:{value:0}, uOrbitHigh:{value:0}, uOrbitSize:{value:1},
  uGlowBg:{value:0}, uGlowMid:{value:0}, uGlowRms:{value:0},
});
scene.add(mesh);

// ---- Crystal Burst (Center shape 8, cymbals only): ported from h5555's
// Crystal Geode engine (public/h5555/engines/batch19.js) — real instanced
// cone-crystal geometry radiating from a point and glinting/bursting
// outward on transient hits, since none of the 8 raymarched SDF shapes read
// as a metallic shimmer. Sits as an ordinary THREE object on top of the
// raymarched background (that quad renders depthTest:false, renderOrder -1,
// so a normal foreground mesh composites over it with no extra plumbing).
// Only visible when Center's shape is 8; deCenter() above returns a huge
// sentinel distance for shape 8 so the raymarch itself draws nothing there.
const CRYSTAL_N = 160;
const crystalGeo = new THREE.ConeGeometry(0.045, 0.3, 5);
crystalGeo.translate(0, 0.15, 0);
const crystalMat = new THREE.MeshStandardMaterial({ roughness:0.15, metalness:0.55, vertexColors:true });
const crystalMesh = new THREE.InstancedMesh(crystalGeo, crystalMat, CRYSTAL_N);
crystalMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CRYSTAL_N*3), 3);
crystalMesh.visible = false;
scene.add(crystalMesh);
scene.add(new THREE.AmbientLight(0x554466, 0.7));
const crystalLight = new THREE.DirectionalLight(0xffffff, 1.2);
crystalLight.position.set(1, 2, 4);
scene.add(crystalLight);
const crystalDirs = [];
{
  const ga = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<CRYSTAL_N;i++){
    const y = 1 - (i/(CRYSTAL_N-1))*2, r = Math.sqrt(1-y*y), a = i*ga;
    crystalDirs.push(new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r));
  }
}
const crystalDummy = new THREE.Object3D();
const crystalUp = new THREE.Vector3(0, 0, 1);
const crystalQ = new THREE.Quaternion();
const crystalColor = new THREE.Color();
function updateCrystalBurst(t, stem, size){
  const burst = 1.0 + stem.kick*1.4;
  for(let i=0;i<CRYSTAL_N;i++){
    const dir = crystalDirs[i];
    const R = size * (1.1 + stem.high*0.5) * burst;
    crystalDummy.position.copy(dir).multiplyScalar(R);
    crystalQ.setFromUnitVectors(crystalUp, dir);
    crystalDummy.quaternion.copy(crystalQ);
    crystalDummy.scale.setScalar(size * (0.6 + (i%5)*0.12 + stem.kick*0.5));
    crystalDummy.updateMatrix();
    crystalMesh.setMatrixAt(i, crystalDummy.matrix);
    crystalColor.setHSL((0.72 + dir.y*0.06 + t*0.03) % 1, 0.7, 0.5 + stem.high*0.2);
    crystalMesh.setColorAt(i, crystalColor);
  }
  crystalMesh.instanceMatrix.needsUpdate = true;
  crystalMesh.instanceColor.needsUpdate = true;
  crystalMesh.rotation.y = t*0.15;
}

// ---- per-layer config: up to 5 stems (kick/cymbals/bass/vocals/harmony)
// can each show their own shape SIMULTANEOUSLY now (spread on a ring, or
// centered when only one is on) — previously only one could occupy
// "Center" at a time. plate/orbit/glow stay single-owner (they're plain,
// undifferentiated looks, not per-stem shapes). glowBg (0=None/flat tint,
// 1=Stellar Nebula, 2=Aurora Borealis, 3=Cloudscape) is the enclosing
// background style for whichever stem holds "glow" — see bgColor() above.
// ?cfg=<url-encoded JSON> — { shapes:[{stem,shape,snareShape?,size}...], plate, plateSize, orbit, orbitSize, glow, glowBg }
// "off" means literally nothing — no fallback defaults. A stem's shape
// entry can carry snareShape: while that stem's row is Kick, picking a
// second shape morphs the SAME object into it on every snare hit, then
// eases back — kick and snare share one shape, not two separate objects.
const GLOW_BG_NAMES = ['None','Stellar Nebula','Aurora Borealis','Cloudscape'];
const DEFAULT_CFG = { shapes:[], plate:null, plateSize:1, orbit:null, orbitSize:1, glow:null, glowBg:0 };
let sceneCfg = DEFAULT_CFG;
{
  const raw = new URLSearchParams(location.search).get('cfg');
  if(raw){
    try { applyCfgObj(JSON.parse(decodeURIComponent(raw))); }
    catch(_){ /* malformed cfg — leave the scene empty rather than guessing */ }
  }
}
function applyCfgObj(parsed){
  sceneCfg = {
    shapes: Array.isArray(parsed.shapes) ? parsed.shapes.slice(0,5) : [],
    plate: parsed.plate || null,
    plateSize: (typeof parsed.plateSize === 'number') ? parsed.plateSize : 1,
    orbit: parsed.orbit || null,
    orbitSize: (typeof parsed.orbitSize === 'number') ? parsed.orbitSize : 1,
    glow: parsed.glow || null,
    glowBg: (typeof parsed.glowBg === 'number') ? parsed.glowBg : 0,
  };
  // each shape carries its own explicit X/Y/Z from the composer's position
  // sliders — draggable per stem, not an automatic layout — falls back to
  // the origin only if an older/malformed cfg is missing it.
  sceneCfg.shapes.forEach(sh=>{
    sh.pos = (sh.pos && typeof sh.pos.x === 'number')
      ? new THREE.Vector3(sh.pos.x, sh.pos.y||0, sh.pos.z||0)
      : new THREE.Vector3();
  });
  const lw = document.getElementById('stemLabels');
  if(lw){
    const parts = sceneCfg.shapes.map(sh=>`<span><b>●</b> ${sh.stem} → shape (${CENTER_SHAPES[sh.shape]||'?'}${sh.snareShape!=null?' ⇄ '+CENTER_SHAPES[sh.snareShape]:''})</span>`);
    if(sceneCfg.plate) parts.push(`<span><b>●</b> ${sceneCfg.plate} → plate</span>`);
    if(sceneCfg.orbit) parts.push(`<span><b>●</b> ${sceneCfg.orbit} → orbit</span>`);
    if(sceneCfg.glow) parts.push(`<span><b>●</b> ${sceneCfg.glow} → glow (${GLOW_BG_NAMES[sceneCfg.glowBg]||'?'})</span>`);
    lw.innerHTML = parts.join('') || '<span>nothing on yet — turn something on in the composer</span>';
  }
}
applyCfgObj(sceneCfg);

let snareFlashUntil = 0;
let prevSnareHit = 0;

// ---- render loop ----
const clock = new THREE.Clock();
function loop(){
  const t = clock.getElapsedTime();
  sampleAll();
  const plateStem = sceneCfg.plate ? (stems[sceneCfg.plate]||{bass:0,mid:0}) : {bass:0,mid:0};
  const orbitStem = sceneCfg.orbit ? (stems[sceneCfg.orbit]||{rms:0,high:0}) : {rms:0,high:0};
  const glowStem = sceneCfg.glow ? (stems[sceneCfg.glow]||{mid:0,rms:0}) : {mid:0,rms:0};

  if(stems.snare.kick > 0.85 && prevSnareHit <= 0.85) snareFlashUntil = t + 0.3;
  prevSnareHit = stems.snare.kick;

  let isCrystal = false, crystalStem = null, crystalPos = null, crystalSize = 1;
  sceneCfg.shapes.forEach((sh, i)=>{
    if(i >= 5) return;
    const st = stems[sh.stem] || stems.drums;
    let shapeType = sh.shape;
    if(sh.snareShape != null && t < snareFlashUntil) shapeType = sh.snareShape;
    if(shapeType === 8){ isCrystal = true; crystalStem = st; crystalPos = sh.pos; crystalSize = sh.size || 1; shapeType = -1; }
    uniforms.uShapeType.value[i] = shapeType;
    uniforms.uShapePos.value[i].copy(sh.pos);
    uniforms.uShapeBass.value[i] = st.bass; uniforms.uShapeMid.value[i] = st.mid; uniforms.uShapeHigh.value[i] = st.high; uniforms.uShapeRms.value[i] = st.rms;
    uniforms.uShapeSize.value[i] = sh.size || 1;
  });
  for(let i=sceneCfg.shapes.length;i<5;i++) uniforms.uShapeType.value[i] = -1;

  crystalMesh.visible = isCrystal;
  crystalLight.visible = isCrystal;
  if(isCrystal){
    crystalMesh.position.copy(crystalPos);
    updateCrystalBurst(t, crystalStem, crystalSize);
  }

  uniforms.uPlateOn.value = !!sceneCfg.plate;
  uniforms.uPlateBass.value = plateStem.bass; uniforms.uPlateMid.value = plateStem.mid; uniforms.uPlateSize.value = sceneCfg.plateSize;
  uniforms.uOrbitOn.value = !!sceneCfg.orbit;
  uniforms.uOrbitRms.value = orbitStem.rms; uniforms.uOrbitHigh.value = orbitStem.high; uniforms.uOrbitSize.value = sceneCfg.orbitSize;
  uniforms.uGlowBg.value = sceneCfg.glowBg || 0;
  uniforms.uGlowMid.value = glowStem.mid; uniforms.uGlowRms.value = glowStem.rms;
  uniforms.uTime.value = t;
  uniforms.uRes.value.set(innerWidth, innerHeight);
  uniforms.uCamPos.value.copy(camera.position);
  uniforms.uCamMat.value.copy(camera.matrixWorld);
  controls.update();
  composer.render();
  requestAnimationFrame(loop);
}
loop();

document.getElementById('fsBtn').addEventListener('click', ()=>{
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});

// ---- feed embed: ?vocals=&drums=&bass=&other=<urls>[&muted=1] + postMessage ----
const qp = new URLSearchParams(location.search);
const mutedParam = qp.get('muted') === '1';
const startTimeParam = parseFloat(qp.get('t') || '0');
const activeParam = qp.get('active') !== '0';
['vocals','drums','bass'].forEach(role=>{
  const u = qp.get(role);
  if(u) loadStemUrl(role, decodeURIComponent(u), mutedParam, startTimeParam, activeParam);
});
// "other" in the media model is the harmony stem — kept as its own query key
// on this page so it reads plainly next to vocals/drums/bass.
const otherUrl = qp.get('other');
if(otherUrl) loadStemUrl('harmony', decodeURIComponent(otherUrl), mutedParam, startTimeParam, activeParam);

if(qp.get('embed') === 'inline'){
  document.getElementById('stemLabels').style.display = 'none';
  document.getElementById('fsBtn').style.display = 'none';
}

window._sceneApplyCfg = applyCfgObj;

addEventListener('message', e=>{
  if(e.data?.type === 'cfg' && e.data.cfg){ applyCfgObj(e.data.cfg); }
  if(e.data?.type === 'stems' && e.data.urls){
    Object.keys(e.data.urls).forEach(role=>{
      const mappedRole = role === 'other' ? 'harmony' : role;
      if(stems[mappedRole]) loadStemUrl(mappedRole, e.data.urls[role], e.data.muted);
    });
  }
  if(e.data?.type === 'setActive'){
    if(e.data.active){
      ROLES.forEach(role=>{
        const el = stems[role].el;
        if(el && isFinite(e.data.time) && Math.abs(el.currentTime - e.data.time) > 0.4) el.currentTime = e.data.time;
      });
      actx?.resume().catch(()=>{});
      ROLES.forEach(role=> stems[role].el?.play().catch(()=>{}));
    } else {
      ROLES.forEach(role=> stems[role].el?.pause());
    }
  }
  if(e.data?.type === 'mute'){
    ROLES.forEach(role=>{
      const el = stems[role].el;
      if(!el) return;
      el.muted = !!e.data.muted;
      if(!e.data.muted){ actx?.resume().catch(()=>{}); el.play().catch(()=>{}); }
    });
  }
  if(e.data?.type === 'play'){ actx?.resume().catch(()=>{}); ROLES.forEach(role=> stems[role].el?.play().catch(()=>{})); }
  if(e.data?.type === 'pause'){ ROLES.forEach(role=> stems[role].el?.pause()); }
  if(e.data?.type === 'seek' && isFinite(e.data.time)){ ROLES.forEach(role=>{ const el = stems[role].el; if(el) el.currentTime = e.data.time; }); }
  if(e.data?.type === 'volume'){
    ROLES.forEach(role=>{
      const el = stems[role].el;
      if(!el) return;
      el.volume = e.data.value; el.muted = e.data.value <= 0;
      if(e.data.value > 0){ actx?.resume().catch(()=>{}); el.play().catch(()=>{}); }
    });
  }
});
addEventListener('pointerdown', () => {
  actx?.resume().catch(()=>{});
  ROLES.forEach(role=>{ const el = stems[role].el; if(el && !el.muted) el.play().catch(()=>{}); });
}, { once: true });
</script>
