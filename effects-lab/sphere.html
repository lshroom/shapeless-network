<!doctype html>
<!-- effect #2 for the Feed player: a "sphere" that cycles between 4 sub-effects —
     fluff (deformed icosahedron), gyroid lattice, superformula shape, mandelbulb —
     auto-switching on the kick, or manually via the dots. Orbit-controllable (drag/scroll).
     Standalone/manual opens render all three 8-shape banks at once as separate
     blended layers (see "LAYER FACTORY" below) — driven mode (the feed/post
     player and schedule editor) keeps the exact single-bank behavior it always
     had, untouched. -->
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>sphere — fluff / gyroid / superformula / mandelbulb</title>

<body>

<div id="loadSongWrap"><button id="loadSongBtn">🎵 Load a song</button><input id="loadSongFile" type="file" accept="audio/*" style="display:none"></div>

<div id="bar">

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLSL, pushAudio, audioUniforms } from '/h5555/core.js';

const clock = new THREE.Clock();

// ---- audio (shared across every layer — one song, one analyser, so all
// layers react to the exact same beat instead of drifting out of sync) ----
// bass/vocals/harmony are frequency-band proxies for the 4 Demucs stems
// (drums/bass/vocals/other) — real per-track stem separation only runs on a
// contributor's own local machine (see tools/stem_server.py), it can't run
// in a visitor's browser on the live site, so this is the closest a public
// page can get without a hosted separation service. `drums` uses broadband
// spectral flux instead of a frequency band, since a real drum hit (kick,
// snare, hihat together) shows up as energy across the WHOLE spectrum at
// once, not in one band — that's what makes it read as "reacting to drums"
// instead of just to the bass band.
const audio = { bass:0, mid:0, high:0, vocals:0, harmony:0, drums:0, rms:0, beatEnv:0, kick:0, hit:false, bassHit:false, vocalHit:false, harmonyHit:false };
let actx, analyser, freqData, timeData, srcNode;
let audioEl = null;
// ---- VISUAL DNA: a deterministic seed derived from the song's own URL, so
// the same song always looks the same (reopening a post doesn't reshuffle
// it) but different songs essentially never collide. Set by
// applyVisualSeed() below, called once blended mode's layers exist.
function hashStr(s){
  let h = 2166136261;
  for (let i=0; i<s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let onSongSeed = null; // set inside blended-mode setup; no-op in driven mode
function ensureCtx() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.8;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);
  analyser.connect(actx.destination);
}
function loadSongUrl(url, muted, startTime, active) {
  if (!url) return;
  onSongSeed?.(url);
  ensureCtx();
  if (audioEl) { try { audioEl.pause(); } catch(_){} }
  audioEl = new Audio(url);
  window.audioEl = audioEl; window.actx = actx; // debug/QA hooks — module scope isn't visible from outside otherwise
  audioEl.crossOrigin = 'anonymous'; audioEl.loop = true;
  audioEl.muted = !!muted; // muted autoplay is never blocked — used for inline Feed previews
  if (startTime > 0) audioEl.addEventListener('loadedmetadata', () => { audioEl.currentTime = startTime; }, { once: true });
  if (srcNode) { try { srcNode.disconnect(); } catch(_){} }
  srcNode = actx.createMediaElementSource(audioEl);
  srcNode.connect(analyser);
  actx.resume();
  // active === false means this frame is one of the fullscreen player's non-
  // selected effects — it must load and stay ready to seek, but NOT sound,
  // otherwise all 3 effect frames play the song at once on fullscreen open.
  if (active !== false) audioEl.play().catch(()=>{});
  document.getElementById('noSrc').style.display = 'none';
  audioEl.addEventListener('timeupdate', () => {
    try { parent.postMessage({ type: 'timeupdate', currentTime: audioEl.currentTime, duration: audioEl.duration || 0 }, '*'); } catch(_){}
  });
}
window._sphereSetSongUrl = loadSongUrl;

let bassS=0, midS=0, highS=0, rmsS=0;
let prevFreq = null, fluxFast=0, fluxSlow=0, drumRefractory=0, drumPulse=0;
// Per-band onset detector: a FAST envelope vs a SLOW rolling baseline of the
// same signal — a hit is the fast envelope spiking well above the recent
// local loudness — used once per band below (bass/vocals/harmony), plus once
// on broadband spectral flux for drums. A refractory window stops each from
// double-firing on one hit.
let bassFast=0, bassSlow=0, bassRefractory=0, bassPulse=0;
let midFast=0, midSlow=0, midRefractory=0, midPulse=0;
let hiFast=0, hiSlow=0, hiRefractory=0, hiPulse=0, harmonyCooldownUntil=0;
function onset(fast, slow, mult, add, refractoryT, minGap, now){
  return fast > slow * mult + add && (now - refractoryT) > minGap;
}
function sampleAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  const n = freqData.length;
  let b=0,m=0,h=0,flux=0; const bEnd=(n*0.08)|0, mEnd=(n*0.4)|0;
  if (!prevFreq) prevFreq = new Float32Array(n);
  for (let i=0;i<n;i++){
    const v=freqData[i]/255;
    if(i<bEnd)b+=v; else if(i<mEnd)m+=v; else h+=v;
    const d = v - prevFreq[i]; if (d > 0) flux += d;
    prevFreq[i] = v;
  }
  b/=bEnd; m/=(mEnd-bEnd); h/=(n-mEnd); flux/=n;
  let rms=0; for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; rms+=v*v; } rms=Math.sqrt(rms/timeData.length);
  bassS+=(b-bassS)*0.3; midS+=(m-midS)*0.3; highS+=(h-highS)*0.3; rmsS+=(rms-rmsS)*0.3;
  // Raw analyser bands read as quiet/subtle next to the shapes' always-on
  // idle motion (autorotate, idle breathing) — boost them here, once, so the
  // amplification reaches every shape formula and flourish that already
  // reads audio.bass/mid/high/rms, instead of retuning 21 shape functions.
  const boost = v => Math.min(1, v * 1.8);
  audio.bass=boost(bassS); audio.mid=boost(midS); audio.high=boost(highS); audio.rms=boost(rmsS);
  audio.vocals = audio.mid; // vocals live mostly in the mid band
  audio.harmony = boost(highS*0.65 + midS*0.2); // sustained texture — mostly highs, some mid

  const now = performance.now() / 1000;

  fluxFast += (flux - fluxFast) * 0.6; fluxSlow += (flux - fluxSlow) * 0.05;
  const drumHit = onset(fluxFast, fluxSlow, 1.4, 0.012, drumRefractory, 0.11, now);
  if (drumHit) drumRefractory = now;
  drumPulse = Math.max(drumPulse * 0.7, drumHit ? 1 : 0);
  audio.drums = drumPulse; audio.kick = drumPulse;
  audio.beatEnv = Math.max(audio.beatEnv*0.9, drumPulse);
  audio.hit = drumHit; // true for exactly the one sampleAudio() call a drum hit lands on

  bassFast += (b - bassFast) * 0.55; bassSlow += (b - bassSlow) * 0.045;
  const bassHit = onset(bassFast, bassSlow, 1.35, 0.06, bassRefractory, 0.16, now);
  if (bassHit) bassRefractory = now;
  bassPulse = Math.max(bassPulse * 0.75, bassHit ? 1 : 0);
  audio.bassHit = bassHit; audio.bassPulse = bassPulse;

  midFast += (m - midFast) * 0.4; midSlow += (m - midSlow) * 0.03;
  const vocalHit = onset(midFast, midSlow, 1.25, 0.05, midRefractory, 0.22, now);
  if (vocalHit) midRefractory = now;
  midPulse = Math.max(midPulse * 0.8, vocalHit ? 1 : 0);
  audio.vocalHit = vocalHit; audio.vocalPulse = midPulse;

  hiFast += (h - hiFast) * 0.5; hiSlow += (h - hiSlow) * 0.04;
  // The glitch this drives is a rare accent, not ambient texture — a 0.25s
  // refractory let it re-fire almost every second on a bright mix, which read
  // as "always the same glitch." A long randomized cooldown on top of the
  // normal onset refractory spreads real bursts out across the whole song.
  let harmonyHit = onset(hiFast, hiSlow, 1.3, 0.05, hiRefractory, 0.25, now) && now > harmonyCooldownUntil;
  if (harmonyHit) { hiRefractory = now; harmonyCooldownUntil = now + 7 + Math.random() * 10; }
  hiPulse = Math.max(hiPulse * 0.85, harmonyHit ? 1 : 0);
  audio.harmonyHit = harmonyHit; audio.harmonyPulse = hiPulse;
}

// ---- shape registry: each shape's SDF kept as its own source string so a
// shader build only has to declare the 8 shapes in one bank, not all 21.
// Compiling all 21 into one switch()/one program at once is what caused real
// 60-120s whole-browser GPU-driver locks in testing; 8-at-a-time is the
// config that's actually confirmed fast (it's the original shape count).
// Rather than cram more shapes into one program to get more variety, the
// three banks below now render as separate simultaneous layers (see "LAYER
// FACTORY"), each still only ever compiling its own 8 shapes.
const SHAPE_NAMES = ['Fluff','Gyroid Lattice','Superformula Shape','Mandelbulb Fractal','SDF Morph Field','Wave Interference Field','Chladni Plate','Resonant Spiderweb','Sea Anemone','Anemone Spiral','Sand Dunes','Slime Mold','Aurora Curtains','Catenoid Helicoid','Vector Field','Ripple Tank',"Jacob's Ladder",'Virus Capsid','Soap Bubbles','Hilbert Curve','Spin Wave'];
const SHAPE_FN = {};
SHAPE_FN[0] = { fn:'deFluff', src:`float deFluff(vec3 p){
  float n = snoise(p*2.2+uTime*0.15) + 0.5*snoise(p*4.4-uTime*0.1);
  return length(p) - (1.35 + n*0.22*(0.4+uBass));
}` };
SHAPE_FN[1] = { fn:'deGyroid', src:`float deGyroid(vec3 p){
  float s=3.0+uBass*2.0; vec3 q=p*s;
  float g=dot(sin(q),cos(q.yzx));
  float lattice=(abs(g)-0.14*(1.0+uMid))/s;
  float ball=length(p)-1.9;
  return max(lattice,ball);
}` };
SHAPE_FN[2] = { fn:'deMandelbulb', src:`float deMandelbulb(vec3 p){
  vec3 z=p*0.85; float dr=1.0; float r=0.0;
  float pw=8.0+sin(uTime*0.3)*1.0+uBass*2.0;
  for(int i=0;i<8;i++){
    r=length(z); if(r>2.0)break;
    float th=acos(z.z/r); float ph=atan(z.y,z.x);
    dr=pow(r,pw-1.0)*pw*dr+1.0;
    float zr=pow(r,pw); th*=pw; ph*=pw;
    z=zr*vec3(sin(th)*cos(ph),sin(ph)*sin(th),cos(th))+p*0.85;
  }
  return (0.5*log(r)*r/dr) / 0.85;
}` };
SHAPE_FN[3] = { fn:'deSuperformula', src:`float sfR(float angle, float m, float n1){
  float t1=pow(abs(cos(m*angle/4.0)),1.7);
  float t2=pow(abs(sin(m*angle/4.0)),1.7);
  return pow(t1+t2,-1.0/n1);
}
float deSuperformula(vec3 p){
  float m=6.0+uMid*3.0, n1=0.5+uBass;
  float len=max(length(p),0.0001);
  float theta=atan(p.z,p.x), phi=asin(clamp(p.y/len,-1.0,1.0));
  float rad=1.6*sfR(theta,m,n1)*sfR(phi,m,n1);
  return len-rad;
}` };
SHAPE_FN[4] = { fn:'deSdfMorph', src:`float deSdfMorph(vec3 p){
  float d=10.0;
  for(int i=0;i<6;i++){
    float fi=float(i);
    vec3 c=vec3(sin(uTime*0.5+fi*2.1),cos(uTime*0.4+fi*1.7),sin(uTime*0.3+fi*1.3))*(1.1+uBass*0.8);
    float r=0.35+0.28*sin(uTime+fi)+uMid*0.25;
    d=sdfSmin(d,length(p-c)-r,0.7);
  }
  return d;
}` };
// A raw heightfield SDF (p.y-h) is already an infinite tilted sheet — that's
// the actual field/carpet look. Arrangement 1 ("flat field") leaves it fully
// unbounded (no clip of any kind — the raymarch's own travel distance is the
// only limit, so there's never an edge to zoom into). Every other
// arrangement clips it into a sphere so it can show up round/ball-shaped
// instead, and so morph-crossfade has a comparably-sized shape to blend with.
SHAPE_FN[5] = { fn:'deWaveField', src:`float deWaveField(vec3 p){
  float v=0.0;
  for(int s=0;s<3;s++){
    float ang=uTime*0.5+float(s)*2.0943951;
    float sx=cos(ang)*1.6, sz=sin(ang)*1.6;
    float d=length(vec2(p.x-sx,p.z-sz));
    v += sin(d*6.5*(1.0+uMid*0.5)-uTime*4.0)/(1.0+d*0.5);
  }
  float h = v*1.0*(0.5+uBass)*0.4;
  // arrangement 1 ("flat field") gets NO clip at all — a true open,
  // unbounded sheet, only limited by how far the raymarch itself travels.
  // Every other arrangement still needs a bound so morph-crossfade and the
  // other domain warps have a comparably-sized shape to work with.
  if (uArrange==1) return p.y - h;
  return max(p.y - h, length(p)-2.1);
}` };
SHAPE_FN[6] = { fn:'deChladniField', src:`float deChladniField(vec3 p){
  float ext=2.6;
  float m=4.0+uMid*3.0, n=3.0+uHigh*2.0;
  float u=p.x/ext+0.5, v=p.z/ext+0.5;
  float h=(sin(m*3.14159265*u)*sin(n*3.14159265*v)-sin(n*3.14159265*u)*sin(m*3.14159265*v))*0.7*(0.5+uBass);
  // arrangement 1 ("flat field") gets NO clip at all — a true open,
  // unbounded sheet, only limited by how far the raymarch itself travels.
  // Every other arrangement still needs a bound so morph-crossfade and the
  // other domain warps have a comparably-sized shape to work with.
  if (uArrange==1) return p.y - h;
  return max(p.y - h, length(p)-2.1);
}` };
SHAPE_FN[7] = { fn:'deWebField', src:`float deWebField(vec3 p){
  float rad=length(p.xz), ang=atan(p.z,p.x);
  float spoke=pow(abs(cos(ang*7.0)),10.0);
  float ring=pow(abs(cos(rad*3.6-uTime*0.6)),10.0);
  float h=(max(spoke,ring)*0.6-0.12)*(0.4+uRms*2.0);
  // arrangement 1 ("flat field") gets NO clip at all — a true open,
  // unbounded sheet, only limited by how far the raymarch itself travels.
  // Every other arrangement still needs a bound so morph-crossfade and the
  // other domain warps have a comparably-sized shape to work with.
  if (uArrange==1) return p.y - h;
  return max(p.y - h, length(p)-2.1);
}` };
// ---- second batch: 13 more shapes, contributed for more variety so the
// morph never feels repetitive over a long song. Same house rules as above —
// each stays inside the ~2-unit envelope every shape shares, and reacts to
// uBass/uMid/uHigh/uBeat so it's alive even before it's this song's turn.
SHAPE_FN[8] = { fn:'deAnemoneA', src:`float deAnemoneA(vec3 p){
  float r=length(p);
  float ang=atan(p.z,p.x);
  float el=acos(clamp(p.y/max(r,0.0001),-1.0,1.0));
  float tentacle=sin(ang*9.0+sin(uTime*1.3+el*3.0)*1.4+uTime*0.6)*0.5+0.5;
  float wave=sin(uTime*2.2+el*6.0-r*3.0)*0.15*(0.4+uMid);
  return r-(1.15+tentacle*0.55*(0.3+uBass)*smoothstep(0.2,1.0,el)+wave);
}` };
SHAPE_FN[9] = { fn:'deAnemoneB', src:`float deAnemoneB(vec3 p){
  float r=length(p);
  float ang=atan(p.z,p.x);
  float el=acos(clamp(p.y/max(r,0.0001),-1.0,1.0));
  float spiral=sin(ang*5.0+el*8.0-uTime*1.8)*0.5+0.5;
  float flick=snoise(vec3(ang*2.0,el*2.0,uTime*0.8))*0.12*(0.3+uHigh);
  return r-(1.1+spiral*0.5*(0.35+uBass)*smoothstep(0.15,1.0,el)+flick);
}` };
SHAPE_FN[10] = { fn:'deSandDunes', src:`float deSandDunes(vec3 p){
  float warp=snoise(vec3(p.x*0.6,0.0,p.z*0.6+uTime*0.05))*0.6;
  float ridge=sin((p.x+warp)*2.2+uTime*0.15)*0.5+sin((p.x*0.5+p.z*0.9+warp)*1.6-uTime*0.1)*0.5;
  float h=ridge*0.45*(0.4+uBass*0.6)+snoise(vec3(p.x*1.8,p.z*1.8,uTime*0.2))*0.08*(0.3+uMid);
  return max(p.y-h, length(p)-2.2);
}` };
// A for-loop calling de() ~100x per pixel (the raymarcher) times a large
// uniform-branch dispatch across every shape was what actually blew up
