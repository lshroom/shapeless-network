<!doctype html>
<!-- effect #2 for the Feed player: a "sphere" that cycles between 4 sub-effects —
     fluff (deformed icosahedron), gyroid lattice, superformula shape, mandelbulb —
     auto-switching on the kick, or manually via the dots. Orbit-controllable (drag/scroll).
     Standalone/manual opens render all three 8-shape banks at once as separate
     blended layers (see "LAYER FACTORY" below) — driven mode (the feed/post
     player and schedule editor) keeps the exact single-bank behavior it always
     had, untouched. -->
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>sphere — fluff / gyroid / superformula / mandelbulb</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;}
  canvas{display:block;touch-action:none;}
  #layers{position:fixed;inset:0;z-index:1;}
  .layerCanvas{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;}
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
       padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
       background:linear-gradient(to top,rgba(0,0,0,.75),transparent);}
  #beatBtn,#ctlBtn,#fsBtn{background:rgba(255,255,255,.08);color:#f5f5f7;border:1px solid rgba(255,255,255,.18);border-radius:99px;
       padding:6px 12px;font-size:11px;cursor:pointer;margin-left:10px;}
  #beatBtn.on{background:rgba(139,155,255,.28);border-color:#8b9bff;color:#cdd4ff;}
  #ctlBtn.on{background:rgba(139,155,255,.28);border-color:#8b9bff;color:#cdd4ff;}
  #fsBtn{margin-left:auto;padding:6px 9px;font-size:13px;}
  #noSrc{position:fixed;bottom:56px;left:0;right:0;text-align:center;color:rgba(255,255,255,.4);font-size:11px;z-index:5;pointer-events:none;}
  #prep{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
        background:#05060a;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.02em;}
  #prep.hidden{display:none;}
  #prep .spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(139,155,255,.25);border-top-color:#8b9bff;animation:prepspin .8s linear infinite;}
  @keyframes prepspin{to{transform:rotate(360deg);}}
  #modeName{position:fixed;top:12px;left:12px;z-index:10;color:#f5f5f7;font-size:13px;font-weight:600;letter-spacing:.02em;background:rgba(10,10,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;}
  body.kiosk #bar{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
  #controlPanel{position:fixed;top:12px;right:12px;z-index:10;display:flex;flex-direction:column;gap:6px;
       background:rgba(10,10,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
       border-radius:10px;padding:10px 12px;max-width:200px;}
  .ctl-row{display:flex;flex-direction:column;gap:3px;}
  .ctl-label{color:rgba(255,255,255,.6);font-size:10px;text-transform:uppercase;letter-spacing:.03em;}
  .ctl-row input[type=range]{width:100%;accent-color:#8b9bff;}
  .ctl-row select, .ctl-row input[type=color]{width:100%;}
  #blendPanel{position:fixed;top:12px;right:12px;z-index:10;display:flex;flex-direction:column;gap:10px;
       background:rgba(10,10,14,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
       border-radius:10px;padding:10px 12px;max-width:210px;}
  .layerRow{display:flex;flex-direction:column;gap:5px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.08);}
  .layerRow:last-child{border-bottom:none;padding-bottom:0;}
  .layerRow .lr-head{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#f5f5f7;font-weight:600;}
  .layerRow .lr-head input[type=checkbox]{accent-color:#8b9bff;}
  .layerRow select{background:rgba(255,255,255,.08);color:#f5f5f7;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:3px 6px;font-size:11px;width:100%;}
  .layerRow .lr-size{display:flex;align-items:center;gap:6px;}
  .layerRow .lr-size span{font-size:9.5px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.03em;min-width:26px;}
  .layerRow input[type=range]{width:100%;accent-color:#8b9bff;}
  #loadSongWrap{position:fixed;bottom:56px;left:0;right:0;z-index:6;display:flex;justify-content:center;}
  #loadSongBtn{background:rgba(139,155,255,.22);color:#cdd4ff;border:1px solid #8b9bff;border-radius:99px;
       padding:8px 16px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="layers"></div>
<div id="prep"><div class="spin"></div><div id="prepText">Preparing visuals… 0%</div></div>
<div id="noSrc">waiting for audio…</div>
<div id="loadSongWrap"><button id="loadSongBtn">🎵 Load a song</button><input id="loadSongFile" type="file" accept="audio/*" style="display:none"></div>
<div id="controlPanel"></div>
<div id="blendPanel"></div>
<div id="modeName">Fluff</div>
<div id="bar">
  <button id="beatBtn" class="on">⚡ Auto: ON</button>
  <button id="ctlBtn" title="Controls">⚙</button>
  <button id="fsBtn" title="Fullscreen">⛶</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLSL, pushAudio, audioUniforms } from '/h5555/core.js';

const clock = new THREE.Clock();

// ---- audio (shared across every layer — one song, one analyser, so all
// layers react to the exact same beat instead of drifting out of sync) ----
const audio = { bass:0, mid:0, high:0, rms:0, beatEnv:0, kick:0, hit:false };
let actx, analyser, freqData, timeData, srcNode;
let audioEl = null;
function ensureCtx() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.8;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);
  analyser.connect(actx.destination);
}
function loadSongUrl(url, muted, startTime, active) {
  if (!url) return;
  ensureCtx();
  if (audioEl) { try { audioEl.pause(); } catch(_){} }
  audioEl = new Audio(url);
  window.audioEl = audioEl; window.actx = actx; // debug/QA hooks — module scope isn't visible from outside otherwise
  audioEl.crossOrigin = 'anonymous'; audioEl.loop = true;
  audioEl.muted = !!muted; // muted autoplay is never blocked — used for inline Feed previews
  if (startTime > 0) audioEl.addEventListener('loadedmetadata', () => { audioEl.currentTime = startTime; }, { once: true });
  if (srcNode) { try { srcNode.disconnect(); } catch(_){} }
  srcNode = actx.createMediaElementSource(audioEl);
  srcNode.connect(analyser);
  actx.resume();
  // active === false means this frame is one of the fullscreen player's non-
  // selected effects — it must load and stay ready to seek, but NOT sound,
  // otherwise all 3 effect frames play the song at once on fullscreen open.
  if (active !== false) audioEl.play().catch(()=>{});
  document.getElementById('noSrc').style.display = 'none';
  audioEl.addEventListener('timeupdate', () => {
    try { parent.postMessage({ type: 'timeupdate', currentTime: audioEl.currentTime, duration: audioEl.duration || 0 }, '*'); } catch(_){}
  });
}
window._sphereSetSongUrl = loadSongUrl;

let bassS=0, midS=0, highS=0, rmsS=0;
// Onset detector: a FAST envelope of the bass band vs a SLOW rolling baseline
// of the same band. A kick is a fast envelope spiking well above the recent
// local loudness — this reacts to the actual transient instead of drifting
// with a smoothed derivative, and a refractory window stops it double-firing
// on one hit. Works straight off the mixed signal, no stem separation needed.
let bassFast=0, bassSlow=0, kickRefractory=0, kickPulse=0;
function sampleAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  const n = freqData.length;
  let b=0,m=0,h=0; const bEnd=(n*0.08)|0, mEnd=(n*0.4)|0;
  for (let i=0;i<n;i++){ const v=freqData[i]/255; if(i<bEnd)b+=v; else if(i<mEnd)m+=v; else h+=v; }
  b/=bEnd; m/=(mEnd-bEnd); h/=(n-mEnd);
  let rms=0; for(let i=0;i<timeData.length;i++){ const v=(timeData[i]-128)/128; rms+=v*v; } rms=Math.sqrt(rms/timeData.length);
  bassS+=(b-bassS)*0.3; midS+=(m-midS)*0.3; highS+=(h-highS)*0.3; rmsS+=(rms-rmsS)*0.3;
  // Raw analyser bands read as quiet/subtle next to the shapes' always-on
  // idle motion (autorotate, idle breathing) — boost them here, once, so the
  // amplification reaches every shape formula and flourish that already
  // reads audio.bass/mid/high/rms, instead of retuning 21 shape functions.
  const boost = v => Math.min(1, v * 1.8);
  audio.bass=boost(bassS); audio.mid=boost(midS); audio.high=boost(highS); audio.rms=boost(rmsS);

  bassFast += (b - bassFast) * 0.55;
  bassSlow += (b - bassSlow) * 0.045;
  const now = performance.now() / 1000;
  let hit = false;
  if (bassFast > bassSlow * 1.35 + 0.06 && (now - kickRefractory) > 0.14) {
    hit = true; kickRefractory = now;
  }
  kickPulse = Math.max(kickPulse * 0.7, hit ? 1 : 0);
  audio.beatEnv = Math.max(audio.beatEnv*0.9, kickPulse);
  audio.kick = kickPulse;
  audio.hit = hit; // true for exactly the one sampleAudio() call the onset lands on — used to trigger one-shot beat flourishes, as opposed to audio.kick which stays >0 for several frames while its envelope decays
}

// ---- shape registry: each shape's SDF kept as its own source string so a
// shader build only has to declare the 8 shapes in one bank, not all 21.
// Compiling all 21 into one switch()/one program at once is what caused real
// 60-120s whole-browser GPU-driver locks in testing; 8-at-a-time is the
// config that's actually confirmed fast (it's the original shape count).
// Rather than cram more shapes into one program to get more variety, the
// three banks below now render as separate simultaneous layers (see "LAYER
// FACTORY"), each still only ever compiling its own 8 shapes.
const SHAPE_NAMES = ['Fluff','Gyroid Lattice','Superformula Shape','Mandelbulb Fractal','SDF Morph Field','Wave Interference Field','Chladni Plate','Resonant Spiderweb','Sea Anemone','Anemone Spiral','Sand Dunes','Slime Mold','Aurora Curtains','Catenoid Helicoid','Vector Field','Ripple Tank',"Jacob's Ladder",'Virus Capsid','Soap Bubbles','Hilbert Curve','Spin Wave'];
const SHAPE_FN = {};
SHAPE_FN[0] = { fn:'deFluff', src:`float deFluff(vec3 p){
  float n = snoise(p*2.2+uTime*0.15) + 0.5*snoise(p*4.4-uTime*0.1);
  return length(p) - (1.35 + n*0.22*(0.4+uBass));
}` };
SHAPE_FN[1] = { fn:'deGyroid', src:`float deGyroid(vec3 p){
  float s=3.0+uBass*2.0; vec3 q=p*s;
  float g=dot(sin(q),cos(q.yzx));
  float lattice=(abs(g)-0.14*(1.0+uMid))/s;
  float ball=length(p)-1.9;
  return max(lattice,ball);
}` };
SHAPE_FN[2] = { fn:'deMandelbulb', src:`float deMandelbulb(vec3 p){
  vec3 z=p*0.85; float dr=1.0; float r=0.0;
  float pw=8.0+sin(uTime*0.3)*1.0+uBass*2.0;
  for(int i=0;i<8;i++){
    r=length(z); if(r>2.0)break;
    float th=acos(z.z/r); float ph=atan(z.y,z.x);
    dr=pow(r,pw-1.0)*pw*dr+1.0;
    float zr=pow(r,pw); th*=pw; ph*=pw;
    z=zr*vec3(sin(th)*cos(ph),sin(ph)*sin(th),cos(th))+p*0.85;
  }
  return (0.5*log(r)*r/dr) / 0.85;
}` };
SHAPE_FN[3] = { fn:'deSuperformula', src:`float sfR(float angle, float m, float n1){
  float t1=pow(abs(cos(m*angle/4.0)),1.7);
  float t2=pow(abs(sin(m*angle/4.0)),1.7);
  return pow(t1+t2,-1.0/n1);
}
float deSuperformula(vec3 p){
  float m=6.0+uMid*3.0, n1=0.5+uBass;
  float len=max(length(p),0.0001);
  float theta=atan(p.z,p.x), phi=asin(clamp(p.y/len,-1.0,1.0));
  float rad=1.6*sfR(theta,m,n1)*sfR(phi,m,n1);
  return len-rad;
}` };
SHAPE_FN[4] = { fn:'deSdfMorph', src:`float deSdfMorph(vec3 p){
  float d=10.0;
  for(int i=0;i<6;i++){
    float fi=float(i);
    vec3 c=vec3(sin(uTime*0.5+fi*2.1),cos(uTime*0.4+fi*1.7),sin(uTime*0.3+fi*1.3))*(1.1+uBass*0.8);
    float r=0.35+0.28*sin(uTime+fi)+uMid*0.25;
    d=sdfSmin(d,length(p-c)-r,0.7);
  }
  return d;
}` };
// The originals were a finite EXTENT=7 plane; a raw heightfield SDF (p.y-h)
// is an infinite tilted sheet, so each is intersected with a spherical bound
// (max(...)) — the same trick deGyroid already uses to cap its lattice —
// producing a bounded patch that fits the same ~2-unit envelope every other
// shape lives in, so the morph reads as one continuous object throughout.
SHAPE_FN[5] = { fn:'deWaveField', src:`float deWaveField(vec3 p){
  float v=0.0;
  for(int s=0;s<3;s++){
    float ang=uTime*0.5+float(s)*2.0943951;
    float sx=cos(ang)*1.6, sz=sin(ang)*1.6;
    float d=length(vec2(p.x-sx,p.z-sz));
    v += sin(d*6.5*(1.0+uMid*0.5)-uTime*4.0)/(1.0+d*0.5);
  }
  float h = v*1.0*(0.5+uBass)*0.4;
  return max(p.y - h, length(p)-2.1);
}` };
SHAPE_FN[6] = { fn:'deChladniField', src:`float deChladniField(vec3 p){
  float ext=2.6;
  float m=4.0+uMid*3.0, n=3.0+uHigh*2.0;
  float u=p.x/ext+0.5, v=p.z/ext+0.5;
  float h=(sin(m*3.14159265*u)*sin(n*3.14159265*v)-sin(n*3.14159265*u)*sin(m*3.14159265*v))*0.7*(0.5+uBass);
  return max(p.y - h, length(p)-2.1);
}` };
SHAPE_FN[7] = { fn:'deWebField', src:`float deWebField(vec3 p){
  float rad=length(p.xz), ang=atan(p.z,p.x);
  float spoke=pow(abs(cos(ang*7.0)),10.0);
  float ring=pow(abs(cos(rad*3.6-uTime*0.6)),10.0);
  float h=(max(spoke,ring)*0.6-0.12)*(0.4+uRms*2.0);
  return max(p.y - h, length(p)-2.1);
}` };
// ---- second batch: 13 more shapes, contributed for more variety so the
// morph never feels repetitive over a long song. Same house rules as above —
// each stays inside the ~2-unit envelope every shape shares, and reacts to
// uBass/uMid/uHigh/uBeat so it's alive even before it's this song's turn.
SHAPE_FN[8] = { fn:'deAnemoneA', src:`float deAnemoneA(vec3 p){
  float r=length(p);
  float ang=atan(p.z,p.x);
  float el=acos(clamp(p.y/max(r,0.0001),-1.0,1.0));
  float tentacle=sin(ang*9.0+sin(uTime*1.3+el*3.0)*1.4+uTime*0.6)*0.5+0.5;
  float wave=sin(uTime*2.2+el*6.0-r*3.0)*0.15*(0.4+uMid);
  return r-(1.15+tentacle*0.55*(0.3+uBass)*smoothstep(0.2,1.0,el)+wave);
}` };
SHAPE_FN[9] = { fn:'deAnemoneB', src:`float deAnemoneB(vec3 p){
  float r=length(p);
  float ang=atan(p.z,p.x);
  float el=acos(clamp(p.y/max(r,0.0001),-1.0,1.0));
  float spiral=sin(ang*5.0+el*8.0-uTime*1.8)*0.5+0.5;
  float flick=snoise(vec3(ang*2.0,el*2.0,uTime*0.8))*0.12*(0.3+uHigh);
  return r-(1.1+spiral*0.5*(0.35+uBass)*smoothstep(0.15,1.0,el)+flick);
}` };
SHAPE_FN[10] = { fn:'deSandDunes', src:`float deSandDunes(vec3 p){
  float warp=snoise(vec3(p.x*0.6,0.0,p.z*0.6+uTime*0.05))*0.6;
  float ridge=sin((p.x+warp)*2.2+uTime*0.15)*0.5+sin((p.x*0.5+p.z*0.9+warp)*1.6-uTime*0.1)*0.5;
  float h=ridge*0.45*(0.4+uBass*0.6)+snoise(vec3(p.x*1.8,p.z*1.8,uTime*0.2))*0.08*(0.3+uMid);
  return max(p.y-h, length(p)-2.2);
}` };
// A for-loop calling de() ~100x per pixel (the raymarcher) times a large
// uniform-branch dispatch across every shape was what actually blew up
// compile time in testing — not any one shape's runtime cost. Fixed 3-term
// versions below (no dynamic loop) give the compiler far less to chew on
// than a loop it has to unroll/analyze inside an already-huge function.
SHAPE_FN[11] = { fn:'deSlimeMold', src:`float deSlimeMold(vec3 p){
  float r=(0.1+0.05*sin(uTime*1.5))*(0.6+uBass*0.8);
  float d=deTendril(p, vec3(sin(uTime*0.35)*0.7,sin(uTime*0.28)*0.5,cos(uTime*0.31)*0.7)*(0.65+uMid*0.5), normalize(vec3(sin(uTime*0.2),0.7,sin(1.1-uTime*0.15))), r);
  d=sdfSmin(d, deTendril(p, vec3(sin(uTime*0.35+1.9)*0.7,sin(uTime*0.28+2.7)*0.5,cos(uTime*0.31+1.4)*0.7)*(0.65+uMid*0.5), normalize(vec3(sin(3.1+uTime*0.2),cos(2.3),sin(1.1*2.0-uTime*0.15))), r), 0.35);
  d=sdfSmin(d, deTendril(p, vec3(sin(uTime*0.35+3.8)*0.7,sin(uTime*0.28+5.4)*0.7,cos(uTime*0.31+2.8)*0.7)*(0.65+uMid*0.5), normalize(vec3(sin(6.2+uTime*0.2),cos(4.6),sin(3.3-uTime*0.15))), r), 0.35);
  return d;
}` };
SHAPE_FN[12] = { fn:'deAurora', src:`float deAurora(vec3 p){
  float sheet=sin(p.x*2.0+snoise(vec3(p.x*0.4,p.y*0.3,uTime*0.25))*2.0-uTime*0.6)*0.4;
  float thickness=0.16+0.1*sin(p.y*1.5+uTime*0.4)*(0.3+uMid);
  float d=abs(p.z-sheet)-thickness;
  float vFall=abs(p.y)-1.6-0.3*uBass;
  return max(max(d,vFall), length(p)-2.4);
}` };
SHAPE_FN[13] = { fn:'deCatHelic', src:`float deCatHelic(vec3 p){
  float r=length(p.xz), ang=atan(p.z,p.x);
  float blend=0.5+0.5*sin(uTime*0.25);
  float catY=log(max(r,0.05))*0.6;
  float helY=ang*0.6/3.14159265*1.6;
  float y=mix(catY,helY,blend);
  float hgt=p.y-y*(0.6+uMid*0.4);
  return max(abs(hgt)-0.12*(0.6+uBass*0.5), r-2.0);
}` };
// Reads as flow strands but stays cheap: curlNoise (3 snoise calls each)
// inside a loop, itself called ~600x per pixel by the raymarcher, was what
// hung the page outright in testing. Plain trig drift, unrolled to 3 fixed
// strands (no dynamic loop) instead — same wandering-streamline feel.
SHAPE_FN[14] = { fn:'deVectorField', src:`float deVectorField(vec3 p){
  float spd=uTime*(0.6+uBass*0.8);
  float rr=0.08*(0.7+uHigh*0.6);
  vec3 c0=vec3(sin(0.0),cos(0.0),sin(0.0))*1.3+vec3(sin(spd*1.3),cos(spd*1.1),sin(spd*0.9))*0.6;
  vec3 c1=vec3(sin(2.4),cos(1.7),sin(3.1))*1.3+vec3(sin(spd*1.3+1.7),cos(spd*1.1+2.3),sin(spd*0.9+3.1))*0.6;
  vec3 c2=vec3(sin(4.8),cos(3.4),sin(6.2))*1.3+vec3(sin(spd*1.3+3.4),cos(spd*1.1+4.6),sin(spd*0.9+6.2))*0.6;
  float d=length(p-c0)-rr;
  d=sdfSmin(d, length(p-c1)-rr, 0.25);
  d=sdfSmin(d, length(p-c2)-rr, 0.25);
  return d;
}` };
SHAPE_FN[15] = { fn:'deRippleTank', src:`float deRippleTank(vec3 p){
  vec2 s1=vec2(0.9,0.0), s2=vec2(-0.9,0.0);
  float d1=length(p.xz-s1), d2=length(p.xz-s2);
  float w=sin(d1*7.0-uTime*4.0)+sin(d2*7.0-uTime*4.0*1.05);
  float h=abs(w)*0.5*(0.35+uBass*0.7)-0.15;
  return max(p.y-h, length(p)-2.2);
}` };
SHAPE_FN[16] = { fn:'deJacobsLadder', src:`float deJacobsLadder(vec3 p){
  float zig=snoise(vec3(p.y*2.5,uTime*2.2,0.0))*0.4*(0.3+uHigh*0.8);
  vec3 c=vec3(zig,p.y,snoise(vec3(p.y*2.5+50.0,uTime*2.2,0.0))*0.15);
  float bolt=length(p-c)-(0.045+0.05*uBeat);
  float rodL=abs(length(p.xz-vec2(0.75,0.0))-0.03);
  float rodR=abs(length(p.xz-vec2(-0.75,0.0))-0.03);
  return max(min(bolt,min(rodL,rodR)), length(p)-2.0);
}` };
SHAPE_FN[17] = { fn:'deCapsid', src:`float deCapsid(vec3 p){
  vec3 q=normalize(p);
  float spikes=0.0;
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(2.4),cos(1.7),sin(3.1)))),0.0),9.0));
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(5.4),cos(3.4),sin(2.7)))),0.0),9.0));
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(8.4),cos(5.1),sin(5.5)))),0.0),9.0));
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(11.4),cos(6.8),sin(7.1)))),0.0),9.0));
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(14.4),cos(8.5),sin(9.9)))),0.0),9.0));
  spikes=max(spikes,pow(max(dot(q,normalize(vec3(sin(17.4),cos(10.2),sin(12.3)))),0.0),9.0));
  float pulse=0.25+0.55*uBeat+0.2*uBass;
  return length(p)-(1.15+spikes*pulse);
}` };
SHAPE_FN[18] = { fn:'deSoapBubbles', src:`float deSoapBubbles(vec3 p){
  float m=0.75+uMid*0.4, r=0.55+uBass*0.25;
  vec3 c0=vec3(sin(uTime*0.4),cos(uTime*0.33),sin(uTime*0.28))*m;
  vec3 c1=vec3(sin(uTime*0.4+2.4),cos(uTime*0.33+1.8),sin(uTime*0.28+3.1))*m;
  vec3 c2=vec3(sin(uTime*0.4+4.8),cos(uTime*0.33+3.6),sin(uTime*0.28+6.2))*m;
  float d=length(p-c0)-(r+0.18*sin(uTime*0.9));
  d=sdfSmin(d, length(p-c1)-(r+0.18*sin(uTime*0.9+2.4)), 1.1);
  d=sdfSmin(d, length(p-c2)-(r+0.18*sin(uTime*0.9+4.8)), 1.1);
  return d+snoise(p*3.0+uTime*0.3)*0.03*(0.3+uHigh);
}` };
SHAPE_FN[19] = { fn:'deHilbert', src:`float deHilbert(vec3 p){
  float cell=0.5;
  vec3 q=p/cell, idx=floor(q), f=fract(q)-0.5;
  float h=hash11(dot(idx,vec3(12.9898,78.233,37.719))+floor(uTime*0.5));
  float turn=step(0.5,h);
  vec3 seg=mix(vec3(f.x,f.y*0.15,f.z*0.15), vec3(f.x*0.15,f.y,f.z*0.15), turn);
  float d=sdBoxH(seg*cell, vec3(0.16,0.05,0.05)*cell*(0.6+uMid*0.5));
  return max(d, length(p)-2.0);
}` };
SHAPE_FN[20] = { fn:'deSpinWave', src:`float deSpinWave(vec3 p){
  float r=length(p.xz), ang=atan(p.z,p.x);
  float spiral=sin(r*5.0-ang*3.0-uTime*3.0*(0.5+uBass))*0.5;
  float h=spiral*0.35*(0.4+uMid*0.6);
  return max(p.y-h, length(p)-2.2);
}` };

// Shared helper routines a few shapes above depend on — kept tiny, always
// included (they were present in the original confirmed-fast 8-shape build
// too, since deSdfMorph used sdfSmin from day one).
const HELPERS_SRC = `
float sdfSmin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float deTendril(vec3 p, vec3 c, vec3 dir, float r){
  vec3 q=p-c;
  float along=clamp(dot(q,dir),-0.7,0.7);
  return length(p-(c+dir*along))-r;
}
float sdBoxH(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
`;

// 8 shapes compiled together at a time — the config actually confirmed fast.
// Each bank still liquid-morphs freely within itself; switching banks (driven
// mode only, via ?bank=) pays one recompile, same cost as loading a different
// page, never something that happens mid-song. In blended mode all three
// banks are just always live as separate layers instead.
const BANKS = [
  { label: 'Classic', ids: [0,1,2,3,4,5,6,7] },
  { label: 'Organic', ids: [8,9,10,11,12,13,17,18] },
  { label: 'Flow & Field', ids: [14,15,16,19,20,3,7,12] },
];
function findBankAndLocal(globalId){
  for (let b=0;b<BANKS.length;b++){ const li=BANKS[b].ids.indexOf(globalId); if(li>=0) return {bank:b, local:li}; }
  return null;
}

function buildMorphFrag(ids){
  const shapesSrc = ids.map(id => SHAPE_FN[id].src).join('\n');
  const cases = ids.map((id,li) => `    case ${li}: return ${SHAPE_FN[id].fn}(p);`).join('\n');
  const lastFn = SHAPE_FN[ids[ids.length-1]].fn;
  return `
${GLSL.snoise3}
${GLSL.hash}
${GLSL.palette}
uniform int uCur, uNext;
uniform float uMorph;
uniform vec3 uJitter;
uniform mat3 uJitterRot;
uniform float uHueKick;
uniform float uPulse;
uniform int uMaxSteps, uNormalSamples;
${HELPERS_SRC}
${shapesSrc}
float deShape(int id, vec3 p){
  // switch/case instead of an if/else ladder — HLSL (what ANGLE translates
  // this to on Windows) commonly compiles switch as a jump table instead of
  // flattening every branch's code into one register-allocation pass the
  // way a long if/else chain does. GLSL ES 3.00 only (requires WebGL2).
  switch(id){
${cases}
    default: return ${lastFn}(p);
  }
}
float de(vec3 p){
  // uJitterRot adds a small bounded spring-back rotation on top of the
  // translation jitter — beat flourishes nudge it, it always springs back
  // toward identity, so the shape gets real "internal shift" without ever
  // ending up permanently misoriented. uPulse is a real geometry swell, not
  // a camera trick: evaluating the SDF in space scaled by (1+uPulse) and
  // scaling the returned distance back makes the shape itself visibly
  // grow/breathe on the beat.
  float pulseS = 1.0 + uPulse;
  vec3 q = (uJitterRot * (p - uJitter)) / pulseS;
  float dA=deShape(uCur,q) * pulseS;
  if(uMorph<=0.001) return dA;
  float dB=deShape(uNext,q) * pulseS;
  float t=smoothstep(0.0,1.0,uMorph);
  // A plain mix() of two distance FIELDS doesn't read as a dissolve — the two
  // shapes have very different distance magnitudes, so the surface tends to
  // pop to whichever field dominates instead of visibly blending. Pulling the
  // surface inward through the middle of the transition (peaking at t=0.5)
  // forces a soft, swollen, liquid bulge where the two shapes genuinely melt
  // into each other instead of one popping over the other.
  float liquid = 4.0*t*(1.0-t) * 0.55;
  return mix(dA,dB,t) - liquid;
}
vec3 shapeColor(int id){
  float hue;
  if(id==0) hue=0.08; else if(id==1) hue=0.55; else if(id==2) hue=0.75; else if(id==3) hue=0.33;
  else if(id==4) hue=0.9; else if(id==5) hue=0.58; else if(id==6) hue=0.82; else hue=0.62;
  return spectral(hue + uTime*0.02 + uHueKick*0.2);
}
// Returns (color, hit) — hit=0 for a ray that never found a surface. Used so
// non-base layers can render with alpha=0 background instead of an opaque
// black square, which is what lets CSS mix-blend-mode (multiply especially)
// composite the actual shapes instead of just darkening everything to black.
vec4 renderRM(vec3 ro, vec3 rd){
  float t=0.0; vec3 col=vec3(0.0); float hit=0.0;
  for(int i=0;i<uMaxSteps;i++){
    vec3 p=ro+rd*t; float d=de(p);
    if(d<0.002){
      vec3 n=vec3(0.0);
      vec3 t0=vec3(1.0,1.0,1.0), t1=vec3(1.0,-1.0,-1.0), t2=vec3(-1.0,1.0,-1.0), t3=vec3(-1.0,-1.0,1.0);
      for(int gi=0;gi<uNormalSamples;gi++){
        vec3 e = (gi==0)?t0 : (gi==1)?t1 : (gi==2)?t2 : t3;
        n += e * de(p+e*0.002);
      }
      n=normalize(n);
      float diff=max(dot(n,normalize(vec3(0.6,0.8,0.5))),0.0);
      float fres=pow(1.0-max(dot(n,-rd),0.0),2.5);
      vec3 baseCol=mix(shapeColor(uCur),shapeColor(uNext),smoothstep(0.0,1.0,uMorph));
      float ao=1.0-float(i)/float(uMaxSteps);
      col=baseCol*(0.28+0.72*diff)*ao+fres*0.4*baseCol;
      hit=1.0;
      break;
    }
    t+=d; if(t>16.0)break;
  }
  return vec4(col,hit);
}`;
}

// Built directly here (not via core.js's shared raymarchQuad) so this page
// alone can use GLSL ES 3.00 — needed for a real switch(id) statement in
// deShape(), which GLSL ES 1.00/WebGL1 doesn't support at all. Other pages
// still use core.js's WebGL1-style helper unchanged.
function makeUniforms(){
  return Object.assign(audioUniforms(), {
    uRes: { value: new THREE.Vector2(1, 1) },
    uCamPos: { value: new THREE.Vector3() },
    uCamMat: { value: new THREE.Matrix4() },
    uCur:{value:0}, uNext:{value:0}, uMorph:{value:0},
    uJitter:{value:new THREE.Vector3()}, uJitterRot:{value:new THREE.Matrix3()},
    uHueKick:{value:0}, uPulse:{value:0},
    uMaxSteps:{value:64}, uNormalSamples:{value:4},
  });
}
function buildMaterial(bankIdx){
  const bank = BANKS[bankIdx];
  const u = makeUniforms();
  const m = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    transparent: true,
    uniforms: u,
    vertexShader: `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `
      precision highp float;
      in vec2 vUv;
      out vec4 fragColor;
      uniform vec2 uRes; uniform vec3 uCamPos; uniform mat4 uCamMat;
      uniform float uTime,uBass,uMid,uHigh,uRms,uBeat;
      ${buildMorphFrag(bank.ids)}
      void main(){
        vec2 p=(vUv*2.0-1.0); p.x*=uRes.x/uRes.y;
        vec3 rd=normalize((uCamMat*vec4(p,-1.5,0.0)).xyz);
        vec3 ro=uCamPos;
        vec4 rc=renderRM(ro,rd);
        vec3 col=pow(clamp(rc.rgb,0.0,1.0),vec3(0.4545));
        fragColor=vec4(col,rc.a);
      }`,
    depthWrite: false,
    depthTest: false,
  });
  return { material: m, uniforms: u };
}

// ================= LAYER FACTORY =================
// One independent renderer/scene/camera/mesh/controls per layer, each
// compiling only its own 8-shape bank (the compile-time-safe config). A
// layer owns its own shape-switching, jitter, rotation-wobble and pulse
// state so the 3 layers in blended mode drift out of phase with each other
// instead of all doing the same thing in lockstep — driven mode just never
// creates more than one of these.
// `camera` is now ALWAYS the one shared module-level camera (see "SHARED
// CAMERA" below) — every layer renders through the exact same camera object,
// so a drag/orbit gesture (driven by the one OrbitControls bound to it) moves
// every layer in lockstep instead of only whichever canvas happens to be on
// top of the pointer-event stack. Each layer keeps its own independent
// jitter/rotation-wobble/pulse/hue flourishes (those are shader uniforms, not
// camera state) so they still don't all look identical.
function createLayer({ canvas, bankIdx, alpha, onLabel, intervalMult=1, camera }){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
  renderer.setClearColor(0x05060a, alpha ? 0 : 1);
  const scene = new THREE.Scene();

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // UnrealBloomPass composites its glow with an internal pass that forces the
  // output alpha to 1 everywhere — fine for the single opaque driven-mode
  // layer, but on a transparent (alpha:true) blended-mode layer it turns
  // every "no hit" pixel into an opaque black square, blotting out whatever
  // is stacked underneath (the background layer, and any layer beneath it).
  // So only opaque layers get bloom; transparent ones skip straight to output.
  let bloom = null;
  if (!alpha) {
    bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.7, 0.85);
    composer.addPass(bloom);
  }
  composer.addPass(new OutputPass());
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h); composer.setSize(w, h);
    bloom?.resolution.set(w, h);
  }
  addEventListener('resize', resize); resize();

  let bank = bankIdx;
  let mat, uniforms;
  { const built = buildMaterial(bank); mat = built.material; uniforms = built.uniforms; }
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  scene.add(mesh);

  const jitterVel = new THREE.Vector3(), jitterPos = new THREE.Vector3();
  const rotVel = new THREE.Vector3(), rotOffset = new THREE.Vector3();
  let pulseVel = 0, pulseVal = 0;
  let active = 0, morphTarget = 0, morphing = false, morphStartT = 0;
  let lastSwitch = Math.random() * 3; // staggered starts so layers don't all switch on the same beat
  let switchIntervalSec = 14 * intervalMult;
  let autoBeat = true, enabled = true;
  const MORPH_SECONDS = 1.6;

  function label(i){ if (onLabel) onLabel(SHAPE_NAMES[BANKS[bank].ids[i]]); }
  function setShapeInstant(i){
    active = i; morphTarget = i; morphing = false;
    uniforms.uCur.value = i; uniforms.uNext.value = i; uniforms.uMorph.value = 0;
    label(i);
  }
  function startMorphTo(i, tNow){
    if (i === active && !morphing) return;
    uniforms.uCur.value = active; uniforms.uNext.value = i;
    morphTarget = i; morphing = true; morphStartT = tNow;
    label(i);
  }
  function onBeatMove(){
    // Pulse (the shape itself swelling/breathing) fires on EVERY beat — it's
    // the one flourish that's actually geometry, not camera. The rest are
    // occasional variety on top of that, picked randomly each hit. Camera
    // flourishes (orbit spin flip, FOV punch) now live at module level since
    // the camera is shared across every layer.
    pulseVel += 1.6 + audio.bass * 0.8;
    const roll = Math.random();
    if (roll < 0.38) {
      rotVel.set((Math.random()-0.5)*3.2, (Math.random()-0.5)*3.2, (Math.random()-0.5)*3.2);
    } else if (roll < 0.72) {
      jitterVel.set((Math.random()-0.5)*1.1, (Math.random()-0.5)*0.95, (Math.random()-0.5)*0.7);
    } else {
      uniforms.uHueKick.value = 1;
    }
  }

  function step(dt, t){
    if (!enabled) return;
    if (autoBeat) {
      const effInterval = switchIntervalSec * (0.55 + Math.min(1, audio.rms * 3));
      if (!morphing && (t - lastSwitch) > 1.8 && (audio.kick > 0.6 || (t - lastSwitch) > effInterval)) {
        lastSwitch = t;
        startMorphTo((active + 1) % BANKS[bank].ids.length, t);
      }
    }
    if (audio.hit) onBeatMove();
    if (morphing) {
      const p = Math.min(1, (t - morphStartT) / MORPH_SECONDS);
      uniforms.uMorph.value = p;
      if (p >= 1) { active = morphTarget; uniforms.uCur.value = active; uniforms.uMorph.value = 0; morphing = false; }
    }
    if (audio.kick > 0.6) {
      jitterVel.set((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.35);
    }
    jitterVel.multiplyScalar(Math.pow(0.85, dt*60));
    jitterPos.addScaledVector(jitterVel, dt);
    jitterPos.x += Math.sin(t*0.9)*0.006*(0.3+audio.mid);
    jitterPos.y += Math.cos(t*0.7)*0.006*(0.3+audio.rms);
    jitterPos.multiplyScalar(Math.pow(0.9, dt*60));
    uniforms.uJitter.value.copy(jitterPos);
    // Decay rates below are per REAL SECOND (Math.pow(k, dt), not dt*60) so
    // these flourishes read clearly for a beat or more instead of vanishing
    // within a single frame.
    rotVel.multiplyScalar(Math.pow(0.2, dt));
    rotOffset.addScaledVector(rotVel, dt);
    rotOffset.multiplyScalar(Math.pow(0.25, dt));
    uniforms.uJitterRot.value.setFromMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rotOffset.x, rotOffset.y, rotOffset.z)));
    uniforms.uHueKick.value *= Math.pow(0.2, dt);
    pulseVel *= Math.pow(0.25, dt);
    pulseVal += pulseVel * dt;
    pulseVal *= Math.pow(0.35, dt);
    const idleBreath = Math.sin(t*0.55)*0.028 + Math.sin(t*1.3+1.7)*0.016;
    uniforms.uPulse.value = Math.max(-0.35, Math.min(0.9, pulseVal + idleBreath));
    // camera is the shared one — its own orbit/fov update happens once at
    // module level, not per layer; this just reads its current pose.
    pushAudio(uniforms, audio, t);
    uniforms.uRes.value.set(innerWidth, innerHeight);
    uniforms.uCamPos.value.copy(camera.position);
    uniforms.uCamMat.value.copy(camera.matrixWorld);
    composer.render();
  }

  function precompile(){
    return (renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera)))
      .catch(e => console.error('layer precompile failed:', e));
  }

  return {
    canvas,
    get bank(){ return bank; },
    setShapeInstant, startMorphTo, step, precompile,
    setAutoBeat(v){ autoBeat = v; },
    setEnabled(v){ enabled = v; canvas.style.display = v ? 'block' : 'none'; },
    setInterval(base){ switchIntervalSec = base * intervalMult; },
  };
}

// ================= BACKGROUND LAYER =================
// A 4th, much cheaper layer that sits behind the three raymarched banks: a
// slow-drifting noise/color field, not a raymarched shape, so it costs
// almost nothing to compile or render — one noise lookup per pixel, no
// raymarch loop at all. Gives the composite a constantly-shifting base even
// under whichever shape layers are switched off, and reacts to the same
// shared audio signal (hue drifts with the mids, a small beat-synced glow).
function createBackgroundLayer({ canvas }){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
  renderer.setClearColor(0x05060a, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  function resize(){ renderer.setSize(innerWidth, innerHeight); }
  addEventListener('resize', resize); resize();

  const uniforms = Object.assign(audioUniforms(), {
    uRes: { value: new THREE.Vector2(1, 1) },
    uDrift: { value: new THREE.Vector2(0, 0) },
  });
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms,
    vertexShader: `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `
      precision highp float;
      in vec2 vUv;
      out vec4 fragColor;
      uniform vec2 uRes, uDrift;
      uniform float uTime,uBass,uMid,uHigh,uRms,uBeat;
      ${GLSL.snoise3}
      ${GLSL.palette}
      void main(){
        vec2 uv=(vUv*2.0-1.0); uv.x*=uRes.x/uRes.y;
        vec2 q = uv*1.2 + uDrift;
        float n1 = snoise(vec3(q*0.6, uTime*0.035));
        float n2 = snoise(vec3(q*1.4+11.0, uTime*0.06+5.0));
        float field = n1*0.65 + n2*0.35;
        float hue = fract(field*0.5 + uTime*0.01 + uMid*0.08);
        vec3 col = spectral(hue) * (0.32 + 0.24*(0.5+0.5*field) + uBeat*0.22 + uBass*0.14);
        fragColor = vec4(col, 1.0);
      }`,
    depthWrite:false, depthTest:false,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  scene.add(mesh);

  let enabled = true;
  const drift = new THREE.Vector2(0, 0);
  function step(dt, t){
    if (!enabled) return;
    // Slow constant drift plus a little extra push tied to the mids/rms, so
    // the background is always slowly shifting even through a quiet stretch
    // with no shape switch happening at all.
    drift.x += dt * (0.015 + audio.mid * 0.01);
    drift.y += dt * (0.008 + audio.rms * 0.01);
    uniforms.uDrift.value.copy(drift);
    uniforms.uRes.value.set(innerWidth, innerHeight);
    pushAudio(uniforms, audio, t);
    renderer.render(scene, camera);
  }
  function precompile(){
    return (renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera)))
      .catch(e => console.error('background layer precompile failed:', e));
  }
  return {
    canvas, label: 'Background', blend: 'normal', scale: 1.0,
    step, precompile,
    setEnabled(v){ enabled = v; canvas.style.display = v ? 'block' : 'none'; },
    setAutoBeat(){}, setInterval(){}, // no-ops — kept so shared loop/UI code can treat every layer the same way
  };
}

// ================= SHARED CAMERA =================
// One camera + one OrbitControls for the whole page (not per layer) — every
// layer's RenderPass/precompile renders through this exact object, so a drag
// gesture moves every layer together instead of just whichever canvas
// happens to be topmost in the CSS stacking order.
const BASE_FOV = 55;
const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 6);
const controls = new OrbitControls(camera, document.getElementById('layers'));
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 14;
let spinDir = 1, fovPunch = 0;
let userDragging = false, lastUserInteractT = 0;
controls.addEventListener('start', () => { userDragging = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { userDragging = false; lastUserInteractT = clock.getElapsedTime(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
function stepCamera(dt, t) {
  if (!userDragging && !controls.autoRotate && (t - lastUserInteractT) > 3.5) controls.autoRotate = true;
  const baseRotSpeed = (0.4 + audio.bass * 1.1) * spinDir;
  controls.autoRotateSpeed += (baseRotSpeed - controls.autoRotateSpeed) * Math.min(1, dt * 1.5);
  fovPunch *= Math.pow(0.15, dt);
  camera.fov = BASE_FOV + audio.beatEnv * 3.5 + fovPunch;
  camera.updateProjectionMatrix();
  controls.update(dt);
}
function cameraBeatFlourish() {
  if (Math.random() < 0.5) spinDir *= -1;
  else fovPunch += 6 + audio.bass * 4;
}

// ================= MODE SELECT =================
const layersEl = document.getElementById('layers');
const driven = new URLSearchParams(location.search).get('driven') === '1';
let layers = [];

if (driven) {
  // ---- exact previous single-bank behavior — the feed/post player and
  // schedule editor iframe always land here, untouched by blended mode. ----
  const canvas = document.createElement('canvas');
  canvas.className = 'layerCanvas'; canvas.style.zIndex = '1';
  layersEl.appendChild(canvas);
  let bankIdx = 0;
  { const bp = parseInt(new URLSearchParams(location.search).get('bank'), 10); if (Number.isInteger(bp) && bp >= 0 && bp < BANKS.length) bankIdx = bp; }
  const modeNameEl = document.getElementById('modeName');
  const layer = createLayer({ canvas, bankIdx, alpha:false, onLabel:(name)=>{ modeNameEl.textContent = name; }, camera });
  layer.setAutoBeat(false); // uploader/editor drives shape choice externally
  layers = [layer];
  document.getElementById('bar').style.display = 'none';
  document.getElementById('controlPanel').style.display = 'none';
  document.getElementById('blendPanel').style.display = 'none';
  modeNameEl.textContent = SHAPE_NAMES[BANKS[bankIdx].ids[0]];

  // shape= (global id 0-20) resolves to the loaded bank's local index — never
  // switched mid-song, since a bank swap pays a real recompile and could
  // reintroduce the freeze this whole system exists to avoid. Out-of-bank
  // ids are ignored with a console warning instead of forcing a recompile.
  const shapeParam = parseInt(new URLSearchParams(location.search).get('shape'), 10);
  if (Number.isInteger(shapeParam)) {
    const loc = findBankAndLocal(shapeParam);
    if (loc && loc.bank === bankIdx) layer.setShapeInstant(loc.local);
    else if (loc) console.warn(`sphere: ?shape=${shapeParam} is in bank ${loc.bank} ("${BANKS[loc.bank].label}") but bank ${bankIdx} is loaded — pass &bank=${loc.bank} instead. Ignoring.`);
  }

  addEventListener('message', e=>{
    if (e.data?.type === 'song') loadSongUrl(e.data.url || null, e.data.muted);
    if (e.data?.type === 'setShape' && Number.isInteger(e.data.index)) {
      const loc = findBankAndLocal(e.data.index);
      if (!loc) return;
      if (loc.bank !== bankIdx) {
        console.warn(`sphere: setShape index=${e.data.index} needs bank ${loc.bank} but bank ${bankIdx} is loaded — load with &bank=${loc.bank}. Ignoring.`);
        return;
      }
      if (e.data.instant) layer.setShapeInstant(loc.local);
      else layer.startMorphTo(loc.local, clock.getElapsedTime());
    }
    if (e.data?.type === 'setActive') {
      if (e.data.active) {
        if (audioEl && isFinite(e.data.time) && Math.abs(audioEl.currentTime - e.data.time) > 0.4) audioEl.currentTime = e.data.time;
        actx?.resume().catch(()=>{}); audioEl?.play().catch(()=>{});
      }
      else audioEl?.pause();
    }
    if (e.data?.type === 'mute' && audioEl) {
      audioEl.muted = !!e.data.muted;
      if (!e.data.muted) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
    if (e.data?.type === 'play' && audioEl) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    if (e.data?.type === 'pause' && audioEl) audioEl.pause();
    if (e.data?.type === 'seek' && audioEl && isFinite(e.data.time)) audioEl.currentTime = e.data.time;
    if (e.data?.type === 'volume' && audioEl) {
      audioEl.volume = e.data.value; audioEl.muted = e.data.value <= 0;
      if (e.data.value > 0) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
  });
} else {
  // ---- blended: all three 8-shape banks render simultaneously as separate
  // layers, composited with CSS mix-blend-mode + a per-layer size scale —
  // each layer still only ever compiles its own 8 shapes (the confirmed-fast
  // config), so this gets the "all 21 shapes worth of variety, always moving"
  // request without recompiling more shapes into any single shader. ----
  document.getElementById('modeName').style.display = 'none';
  // Background first (z:0, opaque) so the 3 shape layers above it can all be
  // transparent outside their actual shape — otherwise an opaque black quad
  // would just cover the background wherever a shape isn't.
  const bgCanvas = document.createElement('canvas');
  bgCanvas.className = 'layerCanvas'; bgCanvas.style.zIndex = '0'; bgCanvas.style.mixBlendMode = 'normal';
  layersEl.appendChild(bgCanvas);
  const bgLayer = createBackgroundLayer({ canvas: bgCanvas });

  const LAYER_DEFS = [
    { bank:0, blend:'normal',     scale:1.0,  z:1, mult:1.0 },
    { bank:1, blend:'screen',     scale:0.8,  z:2, mult:1.3 },
    { bank:2, blend:'difference', scale:0.6,  z:3, mult:0.85 },
  ];
  const shapeLayers = LAYER_DEFS.map(def => {
    const canvas = document.createElement('canvas');
    canvas.className = 'layerCanvas';
    canvas.style.zIndex = String(def.z);
    canvas.style.mixBlendMode = def.blend;
    canvas.style.transform = `scale(${def.scale})`;
    layersEl.appendChild(canvas);
    const layer = createLayer({ canvas, bankIdx: def.bank, alpha: true, intervalMult: def.mult, camera });
    layer.blend = def.blend;
    layer.scale = def.scale;
    layer.label = BANKS[def.bank].label;
    return layer;
  });
  layers = [bgLayer, ...shapeLayers];

  const BLEND_MODES = ['normal','multiply','screen','difference','exclusion','overlay','lighten','darken'];
  function renderBlendPanel(){
    const wrap = document.getElementById('blendPanel');
    wrap.innerHTML = '';
    layers.forEach((layer, i) => {
      const row = document.createElement('div');
      row.className = 'layerRow';
      const modeOpts = BLEND_MODES.map(m => `<option value="${m}"${m===layer.blend?' selected':''}>${m}</option>`).join('');
      row.innerHTML = `
        <div class="lr-head">
          <input type="checkbox" checked>
          <span>${layer.label}</span>
        </div>
        <select>${modeOpts}</select>
        <div class="lr-size"><span>size</span><input type="range" min="0.3" max="1.8" step="0.05" value="${layer.scale}"></div>
      `;
      row.querySelector('input[type=checkbox]').addEventListener('change', e=>{
        layer.setEnabled(e.target.checked);
      });
      row.querySelector('select').addEventListener('change', e=>{
        layer.blend = e.target.value;
        layer.canvas.style.mixBlendMode = e.target.value;
      });
      row.querySelector('input[type=range]').addEventListener('input', e=>{
        layer.scale = +e.target.value;
        layer.canvas.style.transform = `scale(${layer.scale})`;
      });
      wrap.appendChild(row);
    });
  }
  renderBlendPanel();

  document.getElementById('beatBtn').addEventListener('click', ()=>{
    autoBeatGlobal = !autoBeatGlobal;
    const btn = document.getElementById('beatBtn');
    btn.classList.toggle('on', autoBeatGlobal);
    btn.textContent = autoBeatGlobal ? '⚡ Auto: ON' : '⏸ Auto: OFF';
    layers.forEach(l => l.setAutoBeat(autoBeatGlobal));
  });
}
let autoBeatGlobal = true;

// Controls panel: switch-interval slider — how long each layer waits before
// forcing a change when the kick isn't firing one on its own. Hidden in
// driven mode; in blended mode it scales all 3 layers' intervals together
// (each keeps its own stagger multiplier so they don't lock-step).
const panel = document.getElementById('controlPanel');
panel.hidden = true;
panel.innerHTML = `<div class="ctl-row"><span class="ctl-label">switch every (max)</span>
  <input id="switchIntervalCtl" type="range" min="4" max="30" step="1" value="14"></div>`;
const ctlBtn = document.getElementById('ctlBtn');
ctlBtn.addEventListener('click', ()=>{ panel.hidden = !panel.hidden; ctlBtn.classList.toggle('on', !panel.hidden); });
document.getElementById('switchIntervalCtl').addEventListener('input', e=>{
  const v = +e.target.value;
  layers.forEach(l => l.setInterval(v));
});
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});

// ---- render loop (shared clock/audio driving every layer) ----
function loop(){
  const dt = clock.getDelta(), t = clock.getElapsedTime();
  sampleAudio();
  if (audio.hit) cameraBeatFlourish();
  stepCamera(dt, t);
  layers.forEach(l => l.step(dt, t));
  requestAnimationFrame(loop);
}
// Compile every active layer's shader with the "Preparing visuals… N%"
// overlay up before this starts — a silent spinner with no number is exactly
// what makes people give up on a slow load thinking it's dead. The % is a
// real signal (each layer resolving its own precompile is one genuine
// milestone out of however many layers exist) with a slow time-based floor
// underneath so it keeps visibly creeping between those milestones instead
// of sitting dead on one number for several seconds.
const prepText = document.getElementById('prepText');
const totalLayers = layers.length;
let doneLayers = 0;
let prepSettled = false;
const prepStartT = performance.now();
function renderPrepPct(){
  const elapsedFrac = Math.min(1, ((performance.now()-prepStartT)/1000) / (driven ? 3.5 : 9));
  const layerFrac = doneLayers / totalLayers;
  return Math.min(97, Math.round(Math.max(layerFrac, elapsedFrac*0.9) * 100));
}
function tickPrep(){
  if (prepSettled) return;
  prepText.textContent = `Preparing visuals… ${renderPrepPct()}%`;
  requestAnimationFrame(tickPrep);
}
const settlePrep = () => {
  if (prepSettled) return;
  prepSettled = true;
  prepText.textContent = 'Preparing visuals… 100%';
  document.getElementById('prep').classList.add('hidden');
};
const precompiles = layers.map(l => l.precompile().finally(() => { doneLayers++; }));
Promise.all(precompiles).finally(settlePrep);
setTimeout(settlePrep, driven ? 4000 : 9000);
tickPrep();
loop();

// ---- feed embed: ?song=<url>[&muted=1] + postMessage({type:'song'|'setActive'|'mute'}) ----
const songParam = new URLSearchParams(location.search).get('song');
const mutedParam = new URLSearchParams(location.search).get('muted') === '1';
const startTimeParam = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const activeParam = new URLSearchParams(location.search).get('active') !== '0';
if (songParam) loadSongUrl(decodeURIComponent(songParam), mutedParam, startTimeParam, activeParam);
// Inline Feed preview: the parent page draws its own single transport bar
// below the preview — this page's own bottom bar would be a second one.
if (new URLSearchParams(location.search).get('embed') === 'inline') {
  const bar = document.getElementById('bar'); if (bar) bar.style.display = 'none';
}
// Standalone open (no ?song=, not the feed embed, not driven) never had any
// way to actually pick a song — the whole page only ever expected one to
// arrive via the URL or postMessage from an embedding parent. This gives
// the raw link its own file picker so it's testable on its own, using a
// local object URL (no upload needed just to try it).
const loadSongWrap = document.getElementById('loadSongWrap');
if (!songParam && !driven) {
  document.getElementById('loadSongBtn').addEventListener('click', () => document.getElementById('loadSongFile').click());
  document.getElementById('loadSongFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    loadSongUrl(URL.createObjectURL(file), false, 0, true);
    loadSongWrap.style.display = 'none';
  });
} else if (loadSongWrap) {
  loadSongWrap.style.display = 'none';
}
// Fallback: a real tap/drag directly on this canvas (orbiting, switching modes)
// is a genuine gesture in THIS frame. AudioContext.resume() alone isn't
// enough — the <audio> element's own play() call is a SEPARATE autoplay gate
// and needs its own retry once we're inside a real gesture.
addEventListener('pointerdown', () => {
  actx?.resume().catch(()=>{});
  if (audioEl && !audioEl.muted) audioEl.play().catch(()=>{});
}, { once: true });

// ---- kiosk: hide nothing here by default (bar is already minimal), but
// keep the API surface consistent with destinys-child's embed pattern.
</script>
</body>
</html>
