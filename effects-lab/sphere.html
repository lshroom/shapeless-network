// Shared helper routines a few shapes above depend on — kept tiny, always
// included (they were present in the original confirmed-fast 8-shape build
// too, since deSdfMorph used sdfSmin from day one).
const HELPERS_SRC = `
float sdfSmin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float deTendril(vec3 p, vec3 c, vec3 dir, float r){
  vec3 q=p-c;
  float along=clamp(dot(q,dir),-0.7,0.7);
  return length(p-(c+dir*along))-r;
}
float sdBoxH(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
`;

// 8 shapes compiled together at a time — the config actually confirmed fast.
// Each bank still liquid-morphs freely within itself; switching banks (driven
// mode only, via ?bank=) pays one recompile, same cost as loading a different
// page, never something that happens mid-song. In blended mode all three
// banks are just always live as separate layers instead.
const BANKS = [
  { label: 'Classic', ids: [0,1,2,3,4,5,6,7] },
  { label: 'Organic', ids: [8,9,10,11,12,13,17,18] },
  { label: 'Flow & Field', ids: [14,15,16,19,20,3,7,12] },
];
function findBankAndLocal(globalId){
  for (let b=0;b<BANKS.length;b++){ const li=BANKS[b].ids.indexOf(globalId); if(li>=0) return {bank:b, local:li}; }
  return null;
}

function buildMorphFrag(ids){
  const shapesSrc = ids.map(id => SHAPE_FN[id].src).join('\n');
  const cases = ids.map((id,li) => `    case ${li}: return ${SHAPE_FN[id].fn}(p);`).join('\n');
  const lastFn = SHAPE_FN[ids[ids.length-1]].fn;
  return `
${GLSL.snoise3}
${GLSL.hash}
${GLSL.palette}
uniform int uCur, uNext;
uniform float uMorph;
uniform vec3 uJitter;
uniform mat3 uJitterRot;
uniform float uHueKick;
uniform float uPulse;
uniform float uKickDeform;
uniform int uMaxSteps, uNormalSamples;
uniform int uArrange;
uniform float uArrangeSeed;
uniform float uHueOffset;
${HELPERS_SRC}
${shapesSrc}
float deShape(int id, vec3 p){
  // switch/case instead of an if/else ladder — HLSL (what ANGLE translates
  // this to on Windows) commonly compiles switch as a jump table instead of
  // flattening every branch's code into one register-allocation pass the
  // way a long if/else chain does. GLSL ES 3.00 only (requires WebGL2).
  switch(id){
${cases}
    default: return ${lastFn}(p);
  }
}
// ---- ARRANGEMENT: a second axis of variety, independent of which shape is
// picked. Same engine, same shape SDFs — just a different domain trick
// applied before evaluating them, so any shape can become a flat field, a
// mandala, a repeating lattice, a melted cluster, a scattered handful, a
// twisted spiral, or a crystal-cut version of itself. Picked per layer, per
// song, by applyVisualSeed() below — this is the actual "no two songs look
// the same" engine.
vec3 arrangeFold(vec3 p, float seed){
  float n = 4.0 + floor(seed*6.0); // 4..9-fold mandala symmetry
  float ang = atan(p.z, p.x);
  float seg = 6.2831853 / n;
  ang = abs(mod(ang, seg) - seg*0.5);
  float r = length(p.xz);
  vec3 q = p;
  q.x = cos(ang)*r; q.z = sin(ang)*r;
  return q;
}
vec3 arrangeTile(vec3 p, float seed){
  float cell = 1.7 + seed*0.9;
  vec3 q = p;
  q.xz = mod(q.xz + 0.5*cell, cell) - 0.5*cell;
  return q;
}
vec3 arrangeTwist(vec3 p, float seed){
  float k = 0.55 + seed*0.85;
  float ang = p.y*k + uTime*0.15;
  float c=cos(ang), s=sin(ang);
  vec3 q = p; q.x = c*p.x - s*p.z; q.z = s*p.x + c*p.z;
  return q;
}
// Multi-instance arrangements (cluster=melted together, scatter=separate
// pieces) can't be a simple domain warp — they need several offset copies
// of the SAME shape evaluated and combined, capped at 3 to keep the
// raymarch affordable.
float deMulti(int id, vec3 p, float seed, bool melt){
  float best = 1e5;
  for (int k=0; k<3; k++){
    float fk = float(k);
    float ang = fk*2.0943951 + seed*6.2831853;
    float rad = 0.85 + seed*0.35;
    vec3 c = vec3(cos(ang)*rad, sin(ang*1.3)*rad*0.5, sin(ang)*rad);
    float d = deShape(id, (p-c)*1.6) / 1.6;
    best = melt ? sdfSmin(best, d, 0.55) : min(best, d);
  }
  return best;
}
// uArrange: 0 single (default), 1 flat field, 2 kaleidoscope, 3 fractal
// tile, 4 cluster (melted), 5 scatter (disconnected), 6 twist, 7 crystal cage.
float deArranged(int id, vec3 q){
  if (uArrange==4) return deMulti(id, q, uArrangeSeed, true);
  if (uArrange==5) return deMulti(id, q, uArrangeSeed, false);
  // Arrangement 1 ("flat field") used to squash EVERY shape's own domain
  // (q.y*3.0) to force it flat — but most shapes have their own internal
  // bound (a fixed radius, a lattice repeat, etc.), and squashing them
  // revealed THAT bound as a hard rectangular edge instead of anything
  // actually flat. Only the 3 shapes actually built as a heightfield
  // (deWaveField/deChladniField/deWebField, ids 5/6/7 — they check uArrange
  // themselves) are genuinely flat; every other shape just ignores this
  // arrangement and renders itself normally rather than getting force-warped
  // into a shape it was never built to be.
  if (uArrange==2) return deShape(id, arrangeFold(q, uArrangeSeed));
  if (uArrange==3) return deShape(id, arrangeTile(q, uArrangeSeed));
  if (uArrange==6) return deShape(id, arrangeTwist(q, uArrangeSeed));
  if (uArrange==7) { float d=deShape(id,q); float cage=(abs(q.x)+abs(q.y)+abs(q.z))-1.55; return max(d, cage); }
  return deShape(id, q);
}
float de(vec3 p){
  // uJitterRot adds a small bounded spring-back rotation on top of the
  // translation jitter — beat flourishes nudge it, it always springs back
  // toward identity, so the shape gets real "internal shift" without ever
  // ending up permanently misoriented. uPulse is a real geometry swell, not
  // a camera trick: evaluating the SDF in space scaled by (1+uPulse) and
  // scaling the returned distance back makes the shape itself visibly
  // grow/breathe on the beat.
  float pulseS = 1.0 + uPulse;
  vec3 q = (uJitterRot * (p - uJitter)) / pulseS;
  // Kick deform: a real distortion of the shape's OWN domain — a shockwave
  // ripple radiating outward — instead of a camera/screen trick. Driven
  // hardest on whichever layer is mapped to the drums stem (see
  // createLayer's step()), so the kick reads as this shape visibly rippling.
  if (uKickDeform > 0.001) {
    float r = length(q);
    q += normalize(q + 1e-4) * uKickDeform * sin(r*10.0 - uTime*26.0) * 0.28;
  }
  float dA=deArranged(uCur,q) * pulseS;
  if(uMorph<=0.001) return dA;
  float dB=deArranged(uNext,q) * pulseS;
  float t=smoothstep(0.0,1.0,uMorph);
  // A plain mix() of two distance FIELDS doesn't read as a dissolve — the two
  // shapes have very different distance magnitudes, so the surface tends to
  // pop to whichever field dominates instead of visibly blending. Pulling the
  // surface inward through the middle of the transition (peaking at t=0.5)
  // forces a soft, swollen, liquid bulge where the two shapes genuinely melt
  // into each other instead of one popping over the other.
  float liquid = 4.0*t*(1.0-t) * 0.55;
  return mix(dA,dB,t) - liquid;
}
vec3 shapeColor(int id){
  float hue;
  if(id==0) hue=0.08; else if(id==1) hue=0.55; else if(id==2) hue=0.75; else if(id==3) hue=0.33;
  else if(id==4) hue=0.9; else if(id==5) hue=0.58; else if(id==6) hue=0.82; else hue=0.62;
  return spectral(hue + uHueOffset + uTime*0.02 + uHueKick*0.2);
}
// Returns (color, hit) — hit=0 for a ray that never found a surface. Used so
// non-base layers can render with alpha=0 background instead of an opaque
// black square, which is what lets CSS mix-blend-mode (multiply especially)
// composite the actual shapes instead of just darkening everything to black.
vec4 renderRM(vec3 ro, vec3 rd){
  float t=0.0; vec3 col=vec3(0.0); float hit=0.0;
  for(int i=0;i<uMaxSteps;i++){
    vec3 p=ro+rd*t; float d=de(p);
    if(d<0.002){
      vec3 n=vec3(0.0);
      vec3 t0=vec3(1.0,1.0,1.0), t1=vec3(1.0,-1.0,-1.0), t2=vec3(-1.0,1.0,-1.0), t3=vec3(-1.0,-1.0,1.0);
      for(int gi=0;gi<uNormalSamples;gi++){
        vec3 e = (gi==0)?t0 : (gi==1)?t1 : (gi==2)?t2 : t3;
        n += e * de(p+e*0.002);
      }
      n=normalize(n);
      float diff=max(dot(n,normalize(vec3(0.6,0.8,0.5))),0.0);
      float fres=pow(1.0-max(dot(n,-rd),0.0),2.5);
      vec3 baseCol=mix(shapeColor(uCur),shapeColor(uNext),smoothstep(0.0,1.0,uMorph));
      float ao=1.0-float(i)/float(uMaxSteps);
      col=baseCol*(0.28+0.72*diff)*ao+fres*0.4*baseCol;
      hit=1.0;
      break;
    }
    t+=d; if(t>16.0)break;
  }
  return vec4(col,hit);
}`;
}

// Built directly here (not via core.js's shared raymarchQuad) so this page
// alone can use GLSL ES 3.00 — needed for a real switch(id) statement in
// deShape(), which GLSL ES 1.00/WebGL1 doesn't support at all. Other pages
// still use core.js's WebGL1-style helper unchanged.
function makeUniforms(){
  return Object.assign(audioUniforms(), {
    uRes: { value: new THREE.Vector2(1, 1) },
    uCamPos: { value: new THREE.Vector3() },
    uCamMat: { value: new THREE.Matrix4() },
    uCur:{value:0}, uNext:{value:0}, uMorph:{value:0},
    uJitter:{value:new THREE.Vector3()}, uJitterRot:{value:new THREE.Matrix3()},
    uHueKick:{value:0}, uPulse:{value:0}, uKickDeform:{value:0},
    uArrange:{value:0}, uArrangeSeed:{value:0}, uHueOffset:{value:0},
    uMaxSteps:{value:64}, uNormalSamples:{value:4},
  });
}
function buildMaterial(bankIdx){
  const bank = BANKS[bankIdx];
  const u = makeUniforms();
  const m = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    transparent: true,
    uniforms: u,
    vertexShader: `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `
      precision highp float;
      in vec2 vUv;
      out vec4 fragColor;
      uniform vec2 uRes; uniform vec3 uCamPos; uniform mat4 uCamMat;
      uniform float uTime,uBass,uMid,uHigh,uRms,uBeat;
      ${buildMorphFrag(bank.ids)}
      void main(){
        vec2 p=(vUv*2.0-1.0); p.x*=uRes.x/uRes.y;
        vec3 rd=normalize((uCamMat*vec4(p,-1.5,0.0)).xyz);
        vec3 ro=uCamPos;
        vec4 rc=renderRM(ro,rd);
        vec3 col=pow(clamp(rc.rgb,0.0,1.0),vec3(0.4545));
        fragColor=vec4(col,rc.a);
      }`,
    depthWrite: false,
    depthTest: false,
  });
  return { material: m, uniforms: u };
}

// ================= LAYER FACTORY =================
// One independent renderer/scene/camera/mesh/controls per layer, each
// compiling only its own 8-shape bank (the compile-time-safe config). A
// layer owns its own shape-switching, jitter, rotation-wobble and pulse
// state so the 3 layers in blended mode drift out of phase with each other
// instead of all doing the same thing in lockstep — driven mode just never
// creates more than one of these.
// `camera` is now ALWAYS the one shared module-level camera (see "SHARED
// CAMERA" below) — every layer renders through the exact same camera object,
// so a drag/orbit gesture (driven by the one OrbitControls bound to it) moves
// every layer in lockstep instead of only whichever canvas happens to be on
// top of the pointer-event stack. Each layer keeps its own independent
// jitter/rotation-wobble/pulse/hue flourishes (those are shader uniforms, not
// camera state) so they still don't all look identical.
function createLayer({ canvas, bankIdx, alpha, onLabel, intervalMult=1, camera, reaction={}, arrange={} }){
  // Each layer gets its own reaction "personality" and its own audio band —
  // before real stem separation exists, this is the stand-in for "the 3
  // layers shouldn't all just flinch at the same kick": one grows on the
  // bass, one breathes with the mids (harmony), one shrinks on the highs.
  const reactType = reaction.type || 'jump';
  const reactBand = reaction.band || 'bass';
  const reactPhase = reaction.phase || 0;
  function bandVal(){ return audio[reactBand] ?? audio.bass; }
  // Each layer flourishes off ITS OWN stem-proxy's onset, not the global drum
  // hit — otherwise all 3 "react differently" only in magnitude, still all
  // flinching in lockstep on every drum hit. The drums layer still gets the
  // most frequent, sharpest hits (that's what a drum track IS); bass/vocals
  // fire on their own, rarer transients.
  function bandHit(){
    if (reactBand === 'drums') return audio.hit;
    if (reactBand === 'bass') return audio.bassHit;
    if (reactBand === 'vocals') return audio.vocalHit;
    if (reactBand === 'harmony') return audio.harmonyHit;
    return audio.hit;
  }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
  renderer.setClearColor(0x05060a, alpha ? 0 : 1);
  const scene = new THREE.Scene();

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // UnrealBloomPass composites its glow with an internal pass that forces the
  // output alpha to 1 everywhere — fine for the single opaque driven-mode
  // layer, but on a transparent (alpha:true) blended-mode layer it turns
  // every "no hit" pixel into an opaque black square, blotting out whatever
  // is stacked underneath (the background layer, and any layer beneath it).
  // So only opaque layers get bloom; transparent ones skip straight to output.
  let bloom = null;
  if (!alpha) {
    bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.7, 0.85);
    composer.addPass(bloom);
  }
  composer.addPass(new OutputPass());
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h); composer.setSize(w, h);
    bloom?.resolution.set(w, h);
  }
  addEventListener('resize', resize); resize();

  let bank = bankIdx;
  let mat, uniforms;
  { const built = buildMaterial(bank); mat = built.material; uniforms = built.uniforms; }
  uniforms.uArrange.value = arrange.mode || 0;
  uniforms.uArrangeSeed.value = arrange.seed ?? Math.random();
  uniforms.uHueOffset.value = arrange.hue ?? 0;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -1;
  scene.add(mesh);

  const jitterVel = new THREE.Vector3(), jitterPos = new THREE.Vector3();
  const rotVel = new THREE.Vector3(), rotOffset = new THREE.Vector3();
  let pulseVel = 0, pulseVal = 0;
  let active = 0, morphTarget = 0, morphing = false, morphStartT = 0;
  let lastSwitch = Math.random() * 3; // staggered starts so layers don't all switch on the same beat
  let switchIntervalSec = 14 * intervalMult;
  let autoBeat = true, enabled = true;
  const MORPH_SECONDS = 1.6;

  function label(i){ if (onLabel) onLabel(SHAPE_NAMES[BANKS[bank].ids[i]]); }
  function setShapeInstant(i){
    active = i; morphTarget = i; morphing = false;
    uniforms.uCur.value = i; uniforms.uNext.value = i; uniforms.uMorph.value = 0;
    label(i);
  }
  function startMorphTo(i, tNow){
    if (i === active && !morphing) return;
    uniforms.uCur.value = active; uniforms.uNext.value = i;
    morphTarget = i; morphing = true; morphStartT = tNow;
    label(i);
  }
  function onBeatMove(){
    // Pulse (the shape itself swelling/breathing) fires on EVERY beat — it's
    // the one flourish that's actually geometry, not camera. The rest are
    // occasional variety on top of that, picked randomly each hit. Camera
    // flourishes (orbit spin flip, FOV punch) now live at module level since
    // the camera is shared across every layer.
    const bv = bandVal();
    if (reactType === 'grow') pulseVel += 2.2 + bv * 2.4;
    else if (reactType === 'shrink') pulseVel -= 1.8 + bv * 2.0;
    else if (reactType === 'breathe') pulseVel += 0.7 + bv * 1.2;
    else pulseVel += 2.6 + bv * 2.2; // jump
    const roll = Math.random();
    if (roll < 0.38) {
      rotVel.set((Math.random()-0.5)*3.2, (Math.random()-0.5)*3.2, (Math.random()-0.5)*3.2);
    } else if (roll < 0.72) {
      jitterVel.set((Math.random()-0.5)*1.1, (Math.random()-0.5)*0.95, (Math.random()-0.5)*0.7);
    } else {
      uniforms.uHueKick.value = 1;
    }
  }

  function step(dt, t){
    if (!enabled) return;
    if (autoBeat) {
      const effInterval = switchIntervalSec * (0.55 + Math.min(1, audio.rms * 3));
      if (!morphing && (t - lastSwitch) > 1.8 && (audio.kick > 0.6 || (t - lastSwitch) > effInterval)) {
        lastSwitch = t;
        startMorphTo((active + 1) % BANKS[bank].ids.length, t);
      }
    }
    if (bandHit()) onBeatMove();
    if (morphing) {
      const p = Math.min(1, (t - morphStartT) / MORPH_SECONDS);
      uniforms.uMorph.value = p;
      if (p >= 1) { active = morphTarget; uniforms.uCur.value = active; uniforms.uMorph.value = 0; morphing = false; }
    }
    if (audio.kick > 0.6) {
      jitterVel.set((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.35);
    }
    jitterVel.multiplyScalar(Math.pow(0.85, dt*60));
    jitterPos.addScaledVector(jitterVel, dt);
    jitterPos.x += Math.sin(t*0.9)*0.014*(0.3+audio.mid*1.8);
    jitterPos.y += Math.cos(t*0.7)*0.014*(0.3+audio.rms+audio.high*1.2);
    jitterPos.multiplyScalar(Math.pow(0.9, dt*60));
    uniforms.uJitter.value.copy(jitterPos);
    // Decay rates below are per REAL SECOND (Math.pow(k, dt), not dt*60) so
    // these flourishes read clearly for a beat or more instead of vanishing
    // within a single frame.
    rotVel.multiplyScalar(Math.pow(0.2, dt));
    rotOffset.addScaledVector(rotVel, dt);
    rotOffset.multiplyScalar(Math.pow(0.25, dt));
    uniforms.uJitterRot.value.setFromMatrix4(new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rotOffset.x, rotOffset.y, rotOffset.z)));
    uniforms.uHueKick.value *= Math.pow(0.2, dt);
    // Decay/clamp differ by personality: "grow" holds its swell longer and
    // clamps mostly positive, "shrink" recovers from a mostly-negative dip,
    // "breathe" barely uses the beat-kick at all — its motion is the big,
    // slow, harmony-driven idle sine below — and "jump" snaps fast both ways.
    const bv2 = bandVal();
    let pulseVelDecay = 0.25, pulseValDecay = 0.35, lo = -0.35, hi = 0.9, breatheAmp = 0.03, breatheFreq = 0.55;
    if (reactType === 'grow') { pulseVelDecay = 0.5; pulseValDecay = 0.6; lo = -0.2; hi = 1.5; breatheAmp = 0.05; breatheFreq = 0.4; }
    else if (reactType === 'shrink') { pulseVelDecay = 0.35; pulseValDecay = 0.42; lo = -0.85; hi = 0.55; breatheAmp = 0.045; breatheFreq = 0.7; }
    else if (reactType === 'breathe') { pulseVelDecay = 0.65; pulseValDecay = 0.72; lo = -0.55; hi = 1.0; breatheAmp = 0.16; breatheFreq = 0.85; }
    pulseVel *= Math.pow(pulseVelDecay, dt);
    pulseVal += pulseVel * dt;
    pulseVal *= Math.pow(pulseValDecay, dt);
    const idleBreath = Math.sin(t*breatheFreq + reactPhase)*breatheAmp*(1 + bv2*1.6) + Math.sin(t*breatheFreq*2.3 + reactPhase*1.7)*breatheAmp*0.5;
    uniforms.uPulse.value = Math.max(lo, Math.min(hi, pulseVal + idleBreath));
    // The drums layer gets the full ripple deform — that's the one actually
    // meant to visibly react to the kick; the other layers get a much
    // smaller echo of it off their own band so the kick isn't totally silent
    // there, without stealing the drums layer's job.
    uniforms.uKickDeform.value = reactBand === 'drums' ? audio.drums : bandVal() * 0.18;
    // camera is the shared one — its own orbit/fov update happens once at
    // module level, not per layer; this just reads its current pose.
    pushAudio(uniforms, audio, t);
    uniforms.uRes.value.set(innerWidth, innerHeight);
    uniforms.uCamPos.value.copy(camera.position);
    uniforms.uCamMat.value.copy(camera.matrixWorld);
    composer.render();
  }

  function precompile(){
    return (renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera)))
      .catch(e => console.error('layer precompile failed:', e));
  }

  return {
    canvas,
    get bank(){ return bank; },
    setShapeInstant, startMorphTo, step, precompile,
    setAutoBeat(v){ autoBeat = v; },
    setEnabled(v){ enabled = v; canvas.style.display = v ? 'block' : 'none'; },
    setInterval(base){ switchIntervalSec = base * intervalMult; },
    // Re-rolls this layer's arrangement/hue for a newly-loaded song — the
    // per-song "visual DNA" seed (see applyVisualSeed) calls this on every
    // shape layer so a different song genuinely looks different, not just
    // differently-timed.
    setArrange(mode, seed, hue){
      uniforms.uArrange.value = mode;
      uniforms.uArrangeSeed.value = seed;
      if (hue !== undefined) uniforms.uHueOffset.value = hue;
    },
    // Lets the Layers panel show/edit the current pick without the UI having
    // to track its own separate copy of the arrangement state.
    getArrange(){
      return { mode: uniforms.uArrange.value, seed: uniforms.uArrangeSeed.value, hue: uniforms.uHueOffset.value };
    },
    // A synchronized, waveform-triggered switch (see SHARED CAMERA/switch
    // points below) — always lands on a genuinely different shape, same as
    // the layer's own auto-switching, just called from outside on demand.
    bigSwitch(tNow){
      const n = BANKS[bank].ids.length;
      startMorphTo((active + 1 + Math.floor(Math.random() * (n - 1))) % n, tNow);
    },
  };
}

// ================= BACKGROUND LAYER =================
// A 4th, much cheaper layer that sits behind the three raymarched banks: a
// slow-drifting noise/color field, not a raymarched shape, so it costs
// almost nothing to compile or render — one noise lookup per pixel, no
// raymarch loop at all. Gives the composite a constantly-shifting base even
// under whichever shape layers are switched off, and reacts to the same
// shared audio signal (hue drifts with the mids, a small beat-synced glow).
function createBackgroundLayer({ canvas }){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
  renderer.setClearColor(0x05060a, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  function resize(){ renderer.setSize(innerWidth, innerHeight); }
  addEventListener('resize', resize); resize();

  const uniforms = Object.assign(audioUniforms(), {
    uRes: { value: new THREE.Vector2(1, 1) },
    uDrift: { value: new THREE.Vector2(0, 0) },
    uStyle: { value: 0 },
    uMorph: { value: 0 }, // crossfade 0..1 between uStyle and uStyle2 during a style switch
    uStyle2: { value: 0 },
    uGlitch: { value: 0 }, // the background is the harmony layer — this is its harmony-driven glitch
    uGlitchType: { value: 0 },
    uHarmony: { value: 0 },
  });
  const BG_STYLE_NAMES = ['Plasma drift', 'Flowing waves', 'Pulse rings', 'Starfield', 'Mirror tunnel', 'Tie dye'];
  const mat = new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3,
    uniforms,
    vertexShader: `out vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `
      precision highp float;
      in vec2 vUv;
      out vec4 fragColor;
      uniform vec2 uRes, uDrift;
      uniform float uTime,uBass,uMid,uHigh,uRms,uBeat;
      uniform int uStyle, uStyle2, uGlitchType;
      uniform float uMorph, uGlitch, uHarmony;
      ${GLSL.snoise3}
      ${GLSL.palette}
      vec3 styleColor(int style, vec2 uv, vec2 q){
        if (style == 0) {
          // Plasma drift — soft rolling noise field. Dimmer/less saturated
          // than before — the colorful styles are meant to read as brief
          // accents against the mostly-dark starfield, not an equal partner.
          float n1 = snoise(vec3(q*0.6, uTime*0.035));
          float n2 = snoise(vec3(q*1.4+11.0, uTime*0.06+5.0));
          float field = n1*0.65 + n2*0.35;
          float hue = fract(field*0.5 + uTime*0.01 + uMid*0.08);
          return spectral(hue) * (0.2 + 0.17*(0.5+0.5*field) + uBeat*0.16 + uBass*0.1);
        } else if (style == 1) {
          // Flowing waves — horizontal bands undulating and scrolling.
          float w1 = sin(uv.x*2.2 + q.y*1.6 + uTime*0.5 + uMid*2.0);
          float w2 = sin(uv.x*3.7 - q.y*2.1 - uTime*0.32 + uHigh*1.5);
          float field = w1*0.6 + w2*0.4;
          float hue = fract(uv.x*0.15 + uTime*0.03 + field*0.12 + uMid*0.1);
          return spectral(hue) * (0.18 + 0.18*(0.5+0.5*field) + uBeat*0.18 + uBass*0.09);
        } else if (style == 2) {
          // Pulsing rings — concentric rings expanding from center, snapping on the beat.
          float r = length(uv);
          float ring = sin(r*9.0 - uTime*1.1 - uBeat*3.0);
          float pulse = smoothstep(0.0, 1.0, 0.5+0.5*ring);
          float hue = fract(r*0.3 - uTime*0.025 + uMid*0.15);
          return spectral(hue) * (0.17 + 0.22*pulse + uBeat*0.2 + uBass*0.11);
        } else if (style == 3) {
          // Starfield — sparse twinkling points drifting past, denser/brighter on highs.
          vec2 gv = q*6.0;
          vec2 cell = floor(gv), f = fract(gv)-0.5;
          float star = 0.0;
          for (int oy=-1; oy<=1; oy++) for (int ox=-1; ox<=1; ox++) {
            vec2 c = cell + vec2(float(ox), float(oy));
            float rnd = fract(sin(dot(c, vec2(127.1,311.7)))*43758.5453);
            if (rnd > 0.86) {
              vec2 off = vec2(fract(rnd*13.0), fract(rnd*29.0)) - 0.5;
              float d = length(f - vec2(float(ox), float(oy)) - off);
              float tw = 0.5 + 0.5*sin(uTime*(2.0+rnd*4.0) + rnd*20.0);
              star += smoothstep(0.09, 0.0, d) * (0.4 + 0.6*tw);
            }
          }
          float hue = fract(uTime*0.02 + uHigh*0.2);
          vec3 base = vec3(0.02, 0.025, 0.05) * (0.6 + 0.4*sin(uTime*0.1));
          return base + spectral(hue) * star * (0.7 + uHigh*0.6 + uBeat*0.3);
        } else if (style == 4) {
          // Mirror tunnel — the "VJ mirror" effect: the screen folded into
          // mirrored wedges (same angular-fold trick as the arrangement
          // system's kaleidoscope shape mode, applied here to the whole
          // frame) with rings racing inward to read as travel through a
          // tunnel, snapping faster on the bass.
          float ang = atan(q.y, q.x);
          float seg = 6.2831853 / 8.0;
          float fa = abs(mod(ang, seg) - seg*0.5);
          float r = length(q) + 0.001;
          float tunnel = fract(1.0/r*0.6 - uTime*0.5 - uBass*0.5);
          float rings = smoothstep(0.0,0.09,tunnel) * smoothstep(0.24,0.09,tunnel);
          float spoke = smoothstep(0.5, 0.44, fa);
          float hue = fract(fa*1.3 + uTime*0.05 + uMid*0.2);
          vec3 base = vec3(0.015, 0.02, 0.04);
          return base + spectral(hue) * (rings*0.55 + spoke*0.1) * (0.6 + uHigh*0.7 + uBeat*0.4);
        } else {
          // Tie dye — a spiral domain twist (radius-dependent rotation, so
          // straight noise blobs come out swirled) feeding blobby noise,
          // banded into a handful of saturated color patches with soft,
          // organic edges instead of a smooth continuous gradient — reads as
          // a classic tie-dye print, slowly rotating and pulsing on the beat.
          float r = length(q);
          float swirlAng = atan(q.y, q.x) + r*2.4 + uTime*0.12;
          vec2 sq = vec2(cos(swirlAng), sin(swirlAng)) * r;
          float n1 = snoise(vec3(sq*1.2, uTime*0.04));
          float n2 = snoise(vec3(sq*2.5+9.0, uTime*0.07+4.0));
          float blob = n1*0.7 + n2*0.3;
          // Quantize into bands so color regions read as distinct patches
          // (the actual "dye" look) rather than a smooth blend.
          float bands = 5.0;
          float banded = floor(blob*bands) / bands;
          float edgeSoft = smoothstep(0.0, 0.05, abs(fract(blob*bands)-0.5)-0.02);
          float hue = fract(banded*0.85 + uTime*0.015 + uMid*0.12);
          vec3 col = spectral(hue) * (0.32 + 0.22*(0.5+0.5*blob) + uBeat*0.22 + uBass*0.13);
          return col * mix(0.82, 1.0, edgeSoft);
        }
      }
      void main(){
        vec2 uv=(vUv*2.0-1.0); uv.x*=uRes.x/uRes.y;
        // Background IS the harmony stem's own layer — a harmony onset (chord
        // change / texture shift, approximated since we can't run real pitch
        // tracking in-browser) triggers one of several distinct glitch types
        // instead of a geometry flourish, which is what the raymarched layers
        // get instead. uGlitchType picks which one so it doesn't look like
        // the same effect looping all song.
        vec2 guv = uv;
        bool glitching = uGlitch > 0.002;
        // Type 0: vertical tearing (columns shear up/down, tracking-error style).
        if (glitching && uGlitchType == 0) {
          float slice = floor(vUv.x*24.0);
          float sliceRnd = fract(sin(slice*57.31 + floor(uTime*9.0))*24634.6345);
          guv.y += (sliceRnd - 0.5) * uGlitch * 0.5;
        }
        vec2 q = guv*1.2 + uDrift;
        vec3 colA = styleColor(uStyle, guv, q);
        vec3 col = colA;
        if (uMorph > 0.001) {
          vec3 colB = styleColor(uStyle2, guv, q);
          col = mix(colA, colB, uMorph);
        }
        // Type 1: chromatic aberration — a fuller 3-tap radial color split
        // with a faint soft-glow halo, not just a 2-channel nudge.
        if (glitching && uGlitchType == 1) {
          vec2 dir = normalize(uv + 0.0001) * uGlitch * 0.07;
          vec3 cR = styleColor(uStyle, guv, q+dir);
          vec3 cG = colA;
          vec3 cB = styleColor(uStyle, guv, q-dir);
          col = vec3(cR.r, cG.g, cB.b);
          col += (cR+cB)*0.5 * uGlitch * 0.18; // soft glow halo from the split channels
        }
        // Type 2: block-hold datamosh — random blocks freeze on a stale color.
        if (glitching && uGlitchType == 2) {
          vec2 bg = floor(vUv*vec2(9.0,14.0));
          float bRnd = fract(sin(dot(bg, vec2(41.3,71.9)) + floor(uTime*3.0))*9821.233);
          if (bRnd > 1.0 - uGlitch*0.5) {
            vec3 stale = styleColor(uStyle, guv, floor(q*4.0)/4.0);
            col = mix(col, stale, uGlitch);
          }
        }
        // Type 3: invert-flash flicker — brief pixel-inverted strobe blocks.
        if (glitching && uGlitchType == 3) {
          float fRnd = fract(sin(floor(uTime*24.0)*12.73 + vUv.y*3.0)*5871.13);
          if (fRnd > 1.0 - uGlitch*0.4) col = mix(col, vec3(1.0)-col, uGlitch);
        }
        // Type 4: VHS — noisy horizontal scanline bands with per-line jitter,
        // faint rolling hum-bar, static grain and a slight color-bleed ghost.
        if (glitching && uGlitchType == 4) {
          float line = floor(vUv.y*160.0);
          float lineRnd = fract(sin(line*13.71 + floor(uTime*30.0))*7521.29);
          vec2 vguv = guv;
          if (lineRnd > 0.92) vguv.x += (lineRnd-0.92)*uGlitch*1.8; // a few lines jitter sideways hard
          vec2 vq = vguv*1.2 + uDrift;
          vec3 vcol = styleColor(uStyle, vguv, vq);
          vec3 ghost = styleColor(uStyle, vguv, vq + vec2(uGlitch*0.02, 0.0));
          vcol = mix(vcol, ghost, 0.4*uGlitch);
          float grain = fract(sin(dot(vUv*uRes, vec2(12.9898,78.233)) + uTime*60.0)*43758.5453);
          vcol += (grain-0.5) * uGlitch * 0.12;
          float hum = 0.5+0.5*sin(vUv.y*6.0 - uTime*0.6);
          vcol *= 1.0 - uGlitch*0.15*hum;
          col = vcol;
        }
        fragColor = vec4(col, 1.0);
      }`,
    depthWrite:false, depthTest:false,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  scene.add(mesh);

  let enabled = true;
  let style = 3, morphTarget = -1, morphT = 0; // start on Starfield — the dark one
  uniforms.uStyle.value = 3;
  const MORPH_DUR = 1.4;
  function setStyle(idx, instant){
    idx = ((idx % BG_STYLE_NAMES.length) + BG_STYLE_NAMES.length) % BG_STYLE_NAMES.length;
    if (instant) { style = idx; uniforms.uStyle.value = idx; uniforms.uMorph.value = 0; morphTarget = -1; return; }
    if (idx === style) return;
    morphTarget = idx; morphT = 0;
    uniforms.uStyle.value = style; uniforms.uStyle2.value = idx;
  }
  let styleTimer = 8 + Math.random() * 6;
  let glitchAmt = 0, glitchDecay = 0.12;
  // Starfield (idx 3) reads as the "dark, interesting" one — weighted heavily
  // in its favor, with the other 5 styles as brief accents rather than
  // equal-share rotation, and it sticks around longer once picked.
  const STYLE_WEIGHTS = [0.12, 0.12, 0.12, 0.42, 0.11, 0.11];
  function pickNextStyle(){
    let idx;
    do {
      const r = Math.random();
      let acc = 0; idx = STYLE_WEIGHTS.length - 1;
      for (let i = 0; i < STYLE_WEIGHTS.length; i++) { acc += STYLE_WEIGHTS[i]; if (r < acc) { idx = i; break; } }
    } while (idx === style);
    return idx;
  }
  function triggerGlitch(){
    glitchAmt = 0.7 + Math.random() * 0.5;
    glitchDecay = 0.05 + Math.random() * 0.35; // lower = snappier, higher = lingers
    uniforms.uGlitchType.value = Math.floor(Math.random() * 5);
  }
  const drift = new THREE.Vector2(0, 0);
  function step(dt, t){
    if (!enabled) return;
    // Background now auto-cycles through its 4 styles on its own clock (plus
    // a harmony-onset-triggered chance, since this layer IS the harmony
    // stem), same as the shape layers auto-switch shapes — it used to just
    // sit on one drifting noise field forever, which read as "not really
    // changing" next to the other 3 layers' constant switching.
    styleTimer -= dt;
    if (morphTarget < 0 && (styleTimer <= 0 || (audio.harmonyHit && Math.random() < 0.2))) {
      const next = pickNextStyle();
      setStyle(next);
      styleTimer = next === 3 ? (16 + Math.random() * 12) : (5 + Math.random() * 4);
    }
    // A glitch is a rare, distinct accent (not ambient texture) — each burst
    // picks a random type and its own intensity/decay so no two bursts in a
    // 4-minute song look or feel the same. The ambient harmony onset (above)
    // is one trigger; bigSwitch() (real waveform-detected song events) is
    // the other, via triggerGlitch() below.
    if (audio.harmonyHit) triggerGlitch();
    glitchAmt *= Math.pow(glitchDecay, dt);
    uniforms.uGlitch.value = glitchAmt;
    uniforms.uHarmony.value = audio.harmony;
    if (morphTarget >= 0) {
      morphT += dt / MORPH_DUR;
      if (morphT >= 1) { style = morphTarget; morphTarget = -1; uniforms.uStyle.value = style; uniforms.uMorph.value = 0; }
      else uniforms.uMorph.value = morphT;
    }
    // Slow constant drift plus a little extra push tied to the mids/rms, so
    // the background is always slowly shifting even through a quiet stretch
    // with no shape switch happening at all.
    drift.x += dt * (0.015 + audio.mid * 0.01);
    drift.y += dt * (0.008 + audio.rms * 0.01);
    uniforms.uDrift.value.copy(drift);
    uniforms.uRes.value.set(innerWidth, innerHeight);
    pushAudio(uniforms, audio, t);
    renderer.render(scene, camera);
  }
  function precompile(){
    return (renderer.compileAsync ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera)))
      .catch(e => console.error('background layer precompile failed:', e));
  }
  return {
    canvas, label: 'Background', blend: 'normal', scale: 1.0,
    isBackground: true, styleNames: BG_STYLE_NAMES,
    get styleIdx(){ return style; },
    setStyle, triggerGlitch,
    step, precompile,
    setEnabled(v){ enabled = v; canvas.style.display = v ? 'block' : 'none'; },
    setAutoBeat(){}, setInterval(){}, // no-ops — kept so shared loop/UI code can treat every layer the same way
  };
}

// ================= SHARED CAMERA =================
// One camera + one OrbitControls for the whole page (not per layer) — every
// layer's RenderPass/precompile renders through this exact object, so a drag
// gesture moves every layer together instead of just whichever canvas
// happens to be topmost in the CSS stacking order.
const BASE_FOV = 55;
const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 6);
const controls = new OrbitControls(camera, document.getElementById('layers'));
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 14;
let spinDir = 1, fovPunch = 0;
let userDragging = false, lastUserInteractT = 0;
controls.addEventListener('start', () => { userDragging = true; controls.autoRotate = false; });
controls.addEventListener('end', () => { userDragging = false; lastUserInteractT = clock.getElapsedTime(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
function stepCamera(dt, t) {
  if (!userDragging && !controls.autoRotate && (t - lastUserInteractT) > 3.5) controls.autoRotate = true;
  const baseRotSpeed = (0.4 + audio.bass * 1.1) * spinDir;
  controls.autoRotateSpeed += (baseRotSpeed - controls.autoRotateSpeed) * Math.min(1, dt * 1.5);
  fovPunch *= Math.pow(0.15, dt);
  camera.fov = BASE_FOV + audio.beatEnv * 3.5 + fovPunch;
  camera.updateProjectionMatrix();
  controls.update(dt);
}
function cameraBeatFlourish() {
  if (Math.random() < 0.5) spinDir *= -1;
  else fovPunch += 6 + audio.bass * 4;
}

let onFrameExtra = null; // blended mode hooks its switch-point check here (declared before MODE SELECT so its assignment there sticks)

// ================= MODE SELECT =================
const layersEl = document.getElementById('layers');
const urlParams = new URLSearchParams(location.search);
const driven = urlParams.get('driven') === '1';
// A public viewer (the feed's inline preview, or the fullscreen post
// player) never gets the layer-mixing panel or bottom bar — those are the
// uploader's own editing tools, from "Design the visuals" only. Without
// this, blended mode's controls panel showed up on every viewer's screen,
// including the tiny inline post preview.
const isPublicViewer = urlParams.get('embed') === 'inline' || urlParams.get('viewer') === '1';
let layers = [];

if (driven) {
  // ---- exact previous single-bank behavior — the feed/post player and
  // schedule editor iframe always land here, untouched by blended mode. ----
  const canvas = document.createElement('canvas');
  canvas.className = 'layerCanvas'; canvas.style.zIndex = '1';
  layersEl.appendChild(canvas);
  let bankIdx = 0;
  { const bp = parseInt(new URLSearchParams(location.search).get('bank'), 10); if (Number.isInteger(bp) && bp >= 0 && bp < BANKS.length) bankIdx = bp; }
  const modeNameEl = document.getElementById('modeName');
  const layer = createLayer({ canvas, bankIdx, alpha:false, onLabel:(name)=>{ modeNameEl.textContent = name; }, camera });
  layer.setAutoBeat(false); // uploader/editor drives shape choice externally
  layers = [layer];
  document.getElementById('bar').style.display = 'none';
  document.getElementById('blendPanel').style.display = 'none';
  modeNameEl.textContent = SHAPE_NAMES[BANKS[bankIdx].ids[0]];

  // shape= (global id 0-20) resolves to the loaded bank's local index — never
  // switched mid-song, since a bank swap pays a real recompile and could
  // reintroduce the freeze this whole system exists to avoid. Out-of-bank
  // ids are ignored with a console warning instead of forcing a recompile.
  const shapeParam = parseInt(new URLSearchParams(location.search).get('shape'), 10);
  if (Number.isInteger(shapeParam)) {
    const loc = findBankAndLocal(shapeParam);
    if (loc && loc.bank === bankIdx) layer.setShapeInstant(loc.local);
    else if (loc) console.warn(`sphere: ?shape=${shapeParam} is in bank ${loc.bank} ("${BANKS[loc.bank].label}") but bank ${bankIdx} is loaded — pass &bank=${loc.bank} instead. Ignoring.`);
  }

  addEventListener('message', e=>{
    if (e.data?.type === 'song') loadSongUrl(e.data.url || null, e.data.muted);
    if (e.data?.type === 'setShape' && Number.isInteger(e.data.index)) {
      const loc = findBankAndLocal(e.data.index);
      if (!loc) return;
      if (loc.bank !== bankIdx) {
        console.warn(`sphere: setShape index=${e.data.index} needs bank ${loc.bank} but bank ${bankIdx} is loaded — load with &bank=${loc.bank}. Ignoring.`);
        return;
      }
      if (e.data.instant) layer.setShapeInstant(loc.local);
      else layer.startMorphTo(loc.local, clock.getElapsedTime());
    }
    if (e.data?.type === 'setActive') {
      if (e.data.active) {
        if (audioEl && isFinite(e.data.time) && Math.abs(audioEl.currentTime - e.data.time) > 0.4) audioEl.currentTime = e.data.time;
        actx?.resume().catch(()=>{}); audioEl?.play().catch(()=>{});
      }
      else audioEl?.pause();
    }
    if (e.data?.type === 'mute' && audioEl) {
      audioEl.muted = !!e.data.muted;
      if (!e.data.muted) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
    if (e.data?.type === 'play' && audioEl) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    if (e.data?.type === 'pause' && audioEl) audioEl.pause();
    if (e.data?.type === 'seek' && audioEl && isFinite(e.data.time)) audioEl.currentTime = e.data.time;
    if (e.data?.type === 'volume' && audioEl) {
      audioEl.volume = e.data.value; audioEl.muted = e.data.value <= 0;
      if (e.data.value > 0) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
  });
} else {
  // ---- blended: all three 8-shape banks render simultaneously as separate
  // layers, composited with CSS mix-blend-mode + a per-layer size scale —
  // each layer still only ever compiles its own 8 shapes (the confirmed-fast
  // config), so this gets the "all 21 shapes worth of variety, always moving"
  // request without recompiling more shapes into any single shader. ----
  document.getElementById('modeName').style.display = 'none';
  // Background first (z:0, opaque) so the 3 shape layers above it can all be
  // transparent outside their actual shape — otherwise an opaque black quad
  // would just cover the background wherever a shape isn't.
  const bgCanvas = document.createElement('canvas');
  bgCanvas.className = 'layerCanvas'; bgCanvas.style.zIndex = '0'; bgCanvas.style.mixBlendMode = 'normal';
  layersEl.appendChild(bgCanvas);
  const bgLayer = createBackgroundLayer({ canvas: bgCanvas });

  // Each layer's `reaction` is a stand-in for stem-separated audio: with only
  // the mixed signal to work with, giving each layer its own band (bass/mid/
  // high) and its own motion personality (grow/breathe/shrink) is what makes
  // them read as 3 different things reacting, instead of 3 copies of the same
  // shape flinching at the same kick. Real stems can replace `band` later
  // without touching anything else.
  // Classic=bass, Organic=drums, Flow&Field=vocals, background=harmony (see
  // below) — the same drums/bass/vocals/harmony split the Demucs-based local
  // stem tool uses, approximated here with frequency bands + broadband flux
  // since real separation can't run in a visitor's browser (see `audio`'s
  // definition up top).
  const LAYER_DEFS = [
    { bank:0, blend:'normal',     scale:1.0,  z:1, mult:0.85, reaction:{ type:'grow',    band:'bass',   phase:0 } },
    { bank:1, blend:'screen',     scale:0.8,  z:2, mult:1.0,  reaction:{ type:'jump',    band:'drums',  phase:2.1 } },
    { bank:2, blend:'difference', scale:0.6,  z:3, mult:1.3,  reaction:{ type:'breathe', band:'vocals', phase:4.4 } },
  ];
  // Combines this layer's size + X/Y position into one transform — kept in
  // one place so the size slider and the two position sliders never
  // clobber each other's half of the same style string.
  function applyLayerTransform(layer){
    layer.canvas.style.transform = `translate(${layer.offsetX}%, ${layer.offsetY}%) scale(${layer.scale})`;
  }
  const shapeLayers = LAYER_DEFS.map(def => {
    const canvas = document.createElement('canvas');
    canvas.className = 'layerCanvas';
    canvas.style.zIndex = String(def.z);
    canvas.style.mixBlendMode = def.blend;
    layersEl.appendChild(canvas);
    const layer = createLayer({ canvas, bankIdx: def.bank, alpha: true, intervalMult: def.mult, camera, reaction: def.reaction });
    layer.blend = def.blend;
    layer.scale = def.scale;
    layer.offsetX = 0; layer.offsetY = 0;
    layer.label = BANKS[def.bank].label;
    applyLayerTransform(layer);
    return layer;
  });
  // Optional 4th visible layer: synced lyric captions, one line at a time,
  // timed off Whisper's own start/end seconds for that line (see index.html's
  // "Design the visuals" step 2 -> app.runLyricsTranscription). Drawn to a
  // plain 2D canvas with a stacked-shadow trick to fake depth ("3D-ish")
  // since this pipeline is raymarched GLSL, not a mesh scene that could
  // hold real 3D text geometry.
  function createLyricsLayer(initialSegments){
    const canvas = document.createElement('canvas');
    canvas.className = 'layerCanvas';
    canvas.style.zIndex = '5';
    canvas.style.mixBlendMode = 'screen';
    layersEl.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let segments = initialSegments;
    let enabled = true, scale = 1, offsetX = 0, offsetY = 32, curIdx = -1, popT = 0;
    function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener('resize', resize); resize();
    function findActive(t){
      // Segments are sorted by start (Whisper already emits them in order);
      // a small binary-ish linear scan is plenty for a song-length list.
      for (let i = segments.length - 1; i >= 0; i--) {
        if (t >= segments[i].start && t <= segments[i].end + 0.15) return i;
      }
      return -1;
    }
    function step(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!enabled || !audioEl) return;
      const t = audioEl.currentTime;
      const idx = findActive(t);
      if (idx !== curIdx) { curIdx = idx; popT = 0; }
      if (curIdx < 0) return;
      const seg = segments[curIdx];
      popT = Math.min(1, popT + 0.06);
      // ease-out pop, plus a tiny beat-reactive breathe so it doesn't sit dead still
      const pop = 1 - Math.pow(1 - popT, 3);
      const breathe = 1 + (audio.hit ? 0.03 : 0);
      const baseSize = Math.min(canvas.width, canvas.height) * 0.07 * scale;
      const size = baseSize * (0.7 + pop * 0.3) * breathe;
      const cx = canvas.width / 2 + (offsetX / 100) * canvas.width;
      const cy = canvas.height / 2 + (offsetY / 100) * canvas.height;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.font = `700 ${size}px "Arial Black", Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // Stacked, offset, dimming shadow copies read as depth/extrusion —
      // the "3D lyrics" look without any actual 3D text geometry.
      const depth = 10;
      for (let i = depth; i >= 1; i--) {
        ctx.globalAlpha = 0.85 * pop * (1 - i / (depth + 3));
        ctx.fillStyle = '#0a2a33';
        ctx.fillText(seg.text, i * 0.55, i * 0.55);
      }
      ctx.globalAlpha = pop;
      ctx.fillStyle = '#eafeff';
      ctx.shadowColor = '#7ff2ff'; ctx.shadowBlur = size * 0.25;
      ctx.fillText(seg.text, 0, 0);
      ctx.restore();
    }
    return {
      canvas, isLyrics: true, label: 'Lyrics', blend: 'screen',
      get scale(){ return scale; }, set scale(v){ scale = v; },
      get offsetX(){ return offsetX; }, set offsetX(v){ offsetX = v; },
      get offsetY(){ return offsetY; }, set offsetY(v){ offsetY = v; },
      setSegments(v){ segments = v; curIdx = -1; },
      setEnabled(v){ enabled = v; canvas.style.display = v ? 'block' : 'none'; },
      setAutoBeat(){}, setInterval(){},
      step, precompile(){ return Promise.resolve(); },
    };
  }
  const lyricsParam = urlParams.get('lyrics');
  let lyricsSegments = null;
  if (lyricsParam) {
    try { lyricsSegments = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(lyricsParam))))); }
    catch (e) { console.warn('lyrics param parse failed', e); }
  }
  let lyricsLayer = (lyricsSegments && lyricsSegments.length) ? createLyricsLayer(lyricsSegments) : null;

  layers = [bgLayer, ...shapeLayers, lyricsLayer].filter(Boolean);
  // The Design-the-visuals wizard (step 2) transcribes AFTER this page has
  // already loaded, so the lyrics layer can't only come from a URL param at
  // boot — it also has to be creatable/updatable live, mid-session, as soon
  // as a transcript exists, so you see the 3D captions while still editing
  // their timing rather than only after the post is published.
  function setLiveLyrics(segments){
    if (!Array.isArray(segments) || !segments.length) return;
    if (lyricsLayer) { lyricsLayer.setSegments(segments); return; }
    lyricsLayer = createLyricsLayer(segments);
    layers.push(lyricsLayer);
    renderBlendPanel?.();
  }

  // ---- VISUAL DNA: pick each shape layer's arrangement (see deArranged in
  // buildMorphFrag — same 8 shape SDFs, 8 different ways to place them in
  // space: single/flat field/kaleidoscope/fractal tile/cluster/scatter/
  // twist/crystal cage) and a hue offset, all from one seed derived from the
  // song's own URL. Same song -> same look every time it's reopened;
  // different songs -> a genuinely different combination, not just a
  // different shape from the same fixed layout. Arrangement 0 (single) is
  // deliberately in the pool too, so not every song is maximally weird.
  const ARRANGE_NAMES = ['Single','Flat field','Kaleidoscope','Fractal tile','Cluster','Scatter','Twist','Crystal cage'];
  const ARRANGE_COUNT = ARRANGE_NAMES.length;
  function rollVisualDna(rand) {
    shapeLayers.forEach(l => {
      const mode = Math.floor(rand() * ARRANGE_COUNT);
      const seed = rand();
      const hue = rand() * 0.5 - 0.25; // +-0.25 turn of hue drift per layer
      l.setArrange(mode, seed, hue);
    });
    // Background style is chosen live/auto-cycled already (see
    // createBackgroundLayer) — just bias its very first pick per song
    // instead of always starting on Starfield.
    bgLayer.setStyle(Math.floor(rand() * bgLayer.styleNames.length));
    renderBlendPanel?.();
  }
  onSongSeed = (url) => rollVisualDna(mulberry32(hashStr(url)));
  // Manual reroll — a fresh, not-tied-to-the-song combination, for anyone
  // who wants to keep trying combos instead of only getting the one their
  // song's URL happens to land on.
  window._sphereShuffleVisuals = () => rollVisualDna(mulberry32((Math.random()*4294967296)|0));

  // Waveform-detected "big switch" moments, sent from the post composer's
  // timeline editor (or the feed player, for an already-published post) —
  // unlike each layer's own continuous auto-switching, this is a structural
  // accent: every shape layer + the background style jump together right at
  // a point the song itself actually changes.
  let switchPoints = [];
  let switchPointFired = -1, switchPointLastT = 0;
  function bigSwitch() {
    const tNow = clock.getElapsedTime();
    shapeLayers.forEach(l => l.bigSwitch(tNow));
    bgLayer.setStyle(bgLayer.styleIdx + 1 + Math.floor(Math.random() * (bgLayer.styleNames.length - 1)));
    bgLayer.triggerGlitch(); // ties a glitch burst to a real waveform-detected song event
    cameraBeatFlourish();
  }
  function checkSwitchPoints() {
    if (!switchPoints.length || !audioEl) return;
    const ct = audioEl.currentTime;
    if (ct < switchPointLastT - 1) switchPointFired = -1; // song looped back to the top
    switchPointLastT = ct;
    let idx = -1;
    for (let i = 0; i < switchPoints.length; i++) { if (switchPoints[i] <= ct) idx = i; else break; }
    if (idx < 0 || idx === switchPointFired) return;
    switchPointFired = idx;
    bigSwitch();
  }
  onFrameExtra = checkSwitchPoints;
  // Blended mode's own playback-control listener — the driven branch above
  // has its own copy since it also handles setShape, which doesn't apply
  // here (no single "active shape" for blended mode to set).
  addEventListener('message', e => {
    if (e.data?.type === 'switchPoints' && Array.isArray(e.data.times)) {
      switchPoints = e.data.times.slice().sort((a, b) => a - b);
      switchPointFired = -1;
    }
    if (e.data?.type === 'lyrics' && Array.isArray(e.data.segments)) {
      setLiveLyrics(e.data.segments);
    }
    if (e.data?.type === 'setUiVisible') {
      // The wizard shares one persistent iframe across both steps so
      // playback and the live lyrics layer survive step changes — this
      // lets index.html hide the uploader's own layer-mix bar/panel once
      // they've moved past step 1, without reloading it.
      const show = !!e.data.visible;
      const bar = document.getElementById('bar'); if (bar) bar.style.display = show ? '' : 'none';
      const bp = document.getElementById('blendPanel'); if (bp) bp.style.display = show ? '' : 'none';
    }
    if (e.data?.type === 'setActive') {
      if (e.data.active) {
        if (audioEl && isFinite(e.data.time) && Math.abs(audioEl.currentTime - e.data.time) > 0.4) audioEl.currentTime = e.data.time;
        actx?.resume().catch(()=>{}); audioEl?.play().catch(()=>{});
      }
      else audioEl?.pause();
    }
    if (e.data?.type === 'mute' && audioEl) {
      audioEl.muted = !!e.data.muted;
      if (!e.data.muted) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
    if (e.data?.type === 'play' && audioEl) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    if (e.data?.type === 'pause' && audioEl) audioEl.pause();
    if (e.data?.type === 'seek' && audioEl && isFinite(e.data.time)) audioEl.currentTime = e.data.time;
    if (e.data?.type === 'volume' && audioEl) {
      audioEl.volume = e.data.value; audioEl.muted = e.data.value <= 0;
      if (e.data.value > 0) { actx?.resume().catch(()=>{}); audioEl.play().catch(()=>{}); }
    }
  });

  const BLEND_MODES = ['normal','multiply','screen','difference','exclusion','overlay','lighten','darken'];
  function renderBlendPanel(){
    const wrap = document.getElementById('blendPanel');
    wrap.innerHTML = '';
    // Collapsible header — this panel used to permanently cover part of the
    // screen with no way to shrink it out of the way while just watching.
    // Collapsed, it's just this title bar.
    const head = document.createElement('div');
    head.className = 'bp-head';
    head.innerHTML = `<span>Layers</span><button class="bp-collapse" title="Collapse">▾</button>`;
    const body = document.createElement('div');
    body.className = 'bp-body';
    head.addEventListener('click', () => setBlendPanelCollapsed(!wrap.classList.contains('collapsed')));
    wrap.appendChild(head);
    wrap.appendChild(body);
    // Switch-interval control used to be its own floating panel sitting at
    // the exact same screen position as this one — pressing its toggle
    // opened it directly underneath this panel where it was invisible. It's
    // just a row in here now instead of a second overlapping panel.
    const ctlRow = document.createElement('div');
    ctlRow.className = 'ctl-row';
    ctlRow.innerHTML = `<span class="ctl-label">switch every (max)</span>
      <input id="switchIntervalCtl" type="range" min="4" max="30" step="1" value="14">`;
    ctlRow.querySelector('input').addEventListener('input', e => {
      layers.forEach(l => l.setInterval(+e.target.value));
    });
    body.appendChild(ctlRow);
    // Re-rolls the whole per-song "visual DNA" combination — the automatic
    // pick from the song's own URL is still what a fresh post loads with,
    // this just lets anyone keep trying new combinations on top of it.
    const shuffleBtn = document.createElement('button');
    shuffleBtn.textContent = '🎲 Shuffle visuals';
    shuffleBtn.style.cssText = 'background:rgba(139,155,255,.18);color:#cdd4ff;border:1px solid #8b9bff;border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;';
    shuffleBtn.addEventListener('click', () => window._sphereShuffleVisuals?.());
    body.appendChild(shuffleBtn);
    layers.forEach((layer, i) => {
      const row = document.createElement('div');
      row.className = 'layerRow';
      if (layer.isBackground) {
        // Background has no blend mode of its own (it's the base everything
        // else composites onto) or a size to scale — its dropdown picks
        // which of its 4 style presets is active instead.
        const styleOpts = layer.styleNames.map((n,idx) => `<option value="${idx}"${idx===layer.styleIdx?' selected':''}>${n}</option>`).join('');
        row.innerHTML = `
          <div class="lr-head">
            <input type="checkbox" checked>
            <span>${layer.label}</span>
          </div>
          <select>${styleOpts}</select>
        `;
        row.querySelector('input[type=checkbox]').addEventListener('change', e=>{
          layer.setEnabled(e.target.checked);
        });
        row.querySelector('select').addEventListener('change', e=>{
          layer.setStyle(+e.target.value, true);
        });
        body.appendChild(row);
        return;
      }
      if (layer.isLyrics) {
        // No blend-mode or arrangement pick — just enable + size/X/Y,
        // since it's a plain 2D text overlay.
        row.innerHTML = `
          <div class="lr-head">
            <input type="checkbox" checked>
            <span>${layer.label}</span>
          </div>
          <div class="lr-size"><span>size</span><input class="lr-scale" type="range" min="0.4" max="2" step="0.05" value="${layer.scale}"></div>
          <div class="lr-size"><span>x</span><input class="lr-offx" type="range" min="-50" max="50" step="1" value="${layer.offsetX}"></div>
          <div class="lr-size"><span>y</span><input class="lr-offy" type="range" min="-50" max="50" step="1" value="${layer.offsetY}"></div>
        `;
        row.querySelector('input[type=checkbox]').addEventListener('change', e=>{ layer.setEnabled(e.target.checked); });
        row.querySelector('.lr-scale').addEventListener('input', e=>{ layer.scale = +e.target.value; });
        row.querySelector('.lr-offx').addEventListener('input', e=>{ layer.offsetX = +e.target.value; });
        row.querySelector('.lr-offy').addEventListener('input', e=>{ layer.offsetY = +e.target.value; });
        body.appendChild(row);
        return;
      }
      const modeOpts = BLEND_MODES.map(m => `<option value="${m}"${m===layer.blend?' selected':''}>${m}</option>`).join('');
      const curArrange = layer.getArrange ? layer.getArrange().mode : 0;
      const arrangeOpts = ARRANGE_NAMES.map((n,idx) => `<option value="${idx}"${idx===curArrange?' selected':''}>${n}</option>`).join('');
      row.innerHTML = `
        <div class="lr-head">
          <input type="checkbox" checked>
          <span>${layer.label}</span>
        </div>
        <select class="lr-blend">${modeOpts}</select>
        <select class="lr-arrange">${arrangeOpts}</select>
        <div class="lr-size"><span>size</span><input class="lr-scale" type="range" min="0.3" max="1.8" step="0.05" value="${layer.scale}"></div>
        <div class="lr-size"><span>x</span><input class="lr-offx" type="range" min="-50" max="50" step="1" value="${layer.offsetX}"></div>
        <div class="lr-size"><span>y</span><input class="lr-offy" type="range" min="-50" max="50" step="1" value="${layer.offsetY}"></div>
      `;
      row.querySelector('input[type=checkbox]').addEventListener('change', e=>{
        layer.setEnabled(e.target.checked);
      });
      row.querySelector('.lr-blend').addEventListener('change', e=>{
        layer.blend = e.target.value;
        layer.canvas.style.mixBlendMode = e.target.value;
      });
      row.querySelector('.lr-arrange').addEventListener('change', e=>{
        // Keep this layer's existing seed/hue — only the placement style
        // changes, so picking "Kaleidoscope" doesn't also reroll the color.
        const cur = layer.getArrange();
        layer.setArrange(+e.target.value, cur.seed, cur.hue);
      });
      row.querySelector('.lr-scale').addEventListener('input', e=>{
        layer.scale = +e.target.value;
        applyLayerTransform(layer);
      });
      row.querySelector('.lr-offx').addEventListener('input', e=>{
        layer.offsetX = +e.target.value;
        applyLayerTransform(layer);
      });
      row.querySelector('.lr-offy').addEventListener('input', e=>{
        layer.offsetY = +e.target.value;
        applyLayerTransform(layer);
      });
      body.appendChild(row);
    });
  }
  renderBlendPanel();

  document.getElementById('beatBtn').addEventListener('click', ()=>{
    autoBeatGlobal = !autoBeatGlobal;
    const btn = document.getElementById('beatBtn');
    btn.classList.toggle('on', autoBeatGlobal);
    btn.textContent = autoBeatGlobal ? '⚡ Auto: ON' : '⏸ Auto: OFF';
    layers.forEach(l => l.setAutoBeat(autoBeatGlobal));
  });
}
let autoBeatGlobal = true;

// The bottom bar's ⚙ Controls button used to open a SEPARATE floating panel
// sitting at the exact same screen position as the Layers panel — pressing
// it opened content directly underneath the Layers panel where it was
// completely covered and invisible ("nothing happens"). The switch-interval
// slider now lives inside the Layers panel itself (see renderBlendPanel), so
// ⚙ just collapses/expands that one panel — same action as its own header.
function setBlendPanelCollapsed(collapsed){
  const wrap = document.getElementById('blendPanel');
  wrap.classList.toggle('collapsed', collapsed);
  const chevron = wrap.querySelector('.bp-collapse');
  if (chevron) chevron.textContent = collapsed ? '▸' : '▾';
  document.getElementById('ctlBtn')?.classList.toggle('on', !collapsed);
}
const ctlBtn = document.getElementById('ctlBtn');
ctlBtn.addEventListener('click', ()=>{
  const wrap = document.getElementById('blendPanel');
  setBlendPanelCollapsed(!wrap.classList.contains('collapsed'));
});
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});

// ---- render loop (shared clock/audio driving every layer) ----
function loop(){
  const dt = clock.getDelta(), t = clock.getElapsedTime();
  sampleAudio();
  if (audio.hit) cameraBeatFlourish();
  stepCamera(dt, t);
  layers.forEach(l => l.step(dt, t));
  onFrameExtra?.(); // blended mode hooks its switch-point check in here
  requestAnimationFrame(loop);
}
// Compile every active layer's shader with the "Preparing visuals… N%"
// overlay up before this starts — a silent spinner with no number is exactly
// what makes people give up on a slow load thinking it's dead. The % is a
// real signal (each layer resolving its own precompile is one genuine
// milestone out of however many layers exist) with a slow time-based floor
// underneath so it keeps visibly creeping between those milestones instead
// of sitting dead on one number for several seconds.
const prepText = document.getElementById('prepText');
const totalLayers = layers.length;
let doneLayers = 0;
let prepSettled = false;
const prepStartT = performance.now();
function renderPrepPct(){
  const elapsedFrac = Math.min(1, ((performance.now()-prepStartT)/1000) / (driven ? 3.5 : 24));
  const layerFrac = doneLayers / totalLayers;
  return Math.min(97, Math.round(Math.max(layerFrac, elapsedFrac*0.9) * 100));
}
function tickPrep(){
  if (prepSettled) return;
  prepText.textContent = `Preparing visuals… ${renderPrepPct()}%`;
  requestAnimationFrame(tickPrep);
}
const settlePrep = () => {
  if (prepSettled) return;
  prepSettled = true;
  prepText.textContent = 'Preparing visuals… 100%';
  document.getElementById('prep').classList.add('hidden');
};
const precompiles = layers.map(l => l.precompile().finally(() => { doneLayers++; }));
Promise.all(precompiles).finally(settlePrep);
// This is a genuine last-resort backstop (something actually stuck), not a
// normal path — it used to fire at 9s in blended mode while real compiles
// were still running well past that on a slower machine, which hid the
// progress overlay and claimed "100%" while the page then sat frozen with
// zero feedback for the rest of the real compile. The real Promise.all
// above is what should settle it in virtually every case now.
setTimeout(settlePrep, driven ? 12000 : 45000);
tickPrep();
loop();

// ---- feed embed: ?song=<url>[&muted=1] + postMessage({type:'song'|'setActive'|'mute'}) ----
const songParam = new URLSearchParams(location.search).get('song');
const mutedParam = new URLSearchParams(location.search).get('muted') === '1';
const startTimeParam = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const activeParam = new URLSearchParams(location.search).get('active') !== '0';
if (songParam) loadSongUrl(decodeURIComponent(songParam), mutedParam, startTimeParam, activeParam);
// Public viewer (inline Feed preview, or a post opened fullscreen): the
// layer-mixing panel and bottom bar are the uploader's own editing tools
// from "Design the visuals" — a viewer just watching a published post
// should only ever see the visual itself.
if (isPublicViewer) {
  const bar = document.getElementById('bar'); if (bar) bar.style.display = 'none';
  const bp = document.getElementById('blendPanel'); if (bp) bp.style.display = 'none';
}
// Standalone open (no ?song=, not the feed embed, not driven) never had any
// way to actually pick a song — the whole page only ever expected one to
// arrive via the URL or postMessage from an embedding parent. This gives
// the raw link its own file picker so it's testable on its own, using a
// local object URL (no upload needed just to try it).
const loadSongWrap = document.getElementById('loadSongWrap');
if (!songParam && !driven) {
  document.getElementById('loadSongBtn').addEventListener('click', () => document.getElementById('loadSongFile').click());
  document.getElementById('loadSongFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    loadSongUrl(URL.createObjectURL(file), false, 0, true);
    loadSongWrap.style.display = 'none';
  });
} else if (loadSongWrap) {
  loadSongWrap.style.display = 'none';
}
// Fallback: a real tap/drag directly on this canvas (orbiting, switching modes)
// is a genuine gesture in THIS frame. AudioContext.resume() alone isn't
// enough — the <audio> element's own play() call is a SEPARATE autoplay gate
// and needs its own retry once we're inside a real gesture.
addEventListener('pointerdown', () => {
  actx?.resume().catch(()=>{});
  if (audioEl && !audioEl.muted) audioEl.play().catch(()=>{});
}, { once: true });

// ---- kiosk: hide nothing here by default (bar is already minimal), but
// keep the API surface consistent with destinys-child's embed pattern.
</script>
</body>
</html>
